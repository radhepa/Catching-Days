<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Music pet · five concepts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Young+Serif&display=swap">
<style>
:root{--panel:#fbf8f2;--panel2:#f1ebdf;--line:#e4dccd;--tx:#1f2e2c;--dim:#5f6b67;--focus:#2f7a74;--koi:#ec7a45;--deep:#0f3b41;--serif:'Young Serif',Georgia,serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.5 'Outfit','Segoe UI',sans-serif;color:var(--tx);
  background:linear-gradient(170deg,#1f5a5e 0%,#3f7f7c 45%,#8fbcb3 100%);padding:36px 28px 60px}
header{max-width:1180px;margin:0 auto 26px;color:#fbf8f2;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{font:400 34px/1.1 var(--serif);margin:0 0 6px}
header p{margin:0;opacity:.85;max-width:620px}
#play{border:none;border-radius:14px;padding:12px 18px;background:var(--panel);color:var(--deep);font:600 15px 'Outfit',sans-serif;cursor:pointer;display:flex;gap:10px;align-items:center}
#play i{width:0;height:0;border-left:11px solid var(--koi);border-top:7px solid transparent;border-bottom:7px solid transparent}
body.playing #play i{width:11px;height:13px;border:none;border-left:4px solid var(--koi);border-right:4px solid var(--koi)}
main{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{background:var(--panel);border-radius:22px;padding:18px 22px 22px;box-shadow:0 10px 30px rgba(10,30,32,.22)}
.stagebox{height:240px;border-radius:16px;background:radial-gradient(ellipse at 50% 85%,#d7ebe4 0%,#eaf3ee 45%,#f4efe6 100%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.stagebox svg{width:230px;height:230px;overflow:visible}
.num{color:#a9482a;font:600 12px/1 'Outfit';letter-spacing:.14em;text-transform:uppercase;margin:16px 0 2px}
h2{font:400 26px/1.15 var(--serif);margin:0}
.kind{color:var(--dim);font-size:14px;margin:2px 0 10px}
.card p{margin:0 0 10px}
dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;background:var(--panel2);border-radius:12px;padding:12px 14px}
dt{color:var(--focus);font-weight:600}
dd{margin:0}
.say{font-style:italic;color:#4a5a56;border-left:3px solid var(--koi);padding-left:10px}

/* ── motion (house rule: every moving group pivots on its own 0,0) ── */
svg *{transform-box:view-box;transform-origin:0 0}
.mp-breathe{animation:mp-breathe 4.6s ease-in-out infinite}
.mp-blink{animation:mp-blink 7.3s ease-in-out infinite}
.mp-ring{animation:mp-ring 5.2s ease-out infinite}.mp-ring.two{animation-delay:-2.6s}
.mp-float{animation:mp-float 4.2s ease-in-out infinite}
.mp-shadow{animation:mp-shadow 4.2s ease-in-out infinite}
.mp-glow{animation:mp-glow 3.6s ease-in-out infinite}
.mp-closed{opacity:0}
.mp-notes,.mp-waves{opacity:0}
@keyframes mp-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.024)}}
@keyframes mp-blink{0%,91%,96%,100%{transform:scaleY(1)}93%,94%{transform:scaleY(.1)}}
@keyframes mp-ring{0%{transform:scale(.82);opacity:0}25%{opacity:1}100%{transform:scale(1.22);opacity:0}}
@keyframes mp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mp-shadow{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
@keyframes mp-glow{0%,100%{opacity:.45}50%{opacity:.62}}

/* playing: the record turns, heads nod, notes rise */
.playing .mp-spin{animation:mp-spin 1.8s linear infinite}
.playing .mp-spin.fast{animation-duration:.9s}
.playing .mp-nod{animation:mp-nod .86s ease-in-out infinite}
.playing .mp-sway{animation:mp-sway 1.72s ease-in-out infinite}
.playing .mp-sway.b{animation-delay:-.86s}
.playing .mp-pulse{animation:mp-pulse .43s ease-in-out infinite alternate}
.playing .mp-glow{animation:mp-glowp .86s ease-in-out infinite}
.playing .mp-open{opacity:0}
.playing .mp-closed{opacity:1}
.playing .mp-notes{opacity:1}
.playing .mp-note{animation:mp-note 2.6s ease-out infinite}
.playing .mp-note.n2{animation-delay:-.9s}.playing .mp-note.n3{animation-delay:-1.75s}
.playing .mp-waves{opacity:1}
.playing .mp-wave{animation:mp-wave 1.72s ease-out infinite}.playing .mp-wave.w2{animation-delay:-.86s}
@keyframes mp-spin{to{transform:rotate(360deg)}}
@keyframes mp-nod{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg) translateY(.6px)}}
@keyframes mp-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes mp-pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes mp-glowp{0%,100%{opacity:.5}50%{opacity:.85}}
@keyframes mp-note{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translate(10px,-34px) scale(1);opacity:0}}
@keyframes mp-wave{0%{transform:scale(.7);opacity:0}30%{opacity:.8}100%{transform:scale(1.25);opacity:0}}
/* the kappa: blink and glance while she waits; record, rock, baton and drops while it plays */
.kp-blink{animation:kp-blink 6.8s ease-in-out infinite}
.kp-gaze{animation:kp-gaze 12s ease-in-out infinite}
.kp-arm{transform:rotate(-33deg);transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.kp-closed,.kp-drops{opacity:0}
.playing .kp-arm{transform:rotate(0deg)}
.playing .kp-open{opacity:0;animation:kp-peek 9.2s linear infinite}
.playing .kp-closed{opacity:1;animation:kp-peekc 9.2s linear infinite}
.playing .kp-bob{animation:kp-bob .86s ease-in-out infinite}
.playing .kp-rock{animation:kp-rock 1.72s ease-in-out infinite}
.playing .kp-baton{animation:kp-baton 1.72s ease-in-out infinite}
.playing .kp-ripple{animation:kp-ripple 1.72s ease-out infinite}
.playing .kp-drops{opacity:1}
.playing .kp-drop{animation:kp-drop 1.72s ease-out infinite}
.playing .kp-drop.d2{animation-delay:-.86s}
@keyframes kp-blink{0%,90%,96%,100%{transform:scaleY(1)}92.5%,94%{transform:scaleY(3.1)}}
@keyframes kp-gaze{0%,36%,92%,100%{transform:translate(0,0)}40%,56%{transform:translate(-1.3px,.2px)}60%,76%{transform:translate(1.2px,.3px)}80%{transform:translate(0,0)}}
@keyframes kp-peek{0%,82%{opacity:0}84%,94%{opacity:1}96%,100%{opacity:0}}
@keyframes kp-peekc{0%,82%{opacity:1}84%,94%{opacity:0}96%,100%{opacity:1}}
@keyframes kp-bob{0%,100%{transform:none}50%{transform:translateY(1.1px) scale(1.014,.984)}}
@keyframes kp-rock{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
@keyframes kp-baton{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}}
@keyframes kp-ripple{0%{transform:scale(.9);opacity:0}30%{opacity:1}100%{transform:scale(1.06);opacity:0}}
@keyframes kp-drop{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.95}55%{transform:translate(4px,-9px) scale(1)}100%{transform:translate(8px,4px) scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style>
<body class="playing">
<header>
  <div>
    <h1>The music pet: five concepts</h1>
    <p>Each one lives on your desktop beside the toad and plays the music already on your computer: no YouTube, no feed, nothing to scroll. They're drawn like the pond's toads. Press the button to see each one idle and playing. Pick one and I'll build it.</p>
  </div>
  <button id="play"><i></i><span>Pause the music</span></button>
</header>
<main id="cards"></main>

<script>
'use strict';
const r2=n=>+n.toFixed(2);
let seq=0;

/* ── shared bits, in the toads' grammar ── */
/* the lily pad and its ripples (the same pad the toads sit on) */
function pad(ID){
  const ring=(c,cls)=>`<g transform="translate(0 6)"><g class="${cls}"><ellipse rx="70" ry="13" fill="none" stroke="${c}" stroke-width=".9" opacity=".32"/></g></g>`;
  const p='M0 3.5 L30.4 13.5 A62 11.5 0 1 0 12.6 14.75 Z';
  const veins=[200,225,250,275,300,325,350,15,40,140,165].map(a=>{ const t=a*Math.PI/180;
    return `M0 3.5 L${r2(57*Math.cos(t))} ${r2(3.5+10.6*Math.sin(t))}`; }).join(' ');
  return `<linearGradient id="${ID}pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8db58a"/><stop offset=".55" stop-color="#6f9e7a"/><stop offset="1" stop-color="#5a8d69"/></linearGradient>
    ${ring('#cfe9e3','mp-ring')}${ring('#cfe9e3','mp-ring two')}
    <path d="${p}" transform="translate(0 1.7)" fill="#3a6a51"/>
    <path d="${p}" fill="url(#${ID}pad)"/>
    <path d="${veins}" stroke="#a9c795" stroke-width=".5" opacity=".45" fill="none"/>
    <path d="M-61.4 2.2 C-50 -6 50 -6 61.4 2.2" fill="none" stroke="#b9d29f" stroke-width=".7" opacity=".7"/>
    <ellipse cx="0" cy="1.6" rx="47" ry="4.4" fill="#173a3b" opacity=".32"/>
    <ellipse cx="0" cy="1" rx="34" ry="2.4" fill="#173a3b" opacity=".2"/>`;
}
/* body paint: pearl at the top, the colour, deep pond at the very bottom */
const skin=(id,c1,c2,c3,y1=-80)=>`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${y1}" x2="0" y2="1"><stop offset="0" stop-color="#fff8e9"/><stop offset=".24" stop-color="${c1}"/><stop offset=".82" stop-color="${c2}"/><stop offset=".95" stop-color="${c3}"/><stop offset="1" stop-color="#173a3b"/></linearGradient>`;
/* a round dark eye with the house glint, blinking about its centre */
const eye=(cx,cy,r)=>`<g transform="translate(${cx} ${cy})"><g class="mp-blink">
  <ellipse rx="${r}" ry="${r2(r*1.08)}" fill="#1f2e2c"/>
  <circle cx="${r2(r*.34)}" cy="${r2(-r*.36)}" r="${r2(r*.36)}" fill="#ffffff" opacity=".92"/>
  <circle cx="${r2(-r*.4)}" cy="${r2(r*.42)}" r="${r2(r*.15)}" fill="#ffffff" opacity=".55"/></g></g>`;
/* a shut, happy eye (shown while the music plays) */
const shut=(cx,cy,w,c='#3a2a22')=>`<path d="M${cx-w} ${cy} Q${cx} ${r2(cy-w*.95)} ${cx+w} ${cy}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>`;
/* a vinyl record of radius R: grooves, a coloured label, a mark so the turn reads */
function record(ID,R,label,mark='#fff8e9'){
  const g=[.92,.82,.72,.62,.52].map(k=>`<circle r="${r2(R*k)}" fill="none" stroke="#6d7f7a" stroke-width="${r2(R*.012+.15)}" opacity=".45"/>`).join('');
  return `<circle r="${R}" fill="url(#${ID}vinyl)" stroke="#0e1514" stroke-width=".7"/>${g}
    <path d="M${r2(-R*.86)} ${r2(-R*.3)} A${r2(R*.91)} ${r2(R*.91)} 0 0 1 ${r2(-R*.3)} ${r2(-R*.86)}" fill="none" stroke="#c9d6d2" stroke-width="${r2(R*.05)}" opacity=".35" stroke-linecap="round"/>
    <circle r="${r2(R*.36)}" fill="${label}"/>
    <path d="M${r2(-R*.22)} ${r2(-R*.1)} A${r2(R*.24)} ${r2(R*.24)} 0 0 1 ${r2(R*.22)} ${r2(-R*.1)}" fill="none" stroke="${mark}" stroke-width="${r2(R*.05)}" stroke-linecap="round" opacity=".85"/>
    <circle cy="${r2(R*.2)}" r="${r2(R*.05)}" fill="${mark}" opacity=".8"/>
    <circle r="${r2(R*.06)}" fill="#1f2e2c"/>`;
}
const vinylDef=ID=>`<radialGradient id="${ID}vinyl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3d4c49"/><stop offset=".7" stop-color="#22302e"/><stop offset="1" stop-color="#141d1c"/></radialGradient>`;
/* music notes that rise from (x,y) while it plays */
function notes(x,y,c='#2f7a74'){
  const n=(dx,dy,cls,s)=>`<g transform="translate(${x+dx} ${y+dy})"><g class="mp-note ${cls}"><g transform="scale(${s})">
    <ellipse cx="0" cy="0" rx="3" ry="2.2" transform="rotate(-20)" fill="${c}"/><path d="M2.6 -.6 L2.6 -10 Q5.6 -8.6 7 -6" fill="none" stroke="${c}" stroke-width="1.1" stroke-linecap="round"/></g></g></g>`;
  return `<g class="mp-notes">${n(0,0,'',1)}${n(8,6,'n2',.8)}${n(-6,8,'n3',.9)}</g>`;
}
/* sound rings either side of (x,y) */
function waves(x,y,c='#2f7a74'){
  const w=(s,cls)=>`<g transform="translate(${x} ${y})"><g class="mp-wave ${cls}"><path d="M${s*28} -9 Q${s*33} 0 ${s*28} 9" fill="none" stroke="${c}" stroke-width="1.3" stroke-linecap="round"/><path d="M${s*34} -13 Q${s*41} 0 ${s*34} 13" fill="none" stroke="${c}" stroke-width="1" stroke-linecap="round" opacity=".6"/></g></g>`;
  return `<g class="mp-waves">${w(1,'')}${w(-1,'w2')}${w(1,'w2')}${w(-1,'')}</g>`;
}
const blush=(cx,cy,rx=4.6)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${r2(rx*.55)}" fill="#ec7a45" opacity=".26"/>`;

/* ═══════════ 1 · Uta, the record-shell snail (animal) ═══════════ */
function uta(ID){
  const spiral=(()=>{ let d=''; for(let i=0;i<=60;i++){ const t=i/60*Math.PI*4, r=11.5+t*1.38; d+=(i?'L':'M')+r2(r*Math.cos(t))+' '+r2(r*Math.sin(t)); } return d; })();
  const BODY='M-52 0 C-57 -3 -52 -9 -42 -9 L23 -9 C27 -11 29 -19 30 -29 C31.4 -41 37 -49 45.6 -49 C54.4 -49 59 -41 58 -30 C57 -19 55.4 -10 59.4 -5.6 C61.6 -3.2 63 0 59 0 Z';
  const stalk=(bx,by,tx,ty,cls)=>`<g transform="translate(${bx} ${by})"><g class="mp-sway ${cls}"><g transform="translate(${-bx} ${-by})">
    <path d="M${bx} ${by} Q${r2((bx+tx)/2+(tx>bx?-3:3))} ${r2((by+ty)/2)} ${tx} ${ty}" fill="none" stroke="#9cb98a" stroke-width="5" stroke-linecap="round"/>
    <path d="M${bx} ${by} Q${r2((bx+tx)/2+(tx>bx?-3:3))} ${r2((by+ty)/2)} ${tx} ${ty}" fill="none" stroke="url(#${ID}skin)" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="${tx}" cy="${ty}" r="5.6" fill="url(#${ID}skin)" stroke="#9cb98a" stroke-width=".6"/>
    ${eye(tx+1,ty+.4,2.7)}</g></g></g>`;
  return `<defs>${skin(ID+'skin','#eef3dc','#c3d7a6','#8fae7f',-78)}${vinylDef(ID)}
    <radialGradient id="${ID}label" cx=".4" cy=".38" r=".7"><stop offset="0" stop-color="#f6a06a"/><stop offset=".5" stop-color="#ec7a45"/><stop offset="1" stop-color="#c9563a"/></radialGradient>
    <clipPath id="${ID}bc"><path d="${BODY}"/></clipPath></defs>
  ${pad(ID)}
  <g class="mp-breathe">
    <path d="${BODY}" fill="url(#${ID}skin)" stroke="#9cb98a" stroke-width=".6"/>
    <g clip-path="url(#${ID}bc)">
      <ellipse cx="46" cy="-40" rx="8" ry="4" fill="#ffffff" opacity=".35" transform="rotate(-20 46 -40)"/>
      <path d="M-60 -3.2 L66 -3.2 L66 2 L-60 2Z" fill="#6d8f6a" opacity=".22"/>
      ${[[40,-22,.9],[48,-14,.7],[52,-26,.6],[-44,-5,.6],[30,-5.5,.6]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff" opacity=".45"/>`).join('')}
    </g>
    ${stalk(41,-46,33,-71,'')}${stalk(50,-47,57,-72,'b')}
    <path d="M57.4 -24 q3 1.6 4.6 5 M55.6 -20.4 q2.4 2 3 5.4" fill="none" stroke="#9cb98a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M47 -31.5 Q51.5 -28.2 56 -31.8" fill="none" stroke="#3a2a22" stroke-width="1.2" stroke-linecap="round"/>
    ${blush(44.6,-35.4,3.6)}
    <!-- the shell is a record: it turns while the music plays -->
    <g transform="translate(-9 -40)">
      <circle r="31.6" cx="1.2" cy="2" fill="#0f1716" opacity=".22"/>
      <g class="mp-spin">${record(ID,31,`url(#${ID}label)`)}
        <path d="${spiral}" fill="none" stroke="#8fa39d" stroke-width=".45" opacity=".35"/></g>
      <circle r="31" fill="none" stroke="#eef3dc" stroke-width="1.3" opacity=".3"/>
      <path d="M-25 -12 A27 27 0 0 1 -9 -25.6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity=".2"/>
      <ellipse cx="17" cy="16" rx="6" ry="1.8" fill="#ffffff" opacity=".1" transform="rotate(-45 17 16)"/>
    </g>
  </g>
  ${notes(50,-84)}`;
}

/* ═══════════ 2 · Nagi, the otter with a shell speaker (animal) ═══════════ */
function nagi(ID){
  const BODY='M0 0 C20 0 34 -4 36 -18 C38 -32 31 -44 20 -48 L-20 -48 C-31 -44 -38 -32 -36 -18 C-34 -4 -20 0 0 0Z';
  const ribs=[-14,-9,-4.5,0,4.5,9,14].map(x=>`M0 -13 L${x} -42`).join(' ');
  return `<defs>${skin(ID+'fur','#d6b08a','#a6764f','#7a5236',-86)}
    <radialGradient id="${ID}cream" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fffbf2"/><stop offset="1" stop-color="#efdcbb"/></radialGradient>
    <linearGradient id="${ID}shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde9dc"/><stop offset=".6" stop-color="#f2bfa6"/><stop offset="1" stop-color="#d98e72"/></linearGradient>
    <radialGradient id="${ID}cone" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5e4636"/><stop offset=".6" stop-color="#3a2a22"/><stop offset="1" stop-color="#241a15"/></radialGradient>
    <clipPath id="${ID}bc"><path d="${BODY}"/></clipPath></defs>
  ${pad(ID)}
  <g class="mp-breathe">
    <!-- the tail, curled round behind her -->
    <path d="M24 -5 C40 -3 53 -11 55 -26 C55.8 -32.6 50.6 -35 47.4 -30.4 C45.4 -22 38 -16.4 26 -16Z" fill="url(#${ID}fur)" stroke="#6b4a2f" stroke-width=".5"/>
    <path d="${BODY}" fill="url(#${ID}fur)" stroke="#6b4a2f" stroke-width=".6"/>
    <g clip-path="url(#${ID}bc)">
      <ellipse cx="0" cy="-20" rx="23" ry="20" fill="url(#${ID}cream)" opacity=".92"/>
      <ellipse cx="0" cy="-2" rx="30" ry="3.4" fill="#173a3b" opacity=".14"/>
    </g>
    <ellipse cx="-16" cy="-1.6" rx="8.4" ry="3.4" fill="#7a5236" stroke="#5e4030" stroke-width=".5"/>
    <ellipse cx="16" cy="-1.6" rx="8.4" ry="3.4" fill="#7a5236" stroke="#5e4030" stroke-width=".5"/>
    <!-- the shell speaker she hugs: the cone thumps with the beat -->
    <path d="M-5 -13 L-19 -34 C-15 -45.5 15 -45.5 19 -34 L5 -13Z" fill="url(#${ID}shell)" stroke="#b5735c" stroke-width=".6"/>
    <path d="${ribs}" stroke="#d08a6e" stroke-width=".55" opacity=".6"/>
    <path d="M-7 -15 L-9 -11.5 L9 -11.5 L7 -15Z" fill="#e9a58c" stroke="#b5735c" stroke-width=".5"/>
    <g transform="translate(0 -31)"><g class="mp-pulse">
      <circle r="8.2" fill="url(#${ID}cone)" stroke="#fde9dc" stroke-width="1"/>
      <circle r="5.4" fill="none" stroke="#7a5a48" stroke-width=".6"/>
      <circle r="2.4" fill="#5e4636" stroke="#9a7a66" stroke-width=".5"/>
      <circle cx="-.8" cy="-.9" r=".7" fill="#ffffff" opacity=".5"/></g></g>
    <ellipse cx="-17.5" cy="-29" rx="5.4" ry="6.4" fill="url(#${ID}fur)" stroke="#6b4a2f" stroke-width=".5"/>
    <ellipse cx="17.5" cy="-29" rx="5.4" ry="6.4" fill="url(#${ID}fur)" stroke="#6b4a2f" stroke-width=".5"/>
    <path d="M-14.4 -31 l2.4 .4 M-14 -28 l2.6 .2 M14.4 -31 l-2.4 .4 M14 -28 l-2.6 .2" stroke="#6b4a2f" stroke-width=".55" stroke-linecap="round"/>
    <!-- the head, nodding along -->
    <g transform="translate(0 -46)"><g class="mp-nod"><g transform="translate(0 46)">
      <circle cx="-20.5" cy="-79" r="5.6" fill="url(#${ID}fur)" stroke="#6b4a2f" stroke-width=".5"/><circle cx="-20.5" cy="-78.6" r="2.6" fill="#5e4030" opacity=".7"/>
      <circle cx="20.5" cy="-79" r="5.6" fill="url(#${ID}fur)" stroke="#6b4a2f" stroke-width=".5"/><circle cx="20.5" cy="-78.6" r="2.6" fill="#5e4030" opacity=".7"/>
      <ellipse cx="0" cy="-64" rx="25.5" ry="21.5" fill="url(#${ID}fur)" stroke="#6b4a2f" stroke-width=".6"/>
      <ellipse cx="-9" cy="-80" rx="11" ry="2.6" fill="#ffffff" opacity=".18" transform="rotate(-8 -9 -80)"/>
      <ellipse cx="-8.4" cy="-55.6" rx="10" ry="8" fill="url(#${ID}cream)"/>
      <ellipse cx="8.4" cy="-55.6" rx="10" ry="8" fill="url(#${ID}cream)"/>
      <ellipse cx="-11" cy="-72.6" rx="3.4" ry="1.8" fill="#efdcbb" opacity=".8"/><ellipse cx="11" cy="-72.6" rx="3.4" ry="1.8" fill="#efdcbb" opacity=".8"/>
      <g class="mp-open">${eye(-11,-67,3.1)}${eye(11,-67,3.1)}</g>
      <g class="mp-closed">${shut(-11,-66,3.4)}${shut(11,-66,3.4)}</g>
      <path d="M-3.8 -61.8 C-2 -63.6 2 -63.6 3.8 -61.8 C3.2 -59.4 1.2 -58.4 0 -58.4 C-1.2 -58.4 -3.2 -59.4 -3.8 -61.8Z" fill="#3a2a22"/>

/* ═══════════ 4 · Sara, the kappa with the spinning dish (folklore) ═══════════
   A kappa keeps a dish of water on the crown of its head, ringed by wet hair.
   Sara floats a record in hers. The label is a slice of cucumber (a kappa's
   favourite thing), the tonearm is a twig of bamboo weighted with a lotus
   seed, and the rest of the cucumber is in her fist, for conducting.
   Same box and grammar as the toads: ground line y = 0, one skin gradient from
   pearl to pond-deep, light from the upper left, outlines about .55 wide. */
const K_HEAD='M0 -31 C18 -31 37.5 -37 38.5 -54 C39.5 -70 24 -82 0 -82 C-24 -82 -39.5 -70 -38.5 -54 C-37.5 -37 -18 -31 0 -31Z';
const K_BODY='M0 0 C15 .5 29 -1 33 -9 C37 -18 34 -32 26 -40 L-26 -40 C-34 -32 -37 -18 -33 -9 C-29 -1 -15 .5 0 0Z';
const K_SHELL='M-50 -22 C-52 -40 -34 -54 0 -54 C34 -54 52 -40 50 -22 C49 -9 40 -1.5 30 -1.5 L-30 -1.5 C-40 -1.5 -49 -9 -50 -22Z';
const K_ARM_R='M27 -36 C36 -35 43 -28 44 -19 C44.6 -12 43 -6 41.6 -2.6 L33.4 -2.6 C34 -8 33 -14 30.4 -19 C28 -23 26 -28 26 -32Z';
const K_ARM_L='M-26 -36 C-34 -39.5 -45 -35 -51.5 -27 C-53.5 -23.6 -52.6 -18.6 -49 -17 C-45 -16 -42 -18.6 -40 -21.6 C-36.6 -25.6 -32 -26.6 -27.4 -26Z';
const K_PLATE='M0 -37 C10 -37 19 -33 20 -22 C21 -10 12 -3 0 -3 C-12 -3 -21 -10 -20 -22 C-19 -33 -10 -37 0 -37Z';
/* a freckle: the toads' wart, in jade */
const kSpot=([x,y,r])=>`<circle cx="${r2(x+r*.3)}" cy="${r2(y+r*.45)}" r="${r}" fill="#2f6a4c" opacity=".22"/><circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff" opacity=".42"/>`;
/* one eye: the toads' eye (gold iris, wide pupil, heavy lid that droops at the
   outer corner), set in the face under her fringe. Open while she waits,
   shut and smiling while the music plays. */
function kEye(cx,cy,o,ID){
  const R=9, top=r2(cy-R), c=o>0?'er':'el', yl=r2(cy-2.9+(o<0?.5:0)), yr=r2(cy-2.9+(o>0?.5:0));
  const lid=`M${cx-R-1} ${yl} L${cx-R-1} ${cy-R-1} L${cx+R+1} ${cy-R-1} L${cx+R+1} ${yr} C${r2(cx+5.4)} ${r2(cy-5.5)} ${r2(cx-5.4)} ${r2(cy-5.5)} ${cx-R-1} ${yl}Z`;
  return `<clipPath id="${ID}${c}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
    <ellipse cx="${cx}" cy="${r2(cy+1.2)}" rx="${R+.5}" ry="${R}" fill="#173a3b" opacity=".09"/>

          <path d="M${r2(cx-8.3)} ${r2(yl+.25)} C${r2(cx-5.2)} ${r2(cy-5.3)} ${r2(cx+5.2)} ${r2(cy-5.3)} ${r2(cx+8.3)} ${r2(yr+.25)}" fill="none" stroke="#27493c" stroke-width="1.4" stroke-linecap="round"/>

/* the wet fringe round the dish: leaf-shaped locks from under the bowl, long
   and short by turns. Angles run 0 (her left side) through 90 (the middle of
   her forehead) to 180; roots, bulge and tips each sit on their own ellipse. */
function kLocks(n,a0,a1,len){
  const P=(cy,rx,ry,t)=>[rx*Math.cos(t),cy+ry*Math.sin(t)], rad=Math.PI/180;
  const step=(a1-a0)/(n-1), w=step*.62*rad;
  let locks='', shine='';
  for(let i=0;i<n;i++){
    const t=(a0+step*i)*rad, k=(i%2?.82:1)*len;
    const [ax,ay]=P(-80,22,5,t-w*1.15), [bx,by]=P(-80,22,5,t+w*1.15);
    const [mx,my]=P(-79,26,7,t), [ex,ey]=P(-77,40.5,14.6,t);
    const tx=mx+(ex-mx)*k, ty=my+(ey-my)*k;
    const [c1x,c1y]=P(-78.4,34,10,t-w), [c2x,c2y]=P(-78.4,34,10,t+w);
    locks+=`M${r2(ax)} ${r2(ay)} Q${r2(c1x)} ${r2(c1y)} ${r2(tx)} ${r2(ty)} Q${r2(c2x)} ${r2(c2y)} ${r2(bx)} ${r2(by)}Z `;
    const [sx,sy]=P(-79,27.5,7.6,t-w*.3);
    shine+=`M${r2(sx)} ${r2(sy)} L${r2(sx+(tx-sx)*.62)} ${r2(sy+(ty-sy)*.62)} `;
  }
  return {locks,shine};
}
/* the record, drawn flat (the dish tips it toward you): the vinyl and its sheen
   stay put, the cucumber-slice label and one scuff turn */
function kRecord(ID,R){
  const rad=Math.PI/180, at=(r,a)=>`${r2(r*Math.cos(a*rad))} ${r2(r*Math.sin(a*rad))}`;
  const wedge=(a,b)=>`M${at(R*.44,a)} L${at(R*.97,a)} A${r2(R*.97)} ${r2(R*.97)} 0 0 1 ${at(R*.97,b)} L${at(R*.44,b)} A${r2(R*.44)} ${r2(R*.44)} 0 0 0 ${at(R*.44,a)}Z`;
  const grooves=[.93,.85,.77,.69,.61,.53].map(k=>`<circle r="${r2(R*k)}" fill="none" stroke="#7d908b" stroke-width=".35" opacity=".5"/>`).join('');
  const seeds=[0,60,120,180,240,300].map(a=>`<ellipse cx="${r2(R*.2)}" cy="0" rx="${r2(R*.075)}" ry="${r2(R*.034)}" transform="rotate(${a+15})" fill="#fbfdf0" stroke="#a9cc7a" stroke-width=".3"/>`).join('');
  return `<circle r="${R}" fill="url(#${ID}vinyl)" stroke="#0e1514" stroke-width=".7"/>${grooves}
    <g class="mp-spin">
      <path d="M${at(R*.88,196)} A${r2(R*.88)} ${r2(R*.88)} 0 0 1 ${at(R*.88,232)}" fill="none" stroke="#c9d6d2" stroke-width=".9" stroke-linecap="round" opacity=".3"/>

      <circle r="${r2(R*.055)}" fill="#1f2e2c"/>
    </g>
    <path d="${wedge(198,228)} ${wedge(18,48)}" fill="#ffffff" opacity=".13"/>
    <path d="${wedge(206,216)}" fill="#ffffff" opacity=".12"/>`;
}

/* ═══════════ 5 · Hōzuki, the lantern spirit (make-believe) ═══════════ */
function hozuki(ID){
  const POD='M0 -88 C19 -86 35 -72 35 -52 C35 -32 21 -18 0 -16 C-21 -18 -35 -32 -35 -52 C-35 -72 -19 -86 0 -88Z';
  const ribs='M0 -88 C-10 -72 -10 -32 0 -16 M0 -88 C10 -72 10 -32 0 -16 M0 -88 C-24 -74 -25 -30 0 -16 M0 -88 C24 -74 25 -30 0 -16';
  return `<defs>
    <linearGradient id="${ID}pod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1b4"/><stop offset=".35" stop-color="#f6a06a"/><stop offset=".85" stop-color="#ec7a45"/><stop offset="1" stop-color="#c9563a"/></linearGradient>
    <radialGradient id="${ID}glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7d6"/><stop offset=".6" stop-color="#ffe2a0" stop-opacity=".7"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="${ID}halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".5"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
    <linearGradient id="${ID}leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93bb86"/><stop offset="1" stop-color="#4f8563"/></linearGradient>
    <clipPath id="${ID}pc"><path d="${POD}"/></clipPath></defs>
  ${pad(ID)}
  <!-- its own warm light on the pad, and a shadow that shrinks as it rises -->
  <g class="mp-shadow"><ellipse cx="0" cy="1" rx="30" ry="4.4" fill="#173a3b" opacity=".22"/></g>
  <g transform="translate(0 -8)"><g class="mp-float">
    <g class="mp-glow"><ellipse cx="0" cy="-52" rx="52" ry="50" fill="url(#${ID}halo)"/></g>
    <path d="${POD}" fill="url(#${ID}pod)" stroke="#b04e33" stroke-width=".6"/>
    <g clip-path="url(#${ID}pc)">
      <g class="mp-glow"><ellipse cx="0" cy="-48" rx="24" ry="28" fill="url(#${ID}glow)"/></g>
      <path d="${ribs}" fill="none" stroke="#c9563a" stroke-width=".7" opacity=".45"/>
      <ellipse cx="-14" cy="-72" rx="9" ry="3.4" fill="#ffffff" opacity=".3" transform="rotate(-30 -14 -72)"/>
      <ellipse cx="0" cy="-18" rx="24" ry="5" fill="#7a3a2a" opacity=".18"/>
    </g>
    <!-- the calyx cap and its curl of stem -->
    <path d="M0 -94 C1 -99 6 -101 9 -98" fill="none" stroke="#3f6f55" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M0 -84 C-6 -86 -12 -86 -15 -82 C-9 -84 -5 -84 -2 -82 C-4 -86 -2 -90 0 -91 C2 -90 4 -86 2 -82 C5 -84 9 -84 15 -82 C12 -86 6 -86 0 -84Z" fill="url(#${ID}leaf)" stroke="#3f6f55" stroke-width=".5"/>
    <path d="M0 -84 L0 -94" stroke="#3f6f55" stroke-width="1.4" stroke-linecap="round"/>
    <!-- a little wisp of light for a tail -->
    <path d="M-3 -16.4 C-5 -11 2 -9.4 -.4 -4.2 C3.6 -8 4.6 -12.4 3 -16.4Z" fill="#ffd27a" opacity=".85"/>
    <!-- face: it sings with its eyes shut -->
    <g class="mp-open">${eye(-9.6,-50,2.8)}${eye(9.6,-50,2.8)}<path d="M-3 -41.8 Q0 -39.4 3 -41.8" fill="none" stroke="#7a3a2a" stroke-width="1.1" stroke-linecap="round"/></g>
    <g class="mp-closed">${shut(-9.6,-49.4,3.4,'#7a3a2a')}${shut(9.6,-49.4,3.4,'#7a3a2a')}<g transform="translate(0 -41)"><g class="mp-pulse"><ellipse rx="2.4" ry="2.9" fill="#7a3a2a"/><ellipse cy="1.2" rx="1.4" ry="1.1" fill="#e0705a"/></g></g></g>
    ${blush(-16.4,-44,3.8)}${blush(16.4,-44,3.8)}
    ${waves(0,-50,'#c9563a')}
  </g></g>
  ${notes(30,-96,'#c9563a')}`;
}

   pitch:'A slow, steady snail whose shell is a vinyl record. Snails don\'t hurry, which suits an hour of reading.',
   playing:'The shell turns like a record and her eyestalks sway in time.',
   paused:'The shell stops still and she just breathes on her pad.',
   hide:'Slips behind a screen edge shell first.',
   say:'"No rush. Put something on, and we\'ll get through this page by page."'},
  {art:nagi,kind:'Animal · a river otter',name:'Nagi',title:'The otter with the shell speaker',
   pitch:'Otters keep a favourite stone, and Nagi keeps a scallop-shell speaker hugged to her chest.',

   paused:'Looks up at you and waits for the next song.',

  {art:sara,kind:'Folklore · a kappa',name:'Sara',title:'The kappa with the spinning dish',

document.getElementById('cards').innerHTML=CONCEPTS.map((c,i)=>{
  const ID='c'+(++seq)+'_';

    <div class="stagebox"><svg viewBox="-68 -118 136 136" aria-label="${c.name}, ${c.title}">${c.art(ID)}</svg></div>

    <dl><dt>Playing</dt><dd>${c.playing}</dd><dt>Paused</dt><dd>${c.paused}</dd><dt>Edges</dt><dd>${c.hide}</dd></dl>
  </article>`;
}).join('');
document.getElementById('play').onclick=()=>{
  const on=document.body.classList.toggle('playing');
  document.querySelector('#play span').textContent=on?'Pause the music':'Play the music';
};
