<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sara's yokai · preview</title>
<!-- preview.html?pets=sara,kon&t=1.2 : each pet idle, playing, fidgeting and asleep; t freezes every animation at that second -->
<style>
body{margin:0;padding:16px;font:600 13px/1.2 'Segoe UI',sans-serif;color:#1f2e2c;background:#f4efe6}
.pet{margin:0 0 18px}
.pet h2{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px}
.box{width:240px;height:240px;background:#fbf8f2;border:1px solid #e4dccd;border-radius:14px}
.box.dark{background:radial-gradient(ellipse at 50% 40%,#2a7d78,#0f3b41 75%)}
.box.sm{width:120px;height:120px}.box.xs{width:72px;height:72px}
.box svg{width:100%;height:100%;display:block;overflow:visible}
</style>
<body>
<div id="out"></div>
<script>
(async()=>{
  const q=new URLSearchParams(location.search), ids=(q.get('pets')||'sara').split(',');
  const load=src=>new Promise(r=>{ const s=document.createElement('script'); s.src=src; s.onload=s.onerror=r; document.head.appendChild(s); });
  await load('kit.js');
  for(const id of ids) await load(id+'.js');
  PetKit.injectCSS();
  const tile=(id,state,cls='')=>`<div class="tile"><div class="box ${cls} ${state}">${PetKit.svg(id)}</div>${state||'idle'}</div>`;
  document.getElementById('out').innerHTML=ids.map(id=>{ const d=PetKit.get(id); return `<div class="pet"><h2>${d.name} · ${d.kind}</h2><div class="row">
    ${tile(id,'')}${tile(id,'playing')}${tile(id,'fidget')}${tile(id,'sleepy')}
    ${tile(id,'playing','dark sm')}${tile(id,'','dark xs')}${tile(id,'playing','xs')}</div></div>`; }).join('');
  const t=parseFloat(q.get('t'));
  if(isFinite(t)) requestAnimationFrame(()=>document.getAnimations().forEach(a=>{ a.pause(); a.currentTime=t*1000; }));
})();
</script>
</body>
</html>
