  const mv=pondMotionOn();
  const tbug=reedBugOfDay(t), got=db.pond.bugs[tbug.k], gotToday=!!(got&&got.last===t);
  const rsig=[t,mv,_reedsAll,reeds.length,st.found.ghost?1:0,tbug.k,gotToday?1:got?2:0,...shown.map(a=>a.id+'·'+a.due+'·'+a.title+'·'+a.classId)].join('|');
  if(rsig!==_reedsSig){ _reedsSig=rsig;
  /* the bug of the day, with a quiet line beside it; the reeds stay up
     even when nothing is overdue, so there's always somewhere for it */
  const vis=`<span class="reeds-vis${gotToday?' got':''}">${gotToday?`${esc(bugName(tbug))} · in your bug collection ✓`:got?`A ${esc(tbug.name)} is back · tap it`:'Something’s visiting the reeds · tap it'}</span>`;
  $('dr-reeds').innerHTML=!reeds.length?`<div class="reeds calm">
      ${reedBed(mv)}${vis}
      <div class="reeds-h"><div><b>The reeds are clear</b></div><span>Nothing overdue</span></div></div>`
    :`<div class="reeds">
      ${reedBed(mv)}${vis}
      <div class="reeds-h"><div><b>In the reeds</b><em>${reeds.length} overdue</em></div>
        <span>${st.found.ghost?'Finish one to set its fish free':'Clear them all to find the Ghost Koi'}</span></div>
      ${shown.map(a=>{ const late=-dDelta(a.due);
        return `<div class="rd" onclick="reedTap('${a.id}')" title="Finish it and set its fish free">
          ${reedClump(a.id,late,mv)}
          <div class="rd-t">${esc(a.title)}</div>
          <span class="rd-c">${a.classId?esc(clsShort(a.classId)):'Unfiled'}</span>
          <span class="rd-go">set it free</span>
          <span class="rd-l">${late} day${late===1?'':'s'}</span></div>`; }).join('')}
      ${reeds.length>3?`<button class="rd-more" onclick="_reedsAll=!_reedsAll;paintDaily()">${_reedsAll?'Show fewer':`Show ${reeds.length-3} more`}</button>`:''}
    </div>`; }

  /* the lotus opens with today's net focus */
  const goal=+db.settings.goal||0, mins=Math.round(todayNetFocusMs()/MIN), op=goal?Math.min(1,mins/goal):0;

  }

  const fm=db.settings.focus, bm=db.settings.brk;
  lot.querySelector('.lotus-go').textContent=A?'Back to your session':`Start focusing · ${fm} min`;
  lot.querySelector('.lotus-note').textContent=`${fm} focus · ${bm} break · each minute earns ${Math.round(bm/fm*60)}s of rest`;
  paintPath(st);     // the lotus path: a pad for every day in full bloom

  /* a glance at the collection: the twelve hand-drawn species */

  const e=elapsed(), rem=A.target-e;
  if(rem<=0&&!beeped&&!A.paused){ beeped=true; chime(A.phase==='break'); }
  if(rem>0) beeped=false;
  const focus=A.phase!=='break', col=focus?'#f7c7a6':'#9fd8b8', over=rem<0;
  const prog=Math.max(0,Math.min(1,e/Math.max(1,A.target)));
  const n=A.cycles.length+(focus?1:0);
  /* Four times a second, but only what actually changed is written: every
     write (even of the same text) makes the browser re-lay-out the page. */
  const put=(id,v)=>{ const el=$(id); if(el&&el.textContent!==v) el.textContent=v; };
  const set=(el,k,v)=>{ if(_paintMemo[el.id+k]!==v){ _paintMemo[el.id+k]=v; el.style[k]=v; } };
  put('rn-name',(A.name||defaultName(A)).replace(/ · .*$/,'')+' · '+fDate(A.started));
  put('rn-cyc',`Cycle ${Math.max(1,n)} · started ${fTime(A.started)}`);
  put('rn-bank',focus?dur(e*A.ratio):dur(Math.max(0,rem)));
  put('rn-bank-l',focus?'Rest banked':'Rest left');
  put('rn-ph',focus?(over?'Overtime':'Focus'):'Break'); set($('rn-ph'),'color',col);
  put('rn-clk',clock(rem));
  put('rn-sub',A.paused?(e<1000?'paused · press start':'paused')
    :focus?(over?`past the bell · break now worth ${dur(e*A.ratio)}`:'the koi is swimming')
    :(over?'break overrun · counting against you':'rest · the water is still'));
  const C=2*Math.PI*170, arc=$('rn-arc'), off=+(C*(1-prog)).toFixed(1);
  if(_paintMemo.arcCol!==col){ _paintMemo.arcCol=col; arc.setAttribute('stroke',col); arc.style.filter=`drop-shadow(0 0 6px ${col})`; }
  /* The ring glides between ticks, but a long focus block moves it only a
     fraction of a pixel per tick, and gliding that means redrawing the page
     every frame for nothing the eye can see. So a step under half a screen
     pixel is set as it is (anti-aliasing carries it); anything bigger (short
     breaks, a phase change, a zoomed-in page) glides exactly as before. */
  if(_paintMemo.arcOff!==off){
    const from=_paintMemo.arcOff??+C.toFixed(1);                // a fresh ring starts empty and sweeps in, as before
    const step=Math.abs(off-from)*(window.devicePixelRatio||1);
    set(arc,'transition',step<.5?'none':'stroke-dashoffset .25s linear');
    _paintMemo.arcOff=off; arc.setAttribute('stroke-dashoffset',off);
  }
  set($('rn-koi'),'transform',`rotate(${(-90+prog*360).toFixed(2)}deg)`);
  set($('rn-glow'),'background',`radial-gradient(circle,${col}22,transparent 65%)`);
  set($('rn-glow'),'animation',pondMotionOn()?'pf-breathe 6s ease-in-out infinite':'none');
  put('rn-play',A.paused?'Start':'Pause');
  const sw=$('rn-switch');
  put('rn-switch',focus?(over?'Take your break':'Break now'):'Back to focus');
  sw.onclick=focus?endFocus:endBreak;
  paintTasks(); paintCycles();
  put('live',clock(rem)+' · '+(focus?'focus':'break'));
  const ttl=clock(rem)+' · '+(focus?'Focus':'Break')+' · Catching Days'; if(document.title!==ttl) document.title=ttl;
}
function togglePause(){
  if(A.paused){ A.pausedMs+=Date.now()-A.pausedAt; A.paused=false; A.pausedAt=null; openSeg(); }
  else { closeSeg(); A.paused=true; A.pausedAt=Date.now(); }
  save(); paint();
}
function endFocus(){
  closeSeg();
  const actual=Math.max(1000,elapsed()), planned=A.target, n=A.cycles.length+1;
  A.pending={ n, started:A.phaseStart, ended:Date.now(), planned, actual,
    over:Math.max(0,actual-planned), earned:Math.round(actual*A.ratio),
    breakActual:0, overBreak:0, rating:null,
    done:db.assignments.filter(x=>x.done&&x.doneSession===A.id&&x.doneCycle===n)
          .map(x=>({id:x.id,title:x.title,classId:x.classId,at:x.doneAt})) };
  A.phase='rating'; save(); clearInterval(tick); rateModal();
}
function afterRating(r,journal){
  A.pending.rating=r; A.pending.journal=journal||'';
  A.cycles.push(A.pending); A.earned=A.pending.earned; A.pending=null;
  A.phase='break'; A.phaseStart=Date.now(); A.target=A.earned;
  A.paused=false; A.pausedAt=null; A.pausedMs=0; beeped=false; A.segStart=null;
  save(); run();
}
function endBreak(){
  const actual=elapsed(), c=A.cycles[A.cycles.length-1];
  if(c){ c.breakActual=actual; c.overBreak=Math.max(0,actual-c.earned); }
  A.phase='focus'; A.phaseStart=Date.now(); A.target=A.focusMin*MIN;
  A.paused=false; A.pausedAt=null; A.pausedMs=0; beeped=false;
  openSeg(); save(); paint();
}
function runToggle(id){
  const a=asg(id); if(!a) return;
  const n=A.cycles.length+(A.phase==='break'?0:1);
  toggleAsg(id,!a.done,A.id,n); paint();
}
function runDetach(id){
  A.assignmentIds=A.assignmentIds.filter(x=>x!==id);
  if(A.working===id){ closeSeg(); A.working=null; }
  save(); paint();
}
function paintTasks(){
  const box=$('run-tasks'); if(!box) return;
  const live=A.assignmentIds.map(asg).filter(Boolean);
  const st=live.some(a=>a.done)?pondState():null;
  const sig=live.map(a=>a.id+a.done).join()+'|'+A.working;
  if(sig===_runTaskSig) return; _runTaskSig=sig;
  box.innerHTML=live.length?live.map(a=>{ fix(a);
    const d=a.done, w=A.working===a.id&&!d, k=d&&st?st.rel.get(a.id):null;
    const meta=[a.est?'est '+a.est+'m':'',a.logged?dur(a.logged)+' logged':'',a.due&&!d?'due '+dRel(a.due).toLowerCase():'',subProg(a)?subProg(a)+' steps':''].filter(Boolean).join(' · ');
    return `<div class="rt${w?' on':''}${d?' done':''}">
      <div class="rt-ck" onclick="runToggle('${a.id}')" title="${d?'Untick':'Finish it'}">${d&&k?PondArt.fish(k,.42,0,'flat'):''}</div>
      <div class="rt-b" onclick="${d?'':`setWorking('${a.id}')`}">
        <span class="t">${esc(a.title)}</span>
        <span class="m"><b style="color:${a.classId?clsCol(a.classId):'var(--faint)'}">${a.classId?esc(clsShort(a.classId)):'Unfiled'}</b>${meta?' · '+meta:''}</span></div>
      <span class="rt-tag ${d?'rel':w?'wk':''}">${d?'released':w?'working on':'queued'}</span>
      <button class="vx" title="Take out of this session" onclick="runDetach('${a.id}')">×</button>

    :`<p class="td-empty" style="padding:8px 4px">No tasks in this session yet. Quick-add one below, or bring some in from Plan.</p>`;
}
function paintCycles(){
  const box=$('run-cycles'); if(!box) return;
  const inProg=A.phase!=='break'?A.cycles.length+1:null;
  const sig=A.cycles.map(c=>c.n+'.'+c.rating+'.'+Math.round((c.breakActual||0)/MIN)).join()+'|'+inProg;
  if(sig===_runCycSig) return; _runCycSig=sig;
  box.innerHTML=A.cycles.map(c=>{
    const how=c.over>MIN?`ran ${dur(c.over)} past the bell`:c.overBreak>MIN?`break ran ${dur(c.overBreak)} over`:'finished on the bell';
    return `<div class="cy"><b>${c.n}</b><div><span class="t">${dur(c.actual)} focus · ${c.breakActual?dur(c.breakActual)+' break':'break '+(A.phase==='break'&&c===A.cycles[A.cycles.length-1]?'in progress':'—')}</span>
      <span class="m">${esc(c.journal?'“'+c.journal.slice(0,60)+(c.journal.length>60?'…':'')+'”':how)}</span></div>
      <span class="pb">${pebbles(c.rating||0)}</span></div>`; }).join('')
    +(inProg?`<div class="cy now"><b>${inProg}</b><div><span class="t">In progress</span><span class="m">You’ll rate it when the bell rings</span></div></div>`:'');
}
function attachExisting(){

    .sort((x,y)=>(doScore(y)||0)-(doScore(x)||0));

/* ═══════════════ modals ═══════════════ */
/* modalLocked marks a dialog that must be answered rather than dismissed —
   the cycle rating is the only one, since escaping it would leave the timer
   mid-cycle with an unresolved pending block. */
let modalLocked=false;
function modal(h,wide){

    <p style="text-align:center;margin:20px 0 0;font-size:14px">How focused were you?</p>
    <div class="stars" id="st"></div>
    <p class="faint" id="st-lbl" style="text-align:center;font-size:12px;height:18px;margin:0"></p>
    <label class="lbl" style="margin-top:14px">Cycle journal <span class="faint" style="text-transform:none;letter-spacing:0">— optional</span></label>
    <textarea id="cj" style="min-height:72px" placeholder="What happened in these ${dur(p.actual)}? What broke your focus?"></textarea>
    <button class="primary" id="st-go" style="width:100%;margin-top:14px;padding:11px" disabled>Start break</button>
    <p class="faint" style="text-align:center;font-size:11.5px;margin:9px 0 0">1–5 keys set the rating</p>`);
  modalLocked=true;   // rating a finished cycle isn't optional — no Escape, no backdrop click
  let val=0; const words=['','Scattered','Patchy','Okay','Locked in','Flow state'], st=$('st');
  for(let i=1;i<=5;i++){ const b=document.createElement('button'); b.textContent='★';
    b.onmouseenter=()=>lite(i); b.onclick=()=>pick(i); st.appendChild(b); }
  st.onmouseleave=()=>lite(val);
  function lite(n){ [...st.children].forEach((b,i)=>b.classList.toggle('lit',i<n)); $('st-lbl').textContent=words[n]||''; }
  function pick(n){ val=n; lite(n); $('st-go').disabled=false; }
  $('st-go').onclick=()=>{

  document.onkeydown=e=>{ if(isTyping(e.target)) return;
    if(/^[1-5]$/.test(e.key)) pick(+e.key); };

let logoPick={emoji:'📘',img:null};

function finishSession(){
  closeSeg();

    A.cycles.push({n,started:A.phaseStart,ended:Date.now(),planned:A.target,actual:e,

function defaultName(s){
  const cs=[...new Set(s.assignmentIds.map(i=>asg(i)?.classId).filter(Boolean))];
  return (cs.length===1?clsName(cs[0]):cs.length>1?'Mixed':'Study')+' · '+fDate(s.started);
}
function drawLogo(){
  const p=$('lg-prev'); if(!p) return;
  p.innerHTML=logoPick.img?`<img src="${logoPick.img}">`:logoPick.emoji;
  [...($('emo')?.children||[])].forEach(b=>b.classList.toggle('on',!logoPick.img&&b.textContent===logoPick.emoji));
}
function pickLogoImg(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=128;
      const x=c.getContext('2d'), s=Math.min(im.width,im.height);
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
      // PNG, not JPEG — JPEG has no alpha channel, so a transparent source
      // would flatten to opaque black.
      logoPick.img=c.toDataURL('image/png'); drawLogo();
    }; im.src=r.result; };
  r.readAsDataURL(f); inp.value='';
}
function saveSession(){
  A.name=$('s-name').value.trim()||defaultName(A);
  A.logo=logoPick.emoji; A.logoImg=logoPick.img;
  A.journal=$('jr').value.trim();
  A.ended=Date.now(); A.phase='done';
  // roll segment time into assignment totals
  const roll={}; A.segments.forEach(g=>roll[g.a]=(roll[g.a]||0)+g.ms);
  Object.entries(roll).forEach(([id,ms])=>{ const a=asg(id); if(a) a.logged=(a.logged||0)+ms; });
  db.sessions.unshift(A);
  const filed=diaryFromSession(A);       // session write-up also lands in the Journal
  const finalized=A;                    // a story hook never reads a live/unfinished timer
  db.active=null; A=null; rainSync();
  save(); const cached=cacheSave(), persisted=syncOut();
  closeModal(); document.title='Catching Days';
  if(filed) toast('Session journal filed under Study Block.');
  tab('stats');
  // Only a successful normal save can schedule fiction. Story failures cannot interrupt this flow.
  Promise.resolve(persisted).then(ok=>{
    if(ok||cached) return window.PondEvents?.afterSaved(finalized);
  }).catch(e=>console.warn('Pond Moments post-save:',e));
}

function summarize(s){
  const f=sum(s.cycles,c=>c.actual), ov=sum(s.cycles,c=>c.over),
        br=sum(s.cycles,c=>c.breakActual), ob=sum(s.cycles,c=>c.overBreak),
        ea=sum(s.cycles,c=>c.earned), rated=s.cycles.filter(c=>c.rating);
  return { cycles:s.cycles.length, focus:f, over:ov, brk:br, overBreak:ob, earned:ea,
    net:f-ob, avg:rated.length?sum(rated,c=>c.rating)/rated.length:0,
    done:sum(s.cycles,c=>(c.done||[]).length),
    discipline: ea?Math.min(1,ea/Math.max(br,1)):1 };
}

/* ═══════════════ STATS ═══════════════ */
function computeStreak(days){
  const set=new Set(days);
  let streak=0, d=new Date();
  if(!set.has(dayKey(d.getTime()))) d=new Date(Date.now()-DAY);
  while(set.has(dayKey(d.getTime()))){ streak++; d=new Date(d.getTime()-DAY); }
  let best=0,cur2=0; const sorted=[...days].sort();
  sorted.forEach((k,i)=>{ if(i&&(new Date(k)-new Date(sorted[i-1]))<=DAY*1.5) cur2++; else cur2=1; best=Math.max(best,cur2); });
  return {streak,best};
}
function weekChart(byDay){
  let cursor=Date.now(), guard=0;
  while(fWk(cursor)!=='Mon'&&guard++<8) cursor-=DAY;
  const days=[]; for(let i=0;i<7;i++) days.push(cursor+i*DAY);
  const vals=days.map(ts=>byDay[dayKey(ts)]||0);
  const mx=Math.max(...vals,MIN), t=today();
  const bars=vals.map((v,i)=>`<div class="b ${dayKey(days[i])===t?'today':''}" style="height:${Math.max(2,v/mx*100).toFixed(1)}%" title="${dur(v)}"></div>`).join('');
  const axis=['M','T','W','T','F','S','S'].map((l,i)=>`<span style="${dayKey(days[i])===t?'color:var(--focus);font-weight:700':''}">${l}</span>`).join('');
  return {bars,axis,vals,weekMs:sum(vals,v=>v)};
}
/* Procrastination — only meaningful once assignments carry an assignedDate,
   so it renders nothing at all rather than a wall of zeros on day one.
   Included in the no-sessions branch too: this data comes from assignments,
   not sessions, so it can be worth showing before a single pomodoro exists. */
function procrastinationCard(){
  const withLead=db.assignments.filter(a=>fix(a).assignedDate&&a.due);
  if(!withLead.length) return '';
  const withStart=withLead.map(a=>({a,first:firstWorkedAt(a.id)})).filter(x=>x.first);
  const leadDays=withLead.map(a=>daysBetween(a.assignedDate,a.due)).filter(v=>v!==null);
  const startLagDays=withStart.map(({a,first})=>daysBetween(a.assignedDate,dayKey(first))).filter(v=>v!==null);
  const crunch=withStart.length
    ? withStart.filter(({a,first})=>{ const v=daysBetween(dayKey(first),a.due); return v!==null&&v<=1; }).length/withStart.length
    : null;
  const mean=arr=>arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:null;
  const avgLead=mean(leadDays), avgLag=mean(startLagDays);
  const lagRatio=(avgLead&&avgLead>0&&avgLag!==null)?avgLag/avgLead:null;
  const lagCol=lagRatio===null?null:lagRatio<0.5?'var(--focus)':lagRatio<0.8?'var(--over)':'var(--bad)';
  const crunchCol=crunch===null?null:crunch<0.25?'var(--focus)':crunch<0.5?'var(--over)':'var(--bad)';
  const d1=n=>n===null?'—':(Math.round(n*10)/10)+'d';
  return `
  <div class="card" style="margin-top:16px">
    <span class="lbl">Procrastination</span>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      ${stat(crunch===null?'—':Math.round(crunch*100)+'%','Crunch rate',crunchCol,
         withStart.length?`started within a day of due, ${withStart.length} tracked`:'no started work tracked yet')}
      ${stat(d1(avgLag),'Avg start lag',lagCol,
         avgLag===null?'nothing started yet':'how long before you begin')}
      ${stat(d1(avgLead),'Avg lead time',null,`runway you get · ${withLead.length} with both dates`)}
    </div>
  </div>`;
}

function heatmap(byDay){
  const el=$('heat'); if(!el) return;
  const vals=Object.values(byDay).filter(v=>v>0), mx=Math.max(...vals,MIN);
  const cells=[];
  let cursor=Date.now(), guard=0;
  while(fWk(cursor)!=='Sat'&&guard++<8) cursor+=DAY;
  for(let i=181;i>=0;i--){
    const ts=cursor-i*DAY, k=dayKey(ts), v=byDay[k]||0;

    const col=['#e5ecf3','rgba(111,176,125,.28)','rgba(111,176,125,.5)','rgba(111,176,125,.72)','rgba(111,176,125,.95)'][lvl];
    cells.push(`<i style="background:${col}" title="${fDate(ts)} — ${v?dur(v):'nothing'}"></i>`);
  }
  el.innerHTML=cells.join('');
}

function setWeight(k,el){
  db.settings.urgency[k]=+el.value;
  const u=db.settings.urgency, tot=URG.reduce((a,[x])=>a+u[x],0);
  URG.forEach(([x])=>{ const b=$('ub-'+x); if(b) b.style.width=(tot?u[x]/tot*100:25)+'%'; });
  const n=$('uv-'+k); if(n) n.textContent=el.value;
  const tl=$('u-total'); if(tl){ tl.textContent=`total ${tot} · rebalanced to 100 on save`; tl.style.color=tot===100?'#2f7a74':'#a8762f'; }
}
function setWeightsDone(){
  const u=db.settings.urgency, tot=URG.reduce((a,[x])=>a+u[x],0);
  if(!tot){ URG.forEach(([x],i)=>u[x]=[40,25,20,15][i]); }
  else if(tot!==100){ URG.forEach(([x])=>u[x]=Math.round(u[x]/tot*100)); }
  save();
}

/* Weights are relative, so rather than rejecting anything that doesn't total
   100 we just normalize — the user's ratios are preserved and the number they
   see back is the one actually used. */
function saveUrgency(b){
  const raw={wDue:Math.max(0,+$('s-wdue').value||0), wWork:Math.max(0,+$('s-wwork').value||0),
             wImp:Math.max(0,+$('s-wimp').value||0), wProc:Math.max(0,+$('s-wproc').value||0)};
  const total=raw.wDue+raw.wWork+raw.wImp+raw.wProc;
  if(!total){ toast('At least one weight has to be above zero.'); return; }
  const u=db.settings.urgency;
  Object.keys(raw).forEach(k=>{ u[k]=Math.round(raw[k]/total*100); });
  u.capHrsPerDay=Math.min(24,Math.max(0.5,+$('s-caphrs').value||3));
  save(); paintUrgencySettings();
  $('s-urg-note').textContent=total===100?'Saved.':`Saved — rebalanced from ${total} to total 100.`;
  b.textContent='Saved'; setTimeout(()=>b.textContent='Save urgency',1200);
}

function saveSettings(b){
  db.settings.focus=Math.max(1,+$('s-focus').value||25);
  db.settings.brk=Math.max(1,+$('s-break').value||5);
  db.settings.goal=Math.max(0,+$('s-goal').value||0);
  const tz=$('s-tz').value.trim()||'America/New_York';
  try{ new Intl.DateTimeFormat('en-US',{timeZone:tz}); db.settings.tz=tz; }
  catch(e){ alert('Unknown time zone — keeping '+db.settings.tz); $('s-tz').value=db.settings.tz; }
  save(); b.textContent='Saved'; setTimeout(()=>b.textContent='Save',1200);
}

const csvify=rows=>rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');

function exportCSV(){
  const cy=[['session_id','session_name','session_started','cycle','focus_ms','planned_ms',
    'overtime_ms','break_ms','earned_break_ms','break_overrun_ms','rating','cycle_journal',
    'assignments_completed','completed_at']];
  db.sessions.forEach(s=>s.cycles.forEach(c=>cy.push([s.id,s.name||'',fExact(s.started),c.n,
    c.actual,c.planned,c.over,c.breakActual,c.earned,c.overBreak,c.rating??'',c.journal||'',
    (c.done||[]).map(d=>d.title).join(' | '),(c.done||[]).map(d=>fStamp(d.at)).join(' | ')])));
  dl(`catching-days-cycles-${today()}.csv`,csvify(cy),'text/csv');

  const asgc=[['assignment','class','importance','est_min','logged_min','est_accuracy_pct',
    'due','done','completed_at','subtasks_done','subtasks_total','notes_count','journal']];
  db.assignments.forEach(a=>{ fix(a);
    asgc.push([a.title,clsName(a.classId),a.imp?IMP[a.imp].t:'',a.est||'',
      a.logged?Math.round(a.logged/MIN):'',a.est&&a.logged?Math.round(a.logged/MIN/a.est*100):'',
      a.due?dDate(a.due):'',a.done?'yes':'no',a.done&&a.doneAt?fStamp(a.doneAt):'',
      a.subs.filter(s=>s.done).length,a.subs.length,a.log.length,
      a.log.map(n=>`[${fStamp(n.at)}] ${n.text}`).join('  ||  ')]); });
  setTimeout(()=>dl(`catching-days-assignments-${today()}.csv`,csvify(asgc),'text/csv'),300);
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{ try{ let d=JSON.parse(r.result);
      if(d&&(d.app==='catching-days'||d.app==='radhe-labs-focus')&&d.data&&typeof d.data==='object') d=d.data;   // a copy downloaded from the sync repo's history
      if(!Array.isArray(d.sessions)) throw 0;
      db=ensureSettings(Object.assign(clone(blank),d)); db.savedAt=Date.now();
      cacheSave(); if(SERVER) await syncOut();
      location.reload();
    }catch(e){ alert('That file does not look like a Catching Days backup.'); } };
  r.readAsText(f); inp.value='';
}

/* ═══════════════ nav ═══════════════ */
/* Daily is the landing tab — the "what am I doing today" screen. Focus stays
   purely the pomodoro (setup screen, or a running session). */
let cur='daily';
const VIEWS=['daily','run','asg','jrn','proj','dia','stk','bio','stats','log','coll','set'];
/* ── navigation ──
   Six places. Plan, Journal and You each hold a few screens; while you're
   in one, its screens are listed under it in the sidebar (on a phone, as a
   strip at the top of the page). Journal's Calendar and Vault are both the
   'dia' view in different modes. Plan's Projects is projects.js ('proj').
   Settings sits apart at the bottom. */
const NAV={
  today:  {items:[['daily','Today']]},
  focus:  {items:[['run','Focus']]},
  plan:   {items:[['asg','Tasks'],['jrn','Journeys'],['proj','Projects']]},
  journal:{items:[['dia:cal','Calendar'],['dia:vault','Vault']]},
  stk:    {items:[['stk','Sticky notes']]},
  you:    {items:[['bio','Bio'],['stats','Stats & history'],['coll','Collection']]},
};
const WIDE_VIEWS=['daily','dia','coll','run','asg','jrn','proj','stk','bio','stats','log','set'];
const navLast={};
let _subnavGroup=null;
const navKey=t=>t==='dia'?'dia:'+diaMode:t;
const navGroupOf=t=>Object.keys(NAV).find(g=>NAV[g].items.some(([k])=>k.split(':')[0]===t))||null;
function navOpen(key){
  const [t,mode]=key.split(':');
  if(t==='dia'&&mode){ diaMode=mode; diaFromVault=false; if(mode==='vault'){ diaSel=null; diaEntrySel=null; } }
  tab(t);     // even from inside Journal, so it fades like every other tab
}
function navGo(g){ navOpen(navLast[g]||NAV[g].items[0][0]); }
function navSync(){
  const g=navGroupOf(cur), key=navKey(cur);
  if(g) navLast[g]=key;
  Object.keys(NAV).forEach(k=>{
    const b=$('grp-'+k); if(b) b.classList.toggle('on',k===g);
    const sub=$('subs-'+k); if(!sub) return;
    const many=NAV[k].items.length>1;
    sub.classList.toggle('open',many&&k===g);
    if(many&&k===g) sub.innerHTML='<div class="navsubs-in"><div>'+NAV[k].items.map(([ik,label])=>
      `<button class="navsub${ik===key?' on':''}" onclick="navOpen('${ik}')">${label}</button>`).join('')+'</div></div>';
  });
  const setb=$('tab-set'); if(setb) setb.classList.toggle('on',cur==='set');
  /* the pond's level card lives on Today, like the design */
  const pc=$('pondcard'); if(pc) pc.classList.toggle('hide',cur!=='daily');
  /* phone: the current place's screens (and Settings, under You) as a strip */
  const sn=$('subnav'); if(sn){
    const gg=cur==='set'?'you':g, items=gg?NAV[gg].items.slice():[];
    if(gg==='you') items.push(['set','Settings']);
    sn.innerHTML=items.length>1?items.map(([ik,label])=>
      `<button class="${ik===key?'on':''}" onclick="navOpen('${ik}')">${label}</button>`).join(''):'';
    /* a new place's strip fades in with its screen; moving within a place leaves it be */
    const sg=items.length>1?gg:null; if(sg&&sg!==_subnavGroup) flashIn(sn); _subnavGroup=sg;
    if(cur==='set'){ const y=$('grp-you'); if(y&&matchMedia('(max-width:760px)').matches) y.classList.add('on'); }
  }
  const m=$('main'); if(m){ m.classList.toggle('wide',WIDE_VIEWS.includes(cur));
    m.classList.toggle('tight',cur==='daily'||(cur==='run'&&!!A)||cur==='bio'); }
}
function tab(t){
  if(t==='log') t='stats';                 // History lives inside Stats & history now
  if(!VIEWS.includes(t)) t='daily';
  if(cur==='set'&&t!=='set') setWeightsDone();
  cur=t;
  VIEWS.forEach(k=>{ if(k!=='run') $('v-'+k).classList.add('hide'); });
  $('v-run').classList.add('hide'); $('v-setup').classList.add('hide');
  navSync();
  paintPondCard();
  if(t==='run'){ A?run():showSetup(); flashIn($(A?'v-run':'v-setup')); window.scrollTo(0,0); rainSync(); return; }
  rainSync();
  clearInterval(tick); tick=null;
  $('v-'+t).classList.remove('hide');
  if(t==='daily') paintDaily();
  if(t==='asg'){ asgJustDone.clear(); journeyTick(); paintAsg(); }
  if(t==='jrn'){ checkJourneyEnds(); journeyTick(); paintJourneys(); }
  if(t==='proj'&&window.PJ) PJ.paint();    // projects.js
  if(t==='dia'){ diaShownMode=diaMode; paintDiary(); }
  if(t==='stk') paintStickies();
  if(t==='bio'){ bioFresh=true; paintBio(); }
  if(t==='stats') paintStats();
  if(t==='log') paintLog();
  if(t==='coll'){ collN=12; paintCollection(); }
  if(t==='set') paintSettings();
  flashIn($('v-'+t));
  window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if(window.PondEvents?.isOpen()) return; // the scene dialog owns its keyboard
  // Escape has to be handled before the guards below — those exist to protect
  // typing, but dismissing a dialog from inside its own text field is exactly
  // what you'd expect Escape to do.
  if(e.key==='Escape'&&$('modals').innerHTML){
    if(!modalLocked) closeModal();
    return;
  }
  /* a new species on screen: Enter or Space finishes the reveal, then goes
     on; Escape closes it (and any still queued). Nothing behind it reacts,
     not even a field left focused under it. */
  if(unlockOpen()&&!$('modals').innerHTML){
    const onBtn=!!(document.activeElement&&document.activeElement.closest('#v-unlock button'));
    if(e.key==='Escape'){ e.preventDefault(); unlockClose(true); }
    else if((e.key==='Enter'||e.code==='Space')&&!onBtn){ e.preventDefault(); if(!unlockSkip()) unlockClose(); }
    else if(!onBtn&&e.key!=='Tab') e.preventDefault();
    return;
  }
  if(isTyping(e.target)||$('modals').innerHTML) return;
  /* the Hello page answers Enter and Escape, and keeps Space from pausing
     a timer you can't see yet */
  if(helloOpen()){
    const onBtn=!!(document.activeElement&&document.activeElement.closest('#v-hello button'));
    if(e.key==='Escape'){ e.preventDefault(); helloGo(null); }                 // just close, stay where the app is
    else if(e.key==='Enter'&&!onBtn){ e.preventDefault(); helloGo(_helloGo); }  // a focused button handles its own Enter
    else if(e.code==='Space'&&!onBtn) e.preventDefault();
    return;
  }
  if(e.code==='Space'&&A&&cur==='run'){ e.preventDefault(); togglePause(); }
});
/* Keyboard play for the drill. Typed questions never reach here — the input has
   focus, so isTyping() above returns first and Enter is handled by the field
   itself. This covers the click-only types. */
function sdKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(Q.phase==='card'){
    if(e.key==='Enter'){ e.preventDefault(); sdCardDone(); }
    return;
  }
  const q=sdCurQ(); if(!q) return;
  if(e.key==='Enter'){
    e.preventDefault();
    if(Q.res) sdNext();
    else if(!sdTypedType(q)) sdSubmit();   // typed ones are submitted from the field
    return;
  }
  if(Q.res) return;
  if((e.key==='r'||e.key==='R')&&q.type==='listen'&&q.audioText){ e.preventDefault(); sdSpeak(q.audioText); return; }
  if(!/^[1-9]$/.test(e.key)) return;
  const i=+e.key-1;
  if(q.type==='mcq'||(q.type==='listen'&&q.mode==='meaning')){
    if(i<(q.choices||[]).length){ e.preventDefault(); Q.pick=i; sdPaintRun(); }
  } else if(q.type==='discriminate'){
    // first the form, then the reason — same order the screen asks for them
    if(Q.pick==null){ if(i<(q.choices||[]).length){ e.preventDefault(); Q.pick=i; sdPaintRun(); } }
    else if(i<(q.reasons||[]).length){ e.preventDefault(); Q.reason=i; sdPaintRun(); }
  }
}
// clicking the dimmed backdrop closes a dismissible dialog
document.addEventListener('mousedown',e=>{
  if(modalLocked) return;
  if(e.target.classList&&e.target.classList.contains('veil')) closeModal();
});
window.addEventListener('beforeunload',()=>{
  clearTimeout(saveT); clearTimeout(fileT);
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){}
  // fetch() can get cancelled mid-flight when the tab closes; sendBeacon is
  // built for exactly this — it's queued by the browser and survives unload.
  if(SERVER){ try{ navigator.sendBeacon('/focus-data.json', new Blob([JSON.stringify(db)],{type:'text/plain'})); }catch(e){} }
});
setInterval(()=>{ if(A) save(); },20000);

/* Phones dim and lock after ~30 seconds, which freezes the running timer's
   display. While a block is running (not paused) on a touch device, ask the
   browser to keep the screen on; let go the moment it stops or the app is
   hidden. Unsupported browsers simply skip this. */
let wakeLock=null;
async function syncWakeLock(){
  try{
    if(!('wakeLock' in navigator)||!matchMedia('(pointer:coarse)').matches) return;
    const want=!!A&&!A.paused&&!document.hidden;
    if(want&&!wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{ wakeLock=null; });
    }else if(!want&&wakeLock){ const w=wakeLock; wakeLock=null; await w.release(); }
  }catch(e){ wakeLock=null; }
}
setInterval(syncWakeLock,2000);
document.addEventListener('visibilitychange',syncWakeLock);

// watch the agent inbox: on window focus, and every 45s while the tab is visible
let lastPeek=0;
function peek(){
  if(!SERVER||$('modals').innerHTML) return;
  if(Date.now()-lastPeek<8000) return;
  lastPeek=Date.now(); checkInbox(true);
}
window.addEventListener('focus',peek);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) peek(); });
setInterval(()=>{ if(!document.hidden) peek(); },45000);

/* ── load counter: the honest test of whether anything is persisting ── */
db.loads=(db.loads||0)+1;
if(!db.firstRun) db.firstRun=Date.now();
try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){}

function paintWarn(){
  const el=$('warn'); if(!el) return;

  if(MODE==='hosted'){ el.innerHTML=window.RLSync?RLSync.banner():''; return; }   // storage lives in the browser; only nudge towards sync

  if(SERVER){
    el.innerHTML = db.loads<=2
      ? `<div class="ok-note">Autosaving to <code>focus-data.json</code> on
          <code>${esc(location.host||'this origin')}</code> — load #${db.loads}. Everything persists from here.
          <button class="xs ghost" style="margin-left:8px" onclick="syncOut().then(()=>toast('Written'))">Save now</button>
          <button class="xs ghost" onclick="$('warn').innerHTML=''">Got it</button></div>`
      : '';
    return;
  }
  el.innerHTML=`<div class="alarm">
    <h3>Nothing is being saved yet</h3>
    <p>This page was opened straight off the disk (<code>file://</code>), so there's no server to
    write your data to and Brave throws away storage for files opened this way. That's why you
    kept landing on the same list — every launch started from an empty database and re-ran the seed.</p>
    <p>Close this tab and double-click <code>Start Catching Days.bat</code> instead — it starts the small
    local server that writes <code>focus-data.json</code> for you. Nothing to click, nothing to
    remember, and nothing to re-connect on the next launch.</p>
    <div class="row wrapf" style="gap:8px;margin:12px 0 4px">
      <button class="sm ghost" onclick="exportData()">Export what's here first</button>
    </div>
    <p class="faint" style="color:#a04a3f">Times opened: ${db.loads}. On a working setup that
      number climbs every launch. If it stays at 1, saving is still broken.</p>
  </div>`;
}

/* ═══════════════ boot ═══════════════
   Outside SERVER (plain file://) there's no fetch to wait on, so boot()'s
   localStorage read is already the final answer — reveal immediately.
   Under SERVER, focus-data.json is about to be fetched in initServer() below
   and is the real source of truth; revealing here first from a synchronous,
   possibly-stale-or-empty localStorage guess (then swapping right after) is
   exactly what made the welcome screen flash for a
   moment on every load. So under SERVER, skip this and let initServer()'s
   rehydrate() do the one real reveal once the file's answer is in. */
if(!SERVER) rehydrate();
if(MODE==='hosted'&&'serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
if(prunePicks()) save();   // drop day-plans older than 30 days
paintWarn();
window.appReady=initServer();
importGoogleTasks();   // seed Google Tasks into the assignment store (deduped, runs once)
checkJourneyEnds(); journeyTick();
