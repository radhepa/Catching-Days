}
function vgKick(){
  if(!VG||VG.raf) return;
  const loop=()=>{
    if(!VG||!VG.cv.isConnected){ if(VG) VG.raf=0; return; }
    if(VG.alpha>0.02||VG.drag){ vgStep(); }
    const panning=VG.focus?!vgCenterOn(VG.focus):false;
    vgDraw();
    if(VG.alpha>0.02||VG.drag||panning){ VG.raf=requestAnimationFrame(loop); } else VG.raf=0;
  };
  VG.raf=requestAnimationFrame(loop);
}
/* glide the view until the focused node sits in the middle; true once there */
function vgCenterOn(id){
  const n=VG.by.get(id); if(!n){ VG.focus=null; return true; }
  const tx=-n.x*VG.view.k, ty=-n.y*VG.view.k;
  VG.view.x+=(tx-VG.view.x)*0.18; VG.view.y+=(ty-VG.view.y)*0.18;
  if(Math.hypot(tx-VG.view.x,ty-VG.view.y)<1){ VG.view.x=tx; VG.view.y=ty; VG.focus=null; return true; }
  return false;
}
const vgToScreen=(x,y)=>[x*VG.view.k+VG.w/2+VG.view.x, y*VG.view.k+VG.h/2+VG.view.y];
const vgToWorld=(sx,sy)=>[(sx-VG.w/2-VG.view.x)/VG.view.k, (sy-VG.h/2-VG.view.y)/VG.view.k];
function vgFit(quiet){
  if(!VG||!VG.nodes.length){ return; }
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  VG.nodes.forEach(n=>{ x0=Math.min(x0,n.x-n.r-30); y0=Math.min(y0,n.y-n.r); x1=Math.max(x1,n.x+n.r+30); y1=Math.max(y1,n.y+n.r+18); });
  const pad=70, k=Math.max(0.12,Math.min(1.8,Math.min((VG.w-pad)/(x1-x0||1),(VG.h-pad)/(y1-y0||1))));
  VG.view={k,x:-(x0+x1)/2*k,y:-(y0+y1)/2*k};
  if(!quiet) vgDraw();
}
function vgZoom(f,sx,sy){
  if(!VG) return;
  sx=sx??VG.w/2; sy=sy??VG.h/2;
  const [wx,wy]=vgToWorld(sx,sy);
  VG.view.k=Math.max(0.1,Math.min(4,VG.view.k*f));
  VG.view.x=sx-VG.w/2-wx*VG.view.k; VG.view.y=sy-VG.h/2-wy*VG.view.k;
  vgDraw();
}
function vgWheel(ev){ ev.preventDefault(); const r=VG.cv.getBoundingClientRect();
  vgZoom(Math.exp(-ev.deltaY*0.0015),ev.clientX-r.left,ev.clientY-r.top); }
function vgHit(sx,sy){
  const [wx,wy]=vgToWorld(sx,sy); let best=null, bd=Infinity;
  VG.nodes.forEach(n=>{ const d=Math.hypot(n.x-wx,n.y-wy); const lim=n.r+6/VG.view.k;
    if(d<lim&&d<bd){ bd=d; best=n; } });

}
function vgPt(ev){ const r=VG.cv.getBoundingClientRect(); return [ev.clientX-r.left,ev.clientY-r.top]; }
function vgDown(ev){
  VG.cv.setPointerCapture(ev.pointerId);

  VG.ptrs.set(ev.pointerId,[sx,sy]);
  if(VG.ptrs.size===2){ const [a,b]=[...VG.ptrs.values()]; VG.pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])}; VG.drag=null; return; }
  const n=vgHit(sx,sy);
  VG.drag={node:n,sx,sy,vx:VG.view.x,vy:VG.view.y,moved:false};
  VG.cv.style.cursor='grabbing';
}
function vgMove(ev){
  if(!VG) return;
  const [sx,sy]=vgPt(ev);
  if(VG.ptrs.has(ev.pointerId)) VG.ptrs.set(ev.pointerId,[sx,sy]);
  if(VG.pinch&&VG.ptrs.size===2){
    const [a,b]=[...VG.ptrs.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    vgZoom(d/VG.pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2); VG.pinch.d=d; return;
  }
  const D=VG.drag;
  if(D){
    if(Math.hypot(sx-D.sx,sy-D.sy)>4) D.moved=true;
    if(D.node){ if(!D.moved) return;
      const [wx,wy]=vgToWorld(sx,sy); D.node.x=wx; D.node.y=wy; VG_POS.set(D.node.id,{x:wx,y:wy});
      VG.alpha=Math.max(VG.alpha,0.15); vgKick(); }
    else { VG.view.x=D.vx+(sx-D.sx); VG.view.y=D.vy+(sy-D.sy); vgDraw(); }
    return;
  }
  const h=vgHit(sx,sy);
  if(h!==VG.hover){ VG.hover=h; VG.cv.style.cursor=h?'pointer':'grab'; vgDraw(); }
}
function vgUp(ev){
  if(!VG) return;
  VG.ptrs.delete(ev.pointerId);
  if(VG.ptrs.size<2) VG.pinch=null;
  const D=VG.drag; VG.drag=null;
  VG.cv.style.cursor=VG.hover?'pointer':'grab';
  if(!D||D.moved||ev.type==='pointercancel') return;
  const n=D.node;
  if(!n) return;
  if(n.kind==='topic') vaultPick(n.ref);
  else vaultOpenEntry(n.ref);
}
/* The map is drawn on the water: topics are lily pads (a disc with the
   notch cut out), entries are small koi in their mood's colour, and
   entry-to-entry connections are dashed. Same force layout as before. */
const vgAng=id=>{ let x=7; for(const c of String(id)) x=(x*31+c.charCodeAt(0))>>>0; return (x%628)/100; };
function vgKoi(ctx,col){
  ctx.fillStyle=col;
  ctx.globalAlpha*=.85; ctx.beginPath(); ctx.moveTo(-17,0); ctx.lineTo(-30,-8); ctx.quadraticCurveTo(-26,0,-30,8); ctx.closePath(); ctx.fill(); ctx.globalAlpha/=.85;
  const a0=ctx.globalAlpha; ctx.globalAlpha=a0*.7;
  ctx.beginPath(); ctx.ellipse(4,-7,5,2.2,-0.52,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4,7,5,2.2,0.52,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=a0;
  ctx.beginPath(); ctx.ellipse(-2,0,17,7,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9,0,10,6.5,0,0,Math.PI*2); ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle='#fbf8f2';
  ctx.beginPath(); ctx.ellipse(-3,-1,6,3.5,0,0,Math.PI*2); ctx.fill();
}
function vgDraw(){
  if(!VG||!VG.cv.isConnected) return;
  const {ctx,dpr,w,h}=VG;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const q=vNorm(vaultQ);
  const focusNode=VG.hover||(vaultSel?VG.by.get('t:'+vaultSel):null);
  const near=focusNode?VG.nb.get(focusNode.id):null;
  const lit=n=>{
    if(q){ return n.kind==='topic'?vaultMatchTopic(n.t,q):vaultMatchEntry(n.e,q); }
    if(!focusNode) return true;
    return n===focusNode||near.has(n.id);
  };
  const k=VG.view.k, zs=Math.min(1.6,Math.max(0.55,k));
  ctx.lineCap='round';
  VG.edges.forEach(ed=>{
    const on=focusNode&&(ed.s===focusNode||ed.d===focusNode);
    const [x1,y1]=vgToScreen(ed.s.x,ed.s.y), [x2,y2]=vgToScreen(ed.d.x,ed.d.y);
    ctx.beginPath(); ctx.moveTo(x1,y1);

      ctx.strokeStyle='#f7c7a6'; ctx.lineWidth=1.6; ctx.setLineDash([5,6]);
      const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
      ctx.quadraticCurveTo(mx-dy/L*28,my+dx/L*28,x2,y2);
    } else {

  });
  ctx.setLineDash([]);
  const topics=VG.nodes.filter(n=>n.kind==='topic'), entries=VG.nodes.filter(n=>n.kind==='entry');
  topics.forEach(n=>{
    const [x,y]=vgToScreen(n.x,n.y), r=n.r*zs, on=n.ref===vaultSel||n===VG.hover, rot=vgAng(n.id);
    ctx.save();
    ctx.globalAlpha=lit(n)?1:.3;
    if(on){ ctx.shadowColor=n.hex; ctx.shadowBlur=16; }
    else { ctx.shadowColor='rgba(5,25,28,.45)'; ctx.shadowBlur=12; ctx.shadowOffsetY=8; }
    ctx.fillStyle=on?'#86b58f':'#5f9470';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.arc(x,y,r,rot+0.49,rot+Math.PI*2); ctx.closePath(); ctx.fill();
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y,r*.8,0,Math.PI*2); ctx.stroke();
    const cr=Math.max(5,9*zs), g=ctx.createRadialGradient(x,y,0,x,y,cr);
    g.addColorStop(0,'#fbf8f2'); g.addColorStop(.25,'#fbf8f2'); g.addColorStop(.3,n.hex); g.addColorStop(1,n.hex);
    ctx.shadowColor=n.hex; ctx.shadowBlur=14;
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,cr,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

    const [x,y]=vgToScreen(n.x,n.y), s=.64*zs*(n===VG.hover?1.2:1);
    ctx.save();

    ctx.globalAlpha=lit(n)?1:.35;

    ctx.font=`400 ${fs}px 'Young Serif', Georgia, serif`;
    const label=n.label.length>28?n.label.slice(0,27)+'…':n.label;
    ctx.shadowColor='#0a2a2f'; ctx.shadowBlur=8;

    ctx.shadowBlur=0; ctx.shadowColor='transparent';
    ctx.font=`400 12px Outfit, sans-serif`; ctx.fillStyle='#9fc2bb';
    ctx.fillText(n.count+(n.count===1?' entry':' entries'),x,y+r+11+fs);
  });
  ctx.textAlign='left'; ctx.textBaseline='middle';
  entries.forEach(n=>{
    const show=n===VG.hover||(focusNode&&near.has(n.id))||(q&&lit(n))||k>1.5;
    if(!show) return;
    const [x,y]=vgToScreen(n.x,n.y);
    ctx.globalAlpha=lit(n)?1:.4;
    ctx.font=`400 12px Outfit, sans-serif`;
    const t=n.e.title||'Untitled', label=dShort(n.e.date).replace(/(st|nd|rd|th)$/,'')+' · '+(t.length>24?t.slice(0,23)+'…':t);
    const tw=ctx.measureText(label).width, bx=x+14*zs+4, by=y-10;
    ctx.fillStyle='rgba(15,59,65,.82)';
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(bx,by,tw+14,20,7); else ctx.rect(bx,by,tw+14,20); ctx.fill();
    ctx.fillStyle='#cfe2dd'; ctx.fillText(label,bx+7,by+10.5);
  });
  ctx.globalAlpha=1;
}

/* ── Hermes' suggestions, arriving through inbox.json ──
   {"vault":{"topics":[{name,summary,aliases}],
             "tags":[{entry,topics:[…],why}],
             "links":[{from,to,why}]}}
   Entries are referenced by id (agent-context.md prints them). Anything that
   names an entry we don't have is dropped, never guessed at. */
function vaultEntryRef(ref){
  if(!ref) return null;
  const s=String(ref).trim();
  const e=diaryById(s); if(e) return e;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const es=(db.diary||[]).filter(x=>x.date===s); if(es.length===1) return es[0]; }
  return null;
}
function vaultInboxParse(v){
  const out={topics:[],updates:[],tags:[],links:[],skipped:0};
  if(!v||typeof v!=='object') return out;
  const fresh=new Map();
  const str=x=>String(x==null?'':x).trim();
  (Array.isArray(v.topics)?v.topics:[]).forEach(t=>{
    const name=str(typeof t==='string'?t:t&&t.name).slice(0,80); if(!name) return;
    const summary=str(t&&t.summary), aliases=(Array.isArray(t&&t.aliases)?t.aliases:[]).map(str).filter(Boolean);
    const ex=vTopicByName(name);
    if(ex){
      const addAl=aliases.filter(a=>!ex.aliases.some(b=>vNorm(b)===vNorm(a))&&vNorm(a)!==vNorm(ex.name));
      if((summary&&summary!==ex.summary)||addAl.length) out.updates.push({on:true,topic:ex,summary:summary&&summary!==ex.summary?summary:'',aliases:addAl});
    } else if(!fresh.has(vNorm(name))){
      const p={on:true,name,summary,aliases}; fresh.set(vNorm(name),p); out.topics.push(p);
    }
  });
  const topicFor=name=>{
    const n=str(name).slice(0,80); if(!n) return null;
    const t=vTopicByName(n)||fresh.get(vNorm(n)); if(t) return t;
    const p={on:true,name:n,summary:'',aliases:[]}; fresh.set(vNorm(n),p); out.topics.push(p); return p;
  };
  (Array.isArray(v.tags)?v.tags:[]).forEach(g=>{
    if(!g) return;
    const e=vaultEntryRef(g.entry||g.entryId||g.id);
    const names=[].concat(g.topics||g.topic||[]).filter(Boolean);
    if(!e){ out.skipped+=names.length||1; return; }
    names.forEach(nm=>{
      const t=topicFor(nm); if(!t) return;
      if(t.id&&vTags().some(x=>x.entryId===e.id&&x.topicId===t.id)) return;   // already there, or you removed it
      if(out.tags.some(x=>x.entry===e&&x.topic===t)) return;
      out.tags.push({on:true,entry:e,topic:t,why:str(g.why).slice(0,300)});
    });
  });
  (Array.isArray(v.links)?v.links:[]).forEach(l=>{
    if(!l) return;
    const a=vaultEntryRef(l.from||l.a), b=vaultEntryRef(l.to||l.b);
    if(!a||!b||a===b){ out.skipped++; return; }
    const same=x=>(x.a===a.id&&x.b===b.id)||(x.a===b.id&&x.b===a.id);
    if(vLinks().some(same)) return;
    if(out.links.some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a))) return;
    out.links.push({on:true,a,b,why:str(l.why).slice(0,300)});
  });
  return out;
}

function vaultInboxCountBtn(){

async function vaultInboxCommit(accept){
  const p=vInbox; if(!p) return;
  let added=0;
  if(accept){
    p.topics.forEach(t=>{ if(t.on){ t.made=vaultMakeTopic(t.name,{by:'hermes',summary:t.summary,aliases:t.aliases}); added++; } });
    p.updates.forEach(u=>{ if(!u.on) return; if(u.summary) u.topic.summary=u.summary;
      u.topic.aliases=u.topic.aliases.concat(u.aliases); u.topic.updated=Date.now(); added++; });
  }
  const real=t=>t.id?t:t.made||null;
  p.tags.forEach(g=>{
    const t=real(g.topic); if(!t) return;
    const rec=vaultTagEntry(g.entry.id,t.id,'hermes',g.why);
    if(accept&&g.on) added++; else rec.off=true;           // declined: remembered so it isn't suggested again
  });
  p.links.forEach(l=>{
    const rec=vaultLinkEntries(l.a.id,l.b.id,'hermes',l.why);
    if(accept&&l.on) added++; else rec.off=true;
  });
  vInbox=null;
  save(); closeModal();
  await vaultInboxClear();
  toast(accept?`Added ${added} to your vault.`:'Suggestions discarded.');
  if(cur==='dia') paintDiary();
  setTimeout(()=>checkInbox(true),400);                     // any assignments that came in the same file
}
/* take the vault part out of inbox.json, leave any assignments for their own preview */
async function vaultInboxClear(){
  const txt=await rFile('inbox.json'); let o=null;
  try{ o=JSON.parse(txt); }catch(e){}
  if(o&&typeof o==='object'&&!Array.isArray(o)){ delete o.vault; if(!Object.keys(o).length) o.assignments=[]; }
  else o={assignments:[]};
  await wFile('inbox.json',JSON.stringify(o,null,2));
}

/* ═══════════════ Collection ═══════════════
   The pond's field guide. Tiles are drawn a dozen at a time ("Show 12
   more"), and each tile's water skips rendering while off screen
   (content-visibility), so the full catalog never means every pond animating. */
let collFilter='all', collN=12, collKind='fish';
const GOAL_UNIT={tasks:'tasks',focusH:'hours',jdays:'days',fstreak:'days',streak:'days',blooms:'blooms',bloomRun:'days',noon:'tasks',late:'tasks',reeds:''};
const lowerFirst=s=>s.charAt(0).toLowerCase()+s.slice(1);
/* where a found species came from, in a line */
function speciesLine(sp,st){
  const f=st.found[sp.k], n=st.count[sp.k]||0, rel=n?` · ${n} released`:'';
  if(!f) return '';
  if(f.how==='adopt') return `Adopted by ${(st.adoptBy[sp.k]||[]).map(clsShort).map(esc).join(', ')}${rel}`;
  const when=f.at?(dayKey(f.at)===today()?'today':'on '+fMD(f.at)):'';
  if(f.how==='task') return when==='today'?`Caught today · released by a finished task${n>1?rel:''}`:`Caught ${when}${rel}`;
  if(f.how==='goal') return `Found ${when}, once you ${lowerFirst(sp.goal.t)}${rel}`;
  return `Found ${when}${rel}`;
}
function collSet(f){ collFilter=f; collN=12; paintCollection(); }
function collKindSet(k){ collKind=k; paintCollection(); }
function paintCollection(){
  const el=$('coll-body'); if(!el) return;
  /* Fish | Bugs | Toads: discoveries, visitors, and the always-readable cast. */
  const kindSw=`<div class="co-filt co-kind">${[['fish','Fish'],['bugs','Bugs'],['toads','Toads']].map(([k,l])=>`<button class="${collKind===k?'on':''}" aria-pressed="${collKind===k}" onclick="collKindSet('${k}')">${l}</button>`).join('')}</div>`;
  if(collKind==='toads'){ window.ToadCollection.render(el,kindSw); window.PondEvents?.refresh(true); return; }
  if(collKind==='bugs'){ paintBugCollection(el,kindSw); window.PondEvents?.refresh(true); return; }
  const st=pondState(), P=PondArt; P.PF.motion=pondMotionOn();
  const pct=Math.round(st.foundN/st.total*100);
  /* next to find */
  P.reseed(41);
  const nx=st.next;
  const feat=nx?`<div class="co-feat water">
      <div class="amb" style="inset:auto;right:0;top:0;width:820px;height:230px">${P.deep('koi',P.loop(600,120,200,70,5,.4),50,false,1.4)}${P.caustics(820,230,.22)}${P.ripple(600,115,160,0)}
        <div style="position:absolute;inset:0;z-index:4">${P.swimmer(P.loop(610,115,150,60,6,.35),30,false,P.creature(nx.sp.k,'#0a2a2f','#0a2a2f',Math.min(2.2,nx.sp.s*1.6),.9,{opacity:.85,filter:'blur(.6px)'}),4)}</div>
        ${P.glints(820,230,6)}</div>
      <div class="shade"></div>
      <div class="cp">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span class="eyebrow ey">Something is circling · next to find</span>
          <span class="nm">${esc(nx.sp.name)}</span>
          <p>${nx.sp.rar}. Turns up once you ${lowerFirst(nx.sp.goal.t)}.</p>
        </div>
        <div><div class="pg"><span>${nx.p.cur} of ${nx.p.n} ${GOAL_UNIT[nx.sp.goal.m]}</span><span>${Math.max(0,nx.p.n-nx.p.cur)} to go</span></div>
          <div class="pbar"><i style="width:${nx.p.pct}%"></i></div></div>
      </div></div>`
    :`<div class="co-feat water"><div class="amb">${P.caustics(820,230,.22)}${P.glints(820,230,6)}</div><div class="shade"></div>
      <div class="cp"><div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow ey">The whole field guide</span>
        <span class="nm">${st.foundN===st.total?'Every species found':'More fish to discover'}</span><p>${st.foundN===st.total?'There is nothing left circling. The pond is complete.':'Keep finishing tasks. New species can still swim into your pond.'}</p></div></div></div>`;
  /* rarity + the latest find */
  const last=Object.keys(st.found).filter(k=>st.found[k].how!=='adopt'&&st.found[k].at).sort((a,b)=>st.found[b].at-st.found[a].at)[0];
  const lastLine=last?(()=>{ const sp=P.SP[last], f=st.found[last];
      const how=f.how==='task'?'released by a finished task':f.how==='goal'?`once you ${lowerFirst(sp.goal.t)}`:'';
      return `Last found: <b>${esc(sp.name)}</b>, ${dayKey(f.at)===today()?'today':'on '+fMD(f.at)}${how?', '+how:''}.`; })()
    :'Finish a task and see what swims in.';
  const rar=['Common','Uncommon','Rare','Legendary'].map(r=>{ const all=P.SPEC.filter(s=>s.rar===r), f=all.filter(s=>st.found[s.k]).length, R=P.RAR[r];
    return `<div class="r"><em style="color:${R.ink};background:${R.bg}">${r}</em><div class="pbar"><i style="width:${Math.round(f/all.length*100)}%;background:${R.ink}"></i></div><span>${f}/${all.length}</span></div>`; }).join('');
  /* the grid */
  const src=P.SPEC.filter(s=>collFilter==='all'||(collFilter==='found'?!!st.found[s.k]:!st.found[s.k]));
  P.reseed(31);
  const tiles=src.slice(0,collN).map(sp=>{
    const f=!!st.found[sp.k], R=P.RAR[sp.rar], pr=st.prog(sp);
    const water=[P.caustics(300,150,.2),P.ripple(+(60+P.rnd()*180).toFixed(0),+(40+P.rnd()*70).toFixed(0),110,+(P.rnd()*5).toFixed(1))];
    if(f){ if(sp.k==='frog') water.push(P.pad(150,75,40,30,'#5f9470',null));
      water.push(P.swimmer(P.loop(150,78,80,34,5,.35),sp.k==='puffer'?26:+(16+P.rnd()*8).toFixed(1),sp.no%2===0,P.fish(sp.k,sp.s,.6),4)); }
    else { if(sp.k==='frog') water.push(P.pad(150,80,40,30,'#3f6f55',null));
      water.push(`<div style="position:absolute;left:150px;top:78px;transform:translate(-50%,-50%);z-index:5;opacity:.85">${P.shadowFish(sp.k,sp.s*1.15)}</div><div class="dx-q">?</div>`); }
    water.push(P.glints(300,150,3));
    const req=sp.goal?(sp.goal.m==='reeds'?`${sp.goal.t}${st.overdueN?` · ${st.overdueN} still there`:''}`:sp.goal.t)
      :'Turns up when you finish tasks';
    const tip=f?speciesLine(sp,st).replace(/<[^>]+>/g,''):req;
    return `<div class="dx${f?' open':''}" title="${esc(tip)}"${f?` onclick="unlockView('${sp.k}')"`:''}>
      <div class="dx-w water ${f?'fnd':'hid'}" style="box-shadow:none">
        <div class="amb" style="width:300px;left:50%;margin-left:-150px">${water.join('')}</div>
        <span class="dx-r" style="color:${R.ink};background:${R.bg}">${sp.rar}</span>
        <span class="dx-no">No. ${String(sp.no).padStart(2,'0')}</span>
      </div>
      <div class="dx-b"><b style="color:${f?'var(--tx)':'var(--dim)'}">${esc(sp.name)}</b>
        ${f?`<p>${speciesLine(sp,st)}</p>`
          :`<p>${esc(req)}</p>${pr&&sp.goal.m!=='reeds'?`<div class="pg"><div class="pbar"><i style="width:${pr.pct}%"></i></div><span>${pr.cur} / ${pr.n}</span></div>`:''}`}
      </div></div>`;
  }).join('');
  const more=Math.min(12,src.length-collN);
  const nF=st.foundN;
  el.innerHTML=`<div class="co">${kindSw}
    <div class="phead">
      <div><h1 class="ptitle">Collection</h1>
        <div class="psub" style="max-width:560px">Every class adopts a species. Keep your habits going and new ones find their way into the pond.</div></div>
      <div class="co-n"><div><b>${nF}</b><span>of ${st.total} found</span></div><div class="pbar"><i style="width:${pct}%"></i></div></div>
    </div>
    <div class="co-top">${feat}
      <div class="pcard co-rar"><span class="pcard-t">By rarity</span>${rar}<div class="last">${lastLine}</div></div>
    </div>
    <div class="co-bar">
      <div class="co-filt">${[['all',`All ${st.total}`],['found',`Found ${nF}`],['hidden',`Still hidden ${st.total-nF}`]].map(([k,l])=>
        `<button class="${collFilter===k?'on':''}" onclick="collSet('${k}')">${l}</button>`).join('')}</div>

  </div>`;
  window.PondEvents?.refresh(true);
}

function bioModal(edit,presetCat){
  const e=edit?bioEntry(edit):null;
  /* Adding from inside a category should stay in that category — filtering to
     People and then hand-picking People from a dropdown is a step that never
     needed to exist. Explicit preset wins, then the category you're filtered
     to, then whatever you filed last, then the first one. Always changeable. */
  const catId = e ? e.cat
    : presetCat || (bioCatFilter!=='all' ? bioCatFilter : null)
      || bioLastCat || bioCats()[0].id;
  let imgVal = e?.img || '';
  modal(`<h2>${e?'Edit':'New'} entry</h2>
    <div id="be-img-wrap" class="row" style="gap:13px;margin-top:16px;align-items:center"></div>
    <label class="lbl" style="margin-top:16px">Category</label>
    <select id="be-cat">${bioCats().map(c=>
      `<option value="${c.id}" ${c.id===catId?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select>
    <div id="be-fields"></div>
    <label class="lbl" style="margin-top:14px">Notes</label>
    <textarea id="be-notes" rows="3" placeholder="Anything you would want an AI to know.">${esc(e?.notes||'')}</textarea>
    <label class="lbl" style="margin-top:14px">Tags <span class="faint">— comma separated</span></label>
    <input id="be-tags" value="${esc((e?.tags||[]).join(', '))}" placeholder="leadership, python" autocomplete="off">
    <label class="row" style="gap:9px;margin-top:16px;cursor:pointer;align-items:flex-start">
      <input type="checkbox" id="be-sens" ${e?.sensitive?'checked':''} style="width:auto;flex:none;margin-top:2px">
      <span style="font-size:13px">Private — keep out of application exports
        <span class="faint" style="display:block;font-size:12px;margin-top:2px">Still visible to
          your own AI on this computer. Just never included in the copy you paste
          into an application, essay, or profile.</span></span>
    </label>
    <div class="row" style="gap:9px;margin-top:20px">
      <button class="primary" id="be-go">${e?'Save':'Add'}</button>
      <button class="ghost" onclick="closeModal()">Cancel</button>
      ${e?`<button class="danger sm" style="margin-left:auto" onclick="delBioEntry('${e.id}')">Delete</button>`:''}
    </div>`,true);

  /* What's currently in the form, whether or not it has been saved. Switching
     category re-renders these inputs, and reading from the stored entry would
     silently discard everything typed since the modal opened — you would pick
     the right category and lose the title you just wrote. */
  const draft=Object.assign({title:'',org:'',role:'',relation:'',start:'',end:'',
                             link:'',current:false,bullets:''},
    e?{title:e.title,org:e.org,role:e.role,relation:e.relation,start:e.start,end:e.end,
       link:e.link,current:e.current,bullets:(e.bullets||[]).join('\n')}:{});
  const readDraft=()=>{
    const g=id=>{ const el=$(id); return el?el.value:undefined; };
    [['title','be-title'],['org','be-org'],['role','be-role'],['relation','be-rel'],
     ['start','be-start'],['end','be-end'],['link','be-link'],['bullets','be-bul']
    ].forEach(([k,id])=>{ const v=g(id); if(v!==undefined) draft[k]=v; });
    if($('be-cur')) draft.current=$('be-cur').checked;
  };

  const paintFields=()=>{
    const k=bioKind($('be-cat').value);
    const lbl=k==='person'?'Name':k==='thing'?'What it is':'Title';
    const orgLbl=k==='person'?'Where you know them from'
                :k==='thing' ?'Make / model / detail'
                :'Organization';
    $('be-fields').innerHTML=`
      <label class="lbl" style="margin-top:14px">${lbl}</label>
      <input id="be-title" value="${esc(draft.title)}" autocomplete="off"
        placeholder="${k==='person'?'Alex Chen':k==='role'?'Undergraduate Research Assistant':'Photography'}">
      ${k==='person'?`
        <label class="lbl" style="margin-top:14px">Relationship</label>
        <select id="be-rel">${BIO_RELATIONS.map(([v,l])=>
          `<option value="${v}" ${draft.relation===v?'selected':''}>${l}</option>`).join('')}</select>`:''}
      ${k!=='plain'?`
        <label class="lbl" style="margin-top:14px">${orgLbl}</label>
        <input id="be-org" value="${esc(draft.org)}" autocomplete="off">`:''}
      ${k==='role'?`
        <label class="lbl" style="margin-top:14px">Your role</label>
        <input id="be-role" value="${esc(draft.role)}" placeholder="Treasurer" autocomplete="off">
        <div class="row" style="gap:10px;margin-top:14px">
          <div style="flex:1"><label class="lbl">Started</label>
            <input id="be-start" value="${esc(draft.start)}" placeholder="Aug 2026" autocomplete="off"></div>
          <div style="flex:1"><label class="lbl">Ended</label>
            <input id="be-end" value="${esc(draft.end)}" placeholder="May 2027" autocomplete="off"
              ${draft.current?'disabled':''}></div>
        </div>
        <label class="row" style="gap:8px;margin-top:10px;cursor:pointer">
          <input type="checkbox" id="be-cur" ${draft.current?'checked':''} style="width:auto;flex:none">

        <label class="lbl" style="margin-top:14px">What you did

        <textarea id="be-bul" rows="4" placeholder="Ran the club budget, ~$4k/semester">${esc(draft.bullets)}</textarea>`:''}
      ${k==='role'||k==='thing'?`
        <label class="lbl" style="margin-top:14px">Link</label>
        <input id="be-link" value="${esc(draft.link)}" autocomplete="off">`:''}`;
    const cur=$('be-cur');
    if(cur) cur.onchange=()=>{ const en=$('be-end'); en.disabled=cur.checked; if(cur.checked) en.value=''; };
    const rel=$('be-rel');
    // Recording someone you avoid is useful context and terrible resume
    // material, so the private flag turns itself on the moment you say so.
    if(rel) rel.onchange=()=>{ if(rel.value==='dislike') $('be-sens').checked=true; };
  };
  /* Lives outside #be-fields so switching category never clears a picked
     image. Falls back to the same tile the list uses, so an entry without a
     picture still looks deliberate rather than broken. */
  /* A shelf category shows posters, so its picture is cropped tall (2:3)
     instead of square, and the preview here takes the same shape. */
  const isShelf=()=>{ const c=bioCat($('be-cat').value); return !!c&&bioView(c)==='shelf'; };
  const paintImg=()=>{
    const c=bioCat($('be-cat').value)||{icon:'\u{1F4CC}',kind:'plain'};
    const round=c.kind==='person'?'50%':'12px';
    const hue=bioHue(($('be-title')?$('be-title').value:'')+c.id);
    const tall=isShelf()?87:58;
    $('be-img-wrap').innerHTML=`
      ${imgVal
        ? `<img src="${imgVal}" alt="" style="width:58px;height:${tall}px;border-radius:${round};
             object-fit:cover;border:1px solid var(--line2);flex:none">`

        <button class="sm" id="be-img-pick">${imgVal?'Replace':'Add'} image</button>
        ${imgVal?`<button class="sm ghost" id="be-img-clear">Remove</button>`:''}
      </div>`;
    $('be-img-pick').onclick=()=>{
      const inp=document.createElement('input');
      inp.type='file'; inp.accept='image/*';
      inp.onchange=()=>{
        const f=inp.files&&inp.files[0]; if(!f) return;
        if(!/^image\//.test(f.type)){ toast('That is not an image.'); return; }
        const rd=new FileReader();
        rd.onload=()=>bioShrink(rd.result,isShelf()?'poster':'thumb').then(u=>{ imgVal=u; paintImg(); },
                                                        ()=>toast('Could not read that image.'));
        rd.onerror=()=>toast('Could not read that file.');
        rd.readAsDataURL(f);
      };
      inp.click();
    };
    const clr=$('be-img-clear');
    if(clr) clr.onclick=()=>{ imgVal=''; paintImg(); };
  };

  paintFields();
  paintImg();
  $('be-cat').onchange=()=>{ readDraft(); paintFields(); paintImg(); };
  $('be-title').focus();

  $('be-go').onclick=()=>{
    const t=$('be-title').value.trim(); if(!t) return;
    readDraft();
    const g=id=>{ const el=$(id); return el?el.value.trim():''; };
    const rec=e||fixBioEntry({id:uid(),created:Date.now()});
    Object.assign(rec,{
      cat:$('be-cat').value, title:t,
      org:g('be-org'), role:g('be-role'), relation:g('be-rel'),
      start:g('be-start'), end:g('be-end'),
      current:!!($('be-cur')&&$('be-cur').checked),
      link:g('be-link'), notes:$('be-notes').value.trim(),
      bullets:g('be-bul').split(/\n+/).map(x=>x.trim()).filter(Boolean),
      tags:$('be-tags').value.split(',').map(x=>x.trim()).filter(Boolean),
      img:imgVal,
      sensitive:$('be-sens').checked, updated:Date.now()
    });
    bioLastCat=rec.cat;
    if(!e) bioEntries().push(rec);
    save(); closeModal(); paintBio();
  };
}
function delBioEntry(id){
  /* The writing belongs to the Journal even if its Bio subject is removed.
     Keep every entry and only detach the now-missing Bio link. */
  (db.diary||[]).forEach(e=>{ if(e.bioEntryId===id) e.bioEntryId=null; });
  bio().entries=bioEntries().filter(x=>x.id!==id);
  save(); closeModal(); paintBio();
}

/* Adding or removing re-opens the dialog, so both first keep whatever was
   edited in the rows — otherwise renaming three sections and then adding a
   fourth would quietly throw the renames away. */
function bioCatApply(){
  const first=s=>{ s=String(s||'').trim(); if(!s) return '';
    try{ return [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)][0].segment; }
    catch(_){ return [...s].slice(0,2).join(''); } };
  document.querySelectorAll('.bio-cm-row').forEach(r=>{
    const c=bioCat(r.dataset.id); if(!c) return;
    const nm=r.querySelector('.bio-cm-nm').value.trim(); if(nm) c.name=nm;
    c.icon=first(r.querySelector('.bio-cm-ic').value)||c.icon||'📌';
    const v=r.querySelector('.bio-cm-v').value, s=r.querySelector('.bio-cm-s').value;
    if(v) c.view=v; else delete c.view;
    if(s) c.side=s; else delete c.side;
  });
  const st=$('bc-str');
  if(st){ if(st.checked) delete bio().hideStrength; else bio().hideStrength=true; }
}
function bioDelCat(id){
  if(!bioCat(id)||bioIn(id).length||BIO_CATS_DEFAULT.some(d=>d.id===id)) return;
  bioCatApply();
  bio().cats=bioCats().filter(x=>x.id!==id);
  if(bioCatFilter===id) bioCatFilter='all';
  bioOpen.delete(id);
  save(); paintBio(); bioCatModal();
}

function bioExportModal(){

  const q=bioX.useQ?bioQuery:'';

  const held=bioEntries().filter(x=>x.sensitive).length;

    </div>
    <p class="faint" style="font-size:12px;margin:7px 0 0">${bioX.plain
      ? 'No # or ** symbols — for form fields that show raw text.'
      : 'Best for a chatbot or anything that renders Markdown.'}</p>

    <label class="lbl" style="margin-top:16px">Sections — ${shownCount} entr${shownCount===1?'y':'ies'}</label>
    <div class="row wrapf" style="gap:6px">
      <button class="chip ${bioX.cats?'':'on'}" onclick="bioX.cats=null;bioExportPaint()">All</button>
      ${withEntries.map(c=>`<button class="chip ${bioX.cats&&bioX.cats.has(c.id)?'on':''}"
        onclick="bioXToggle('${c.id}')">${c.icon} ${esc(c.name)}</button>`).join('')}
    </div>
    ${bioQuery.trim()?`<label class="row" style="gap:8px;margin-top:12px;cursor:pointer">
      <input type="checkbox" ${bioX.useQ?'checked':''} onchange="bioX.useQ=this.checked;bioExportPaint()"
             style="width:auto;flex:none">
      <span style="font-size:13px">Also apply your search \u201c${esc(bioQuery.trim())}\u201d</span></label>`:''}

    <textarea id="bx-md" rows="20" class="mono" style="margin-top:14px;font-size:12px">${esc(md)}</textarea>
    <div class="row" style="gap:9px;margin-top:14px">
      <button class="primary" id="bx-copy">Copy</button>
      <button class="ghost" onclick="closeModal()">Close</button>
      <span class="faint" style="margin-left:auto;font-size:12px">${md.split('\n').length} lines</span>
    </div>`,true);

  $('bx-copy').onclick=()=>{
    // copy what is in the box, so hand-trimming before copying actually works
    const t=$('bx-md').value;
    navigator.clipboard.writeText(t).then(()=>toast('Bio copied.'),()=>{
      $('bx-md').select(); toast('Select-all and copy — clipboard was blocked.'); });
  };
}
function bioXToggle(id){
  const withEntries=bioCats().filter(c=>bioIn(c.id).length).map(c=>c.id);
  /* While "All" is active no chip is drawn as selected, so the first click
     has to mean "just this one" — starting from everything and subtracting
     would look like the click did nothing. After that they behave as
     checkboxes; clearing the last one (or ticking every one) returns to All. */
  if(!bioX.cats){ bioX.cats=new Set([id]); bioExportPaint(); return; }
  bioX.cats.has(id)?bioX.cats.delete(id):bioX.cats.add(id);
  if(!bioX.cats.size||bioX.cats.size===withEntries.length) bioX.cats=null;
  bioExportPaint();
}

/* Shrink + re-encode, split out from the picker so it can be exercised
   without a file dialog. Resolves to a JPEG data URL, or rejects. */
function bioShrink(src,kind){
  const MAX = kind==='cover' ? [1400,360] : kind==='poster' ? [240,360]
            : kind==='thumb' ? [240,240] : [400,400];
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.width, h=img.height, sx=0, sy=0, sw=w, sh=h;
        if(kind==='cover'||kind==='poster'){
          const target=MAX[0]/MAX[1];
          if(w/h>target){ sw=h*target; sx=(w-sw)/2; } else { sh=w/target; sy=(h-sh)/2; }
          w=Math.min(MAX[0],sw); h=w/target;
        } else {
          const side=Math.min(w,h); sx=(w-side)/2; sy=(h-side)/2; sw=sh=side;
          w=h=Math.min(MAX[0],side);
        }
        const cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(w)); cv.height=Math.max(1,Math.round(h));
        cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
        resolve(cv.toDataURL('image/jpeg', kind==='cover'?0.72:kind==='thumb'||kind==='poster'?0.78:0.82));
      }catch(err){ reject(err); }
    };
    img.onerror=()=>reject(new Error('decode failed'));
    img.src=src;
  });
}
/* ── Bio photos ──
   Images live in the save file as data URLs rather than as files on disk:
   server.py only accepts .json and .md writes, and keeping the app a single
   portable document is worth more than a few KB. Everything is downscaled and
   re-encoded first — a phone photo is several MB and would bloat every
   autosave, so the original is never stored. */
function bioPickImage(kind){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ toast('That is not an image.'); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      bioShrink(rd.result,kind).then(url=>{
        const kb=Math.round(url.length*0.75/1024);
        if(kb>700){ toast('That image is too large even after shrinking.'); return; }
        bioProfile()[kind==='cover'?'cover':'photo']=url;
        save(); paintBio();
        if($('modals').innerHTML) bioProfileModal();
        toast((kind==='cover'?'Cover':'Photo')+' updated · '+kb+' KB');
      },()=>toast('Could not read that image.'));
    };
    rd.onerror=()=>toast('Could not read that file.');
    rd.readAsDataURL(f);
  };
  inp.click();
}

/* Initials stand in for a missing photo — same trick every profile app uses,

/* A stable hue per entry so the tiles vary without being random on every

const BIO_MEDIA=/\b(shows?|movies?|films?|tv|anime|manga|series|books?|reading|novels?|albums?|music|songs?|artists?|bands?|games?|podcasts?|watch(ed|ing|list)?|comics?)\b/i;
function bioView(c,autoOnly){
  if(!autoOnly&&c.view&&BIO_VIEWS[c.view]) return c.view;
  const n=String(c.name||'');

  if(c.kind==='role') return 'timeline';
  if(c.id==='skill'||/skill|language|tool|stack|tech|certif/i.test(n)) return 'chips';
  if(BIO_MEDIA.test(n)) return 'shelf';
  if(c.id==='hobby'||/hobb|interest|passion|fav/i.test(n)) return 'tiles';
  if(c.kind==='thing') return 'gallery';

}
function bioSide(c,autoOnly){

/* ── profile strength ── LinkedIn's meter, counting only LinkedIn things:
   nothing about friends or shows ever moves it. */
function bioStrength(){
  const p=bioProfile(), n=id=>bioIn(id).length, has=v=>!!String(v||'').trim();
  const sk=n('skill');
  const items=[          // [chip label, weight, done, action] — biggest gains first
    ['Your name',5,has(p.name),"bioProfileModal('bp-name')"],
    ['Headline',15,has(p.headline),"bioProfileModal('bp-head')"],
    ['Work experience',15,n('work')>0,"bioModal(null,'work')"],
    ['Profile photo',10,!!p.photo,"bioPickImage('photo')"],
    ['About',10,has(p.summary),"bioProfileModal('bp-sum')"],
    ['School',10,has(p.school)||has(p.major),"bioProfileModal('bp-school')"],
    ['A project',10,n('proj')>0,"bioModal(null,'proj')"],
    [sk?`${3-sk} more skill${3-sk===1?'':'s'}`:'3 skills',10,sk>=3,"bioModal(null,'skill')"],
    ['A club or activity',5,n('club')+n('extra')+n('sport')>0,"bioModal(null,'club')"],
    ['Location',5,has(p.location),"bioProfileModal('bp-loc')"],
    ['A link or email',5,has(p.links)||has(p.email),"bioProfileModal('bp-links')"]
  ];
  const score=items.reduce((s,x)=>s+(x[2]?x[1]:0),0);
  return {score, todo:items.filter(x=>!x[2]), done:items.filter(x=>x[2]).length, total:items.length,
    level:score>=100?'All-Star':score>=80?'Expert':score>=55?'Advanced':score>=30?'Intermediate':'Beginner'};
}

/* One section card. Each layout shows a preview and a LinkedIn-style
   "Show all" footer beyond it; searching or filtering always shows all. */
function bioSection(c,list,narrowed,st){
  const v=bioView(c), career=bioSide(c)==='career';
  const LIM={timeline:4,list:6,shelf:12,tiles:12,gallery:8,chips:40,people:12,orbit:80}[v]||8;
  let units=v==='timeline'?bioGroups(list):list;
  const over=!narrowed&&units.length>LIM, cut=over&&!bioOpen.has(c.id);
  if(cut) units=units.slice(0,LIM);
  const inner = v==='timeline' ? units.map(g=>g.items.length>1?bioXpGroup(g,c):bioXpRow(g.items[0],c)).join('')
    : v==='orbit'   ? bioOrbit(units,c)
    : v==='people'  ? bioPeople(units,c)
    : v==='shelf'   ? bioShelf(units,c)
    : v==='tiles'   ? bioTiles(units,c)
    : v==='chips'   ? bioChips(units,c)
    : v==='gallery' ? bioGallery(units,c)
    : units.map(e=>bioRow(e,c)).join('');
  return `<section class="card" id="bio-sec-${c.id}" style="${st}">
    <div class="bio-sh">
      <h3 class="bio-sh-t">${career?'':`<span aria-hidden="true">${c.icon}</span>`}${esc(c.name)}
        <span class="bio-sh-n">${list.length}</span></h3>
      <div class="row" style="gap:7px;flex:none">
        ${v==='orbit'||v==='people'?`<div class="seg-wrap bio-vt" role="group" aria-label="Layout">
          <button class="seg ${v==='orbit'?'on':''}" onclick="bioSetView('${c.id}','orbit')">Circle</button>
          <button class="seg ${v==='people'?'on':''}" onclick="bioSetView('${c.id}','people')">Cards</button></div>`:''}
        <button class="bio-plus" onclick="bioModal(null,'${c.id}')" title="Add to ${esc(c.name)}"
          aria-label="Add to ${esc(c.name)}">+</button>
      </div>
    </div>
    ${inner}
    ${over?`<button class="bio-more" onclick="bioToggleOpen('${c.id}')">${
      cut?`Show all ${list.length} →`:'Show less'}</button>`:''}
  </section>`;
}
function bioSetView(id,v){
  const c=bioCat(id); if(!c||bioView(c)===v) return;
  c.view=v; save(); paintBio();
}
function bioToggleOpen(id){
  const was=bioOpen.has(id);
  was?bioOpen.delete(id):bioOpen.add(id);
  paintBio();
  // collapsing can leave you scrolled past the section you were reading
  const el=$('bio-sec-'+id);
  if(was&&el&&el.getBoundingClientRect().top<0) el.scrollIntoView({block:'start'});
}
function bioToggleMore(id){ bioMore.has(id)?bioMore.delete(id):bioMore.add(id); paintBio(); }
function bioJump(id){
  if(bioCatFilter!=='all'||bioQuery.trim()){ bioCatFilter='all'; bioQuery=''; paintBio(); }
  const el=$('bio-sec-'+id); if(!el) return;
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({behavior:calm?'auto':'smooth',block:'start'});
  el.classList.remove('bio-flash'); void el.offsetWidth; el.classList.add('bio-flash');
}

/* ── career layouts ── */
/* Roles at the same organization collapse under one logo, the way LinkedIn
   shows two jobs at one company. Order follows the newest role in each. */
function bioGroups(list){
  const out=[], by=new Map();
  list.forEach(e=>{
    const k=String(e.org||'').trim().toLowerCase();
    if(k&&by.has(k)){ by.get(k).items.push(e); return; }
    const g={org:String(e.org||'').trim(),items:[e]};
    out.push(g); if(k) by.set(k,g);
  });
  return out;
}
function bioLogo(e,c,org){
  org=org||e.org;
  if(e.img) return `<div class="bio-logo"><img src="${e.img}" alt="" loading="lazy"></div>`;
  const h=bioHue((org||e.title)+c.id);
  return `<div class="bio-logo" style="background:hsl(${h} 45% 92%);color:hsl(${h} 40% 32%)${org?'':';font-size:21px'}">${
    org?esc(bioInitials(org)):c.icon}</div>`;
}
function bioJBtn(e){
  const k=(bioJ.get(e.id)||[]).length;
  return `<button class="xs ghost bio-jb" onclick="event.stopPropagation();bioJournalHub('${e.id}')"
    title="Journal about ${esc(e.title)}" aria-label="Journal about ${esc(e.title)}">📓${k?` ${k}`:''}</button>`;
}
/* Bullets, notes, tags and link, with "…see more" past three bullets or a
   few lines of notes, as LinkedIn trims a long description. */
function bioBody(e){
  const open=bioMore.has(e.id);
  const bl=(e.bullets||[]).filter(Boolean);
  const longB=bl.length>3, longN=!!e.notes&&(e.notes.length>220||e.notes.split('\n').length>3);
  return `${bl.length?`<ul class="bio-b">${(longB&&!open?bl.slice(0,3):bl).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}
    ${e.notes?`<div class="bio-n${longN&&!open?' clamp':''}">${esc(e.notes)}</div>`:''}
    ${longB||longN?`<button class="bio-seemore" onclick="event.stopPropagation();bioToggleMore('${e.id}')">${
      open?'Show less':'…see more'}</button>`:''}
    ${(e.tags||[]).length?`<div class="bio-tags">${e.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>`:''}
    ${e.link?bioLinkHtml(e.link):''}`;
}
function bioXpText(e,withOrg){
  const l2=[e.role,withOrg?e.org:''].filter(Boolean).map(esc).join(' · ');
  const r=bioRange(e), s=bioSpan(e);
  const l3=r?esc(r).replace(/Present$/,'<span class="now">Present</span>')+(s?' · '+s:''):'';
  return `<div class="bio-xt">${esc(e.title)}${e.sensitive
      ?` <span class="pill" title="Never leaves this app — kept out of application exports">◆ Private</span>`:''}</div>
    ${l2?`<div class="bio-xo">${l2}</div>`:''}
    ${l3?`<div class="bio-xd">${l3}</div>`:''}

}
function bioXpRow(e,c){
  return `<div class="bio-xp" onclick="bioModal('${e.id}')">
    ${bioLogo(e,c)}
    <div class="bio-xb">${bioXpText(e,true)}</div>

}
function bioXpGroup(g,c){
  const items=g.items, lead=items.find(e=>e.img)||items[0];
  // the whole stay: earliest start to latest end, when every date is readable
  const a=items.map(e=>bioYM(e.start,false)), b=items.map(e=>e.current?{n:bioNowYM()}:bioYM(e.end,true));
  const ok=[...a,...b].every(x=>x&&!x.y);
  const tot=ok?Math.max(...b.map(x=>x.n))-Math.min(...a.map(x=>x.n))+1:0;
  return `<div class="bio-xp grp">
    ${bioLogo(lead,c,g.org)}
    <div class="bio-xb">
      <div class="bio-xt">${esc(g.org)}</div>
      <div class="bio-xd">${items.length} roles${tot>0?' · '+bioDur(tot):''}</div>
      <div style="margin-top:4px">${items.map(e=>`<div class="bio-role" onclick="bioModal('${e.id}')">
        <div style="flex:1;min-width:0">${bioXpText(e,false)}</div>${bioJBtn(e)}</div>`).join('')}</div>
    </div>
  </div>`;
}

/* Empty sections of a half, offered as one row of chips rather than a stack

/* ── life layouts ── */
function bioFace(e,t){
  return `<span class="orb-face" style="--tc:${t.c};background:${t.bg};color:${t.tx}">${
    e.img?`<img src="${e.img}" alt="" loading="lazy">`:(esc(bioInitials(e.title))||'•')}</span>`;
}
/* Rings for the circle: one or more per closeness tier, inner tiers first.
   A tier that won't fit on one ring spills onto the next, shared out by
   circumference so no ring is left with a lonely straggler. Tries names
   under the faces first (big faces, then smaller), then faces only; null
   means even that won't fit and the caller shows cards instead. */
function bioOrbitPlan(tiers,W){
  if(!tiers.length) return null;
  const attempt=(labels,A,Y)=>{
    const gap=labels?A+26:A+10, sp=labels?Math.max(A+34,86):A+8;
    const cap=r=>Math.max(1,Math.floor(2*Math.PI*r/sp));
    let r=Y/2+A/2+(labels?26:14); const rings=[];
    tiers.forEach(({t,list})=>{
      let k=1; const sum=k=>{ let s=0; for(let j=0;j<k;j++) s+=cap(r+j*gap); return s; };
      while(sum(k)<list.length) k++;
      const caps=Array.from({length:k},(_,j)=>cap(r+j*gap)), tot=caps.reduce((x,y)=>x+y,0);
      const cnt=caps.map(cp=>Math.floor(list.length*cp/tot));
      let rest=list.length-cnt.reduce((x,y)=>x+y,0);
      for(let j=k-1;rest>0;j=(j+k-1)%k) if(cnt[j]<caps[j]){ cnt[j]++; rest--; }
      let at=0;
      cnt.forEach((m,j)=>{ if(m) rings.push({t,r:r+j*gap,list:list.slice(at,at+m)}); at+=m; });
      r+=k*gap;
    });
    const last=rings[rings.length-1].r;
    return {rings,A,Y,labels,S:2*(last+A/2+(labels?24:8))};
  };
  for(const pl of [attempt(true,46,70),attempt(true,40,62),attempt(false,46,70),attempt(false,38,58)]){
    const s=Math.min(1,W/pl.S);
    if(s>=(pl.labels?0.93:0.75)) return {labels:pl.labels,A:pl.A*s,Y:pl.Y*s,S:Math.floor(pl.S*s),
      rings:pl.rings.map(x=>({...x,r:x.r*s}))};
  }
  return null;
}
/* Your people, orbiting you. Closer relationships sit on inner rings; each
   ring drifts slowly (alternate rings the other way) and stops while the
   pointer is over the circle so nothing moves out from under a click. The
   drift's phase comes from the clock, so a repaint doesn't jump it back. */
function bioOrbit(list,c){
  const avoid=list.filter(e=>e.relation==='dislike');
  const tiers=BIO_TIERS.map(t=>({t,list:list.filter(e=>bioTier(e.relation)===t)})).filter(x=>x.list.length);
  const avoidRow=avoid.length?`<div class="orb-avoid"><span>${esc(relName('dislike'))}</span>${
    avoid.map(e=>`<button class="chip" onclick="bioPeek('${e.id}')">${esc(e.title)}</button>`).join('')}</div>`:'';
  if(!tiers.length) return avoidRow;
  const plan=bioOrbitPlan(tiers,Math.min(640,bioW-46));
  if(!plan) return bioPeople(list,c,'Not enough room for the circle on a screen this size, so here they are as cards.');
  const {rings,A,Y,S,labels}=plan, p=bioProfile(), now=Date.now()/1000;
  let k=0;
  const ringHtml=rings.map((r,j)=>{
    const d=150+j*45, off=-90+j*47;
    const items=r.list.map((e,i)=>{
      const a=(off+i*360/r.list.length)*Math.PI/180;
      const rel=relName(e.relation)||'Person';
      return `<button class="orb-p" style="left:${(S/2+r.r*Math.cos(a)).toFixed(1)}px;top:${(S/2+r.r*Math.sin(a)).toFixed(1)}px;--pd:${120+45*k++}ms"
        onclick="bioPeek('${e.id}')" title="${esc(e.title)} · ${esc(rel)}" aria-label="${esc(e.title)}, ${esc(rel)}">
        <span class="orb-cr">${bioFace(e,r.t)}${labels?`<span class="orb-lbl">${esc(bioFirstName(e.title))}</span>`:''}</span>
      </button>`;
    }).join('');
    return `<div class="orb-track" style="width:${(2*r.r).toFixed(1)}px;height:${(2*r.r).toFixed(1)}px;--tc:${r.t.c}"></div>
      <div class="orb-ring${j%2?' rev':''}" style="--d:${d}s;--ph:${(-(now%d)).toFixed(2)}s">${items}</div>`;
  }).join('');
  return `<div class="orb${bioAnim?' fresh':''}" style="width:${S}px;height:${S}px;--a:${A.toFixed(1)}px;--y:${Y.toFixed(1)}px">
      ${ringHtml}
      <div class="orb-you" title="You"><span class="orb-face" style="--tc:var(--accent)">${
        p.photo?`<img src="${p.photo}" alt="">`:(esc(bioInitials(p.name))||'You')}</span>${
        labels?'<span class="orb-lbl">You</span>':''}</div>
    </div>
    ${labels?`<div class="orb-legend">${tiers.map(({t,list})=>
      `<span><i style="background:${t.c}"></i>${t.name} · ${list.length}</span>`).join('')}</div>`
      :bioOrbitKey(tiers,c)}
    ${avoidRow}`;
}
/* When the faces are too small to carry names, the names go underneath,
   one line per ring colour — still one tap from each person's card. */
function bioOrbitKey(tiers,c){
  const MAX=10;
  return `<div class="orb-key">${tiers.map(({t,list})=>`<div>
    <span class="orb-key-t"><i style="background:${t.c}"></i>${t.name}</span>
    <span class="orb-key-n">${list.slice(0,MAX).map(e=>
      `<button class="orb-nm" onclick="bioPeek('${e.id}')">${esc(e.title)}</button>`).join('')}${
      list.length>MAX?`<button class="orb-nm more" onclick="bioSetView('${c.id}','people')">+${list.length-MAX} more</button>`:''}</span>
  </div>`).join('')}</div>`;
}
function bioPeople(list,c,note){

/* Posters. A picture fills the frame; without one the poster is painted from

/* ── the quick card ── what a tile, poster or face opens: everything about
   the entry, plus what you've written about it in the Journal. Rows already
   show all of that, so they still open straight into the editor. */
function bioPeekArt(e,c){
  const h=bioHue(e.title+c.id);

/* Today's plan: assignments due today, PLUS today's Journey habit occurrences
   — the latter need no separate query, since generateHabitBacklog() already
   writes them into db.assignments as ordinary rows (habitId set, due=today)
   the moment a habit's occurrence comes due. One due-today filter covers
   both sources; asgRow() already renders the "↻ Habit" pill and Skip button
   for the ones that came from a Journey. journeyTick() runs first so a habit
   whose occurrence hasn't been generated yet doesn't just silently not
   appear — same as what the Assignments tab does when its tab opens. */
/* ── today's plan ──
   Two sources, one list:
     · automatic — anything due today, which already includes Journey habit
       occurrences (a habit occurrence IS an assignment with due = today)
     · picked    — tasks you pulled in by hand from the full task list
   Picking never edits the task itself, so a thing pulled into today keeps its
   real due date, its urgency score and its overdue status. */
const picksFor=dk=>{ db.dailyPicks=db.dailyPicks||{}; return db.dailyPicks[dk]||[]; };
const isPicked=(id,dk)=>picksFor(dk||today()).includes(id);
function addToToday(id){
  const t=today(); db.dailyPicks=db.dailyPicks||{};
  const l=db.dailyPicks[t]||(db.dailyPicks[t]=[]);
  if(!l.includes(id)) l.push(id);
  save(); repaint();
}
function removeFromToday(id){
  const t=today(); db.dailyPicks=db.dailyPicks||{};
  db.dailyPicks[t]=(db.dailyPicks[t]||[]).filter(x=>x!==id);
  if(!db.dailyPicks[t].length) delete db.dailyPicks[t];
  save(); repaint();
}
/* Keep the map from growing forever — a day's plan stops being interesting
   pretty quickly, and this file is rewritten on every save. */
function prunePicks(){
  db.dailyPicks=db.dailyPicks||{};
  const cut=addDays(today(),-30);
  let n=0;
  Object.keys(db.dailyPicks).forEach(k=>{ if(k<cut){ delete db.dailyPicks[k]; n++; } });
  return n;
}
function todaysItems(){
  journeyTick();
  const t=today();
  const auto=db.assignments.filter(a=>a.due===t&&!inArchivedCls(a)&&journeyAssignmentIsActive(a));
  const seen=new Set(auto.map(a=>a.id));
  const picked=picksFor(t)
    .filter(id=>!seen.has(id))          // due today AND picked = show once
    .map(asg).filter(a=>a&&!inArchivedCls(a)&&journeyAssignmentIsActive(a));
  return auto.concat(picked);
}
/* ── "add from tasks" picker ──
   Only the list re-renders as you type, never the whole modal, so the search
   box keeps focus and caret without any restore trickery. */
let _pickSel=new Set(), _pickQ='';
function addToTodayModal(){
  _pickSel=new Set(); _pickQ='';
  modal(`<h2>Add to today</h2>
    <p class="dim" style="font-size:12.5px;margin:5px 0 14px">

    </div>`,true);
  renderPickList();
  const q=$('atd-q'); if(q) q.focus();
}
function pickCandidates(){
  const t=today(), inToday=new Set(todaysItems().map(a=>a.id));
  const q=(_pickQ||'').trim().toLowerCase();
  return db.assignments
    .filter(a=>!a.done && !inArchivedCls(a) && journeyAssignmentIsActive(a) && !inToday.has(a.id))
    .filter(a=>!q || a.title.toLowerCase().includes(q)
                  || (a.notes||'').toLowerCase().includes(q)
                  || clsName(a.classId).toLowerCase().includes(q))
    .sort((x,y)=>(x.due||'9999').localeCompare(y.due||'9999')||(doScore(y)||0)-(doScore(x)||0));
}
function renderPickList(){
  const el=$('atd-list'); if(!el) return;

    const d=a.due?dDelta(a.due):null;

      <span style="flex:1">${impDots(a.imp)}${esc(a.title)}</span>
      <span class="faint" style="font-size:11.5px">${a.classId?esc(clsName(a.classId))+' · ':''}${
        a.due?(d<0?`<span class="due-over">${dRel(a.due)}</span>`:'due '+dShort(a.due)):'no date'}</span>
    </label>`;

function syncPickBtn(){
  const b=$('atd-go'); if(!b) return;

function commitPicks(){
  if(!_pickSel.size) return;
  const t=today(); db.dailyPicks=db.dailyPicks||{};

  _pickSel.forEach(id=>{ if(!l.includes(id)) l.push(id); });
  const n=_pickSel.size;

/* Quick-add from the Daily tab. Dated to today so it lands on the list you're
   looking at — otherwise it would vanish into Tasks with no due date and feel
   like it silently failed. */
function dailyQuickAdd(el){

/* Set while paintDaily() renders rows, so asgRow() can show the today-only
   "remove from today" control without it leaking onto the Tasks tab. Using a
   flag rather than an extra asgRow parameter on purpose: rows are rendered via
   .map(asgRow), which would pass the array index into any second argument. */
let _rowCtx=null;
/* ═══════════════ the pond ═══════════════
   The game layer over everything else. Each class adopts a species, and
   every task you finish releases a fish: 30% of the time its class's own,
   otherwise any species, weighted by rarity (Pond.rollSpecies). The roll is
   seeded by the task's id, so it's the same fish every time — the pond is
   worked out from your real tasks, sessions and journal on each paint rather
   than stored. Only two things are kept, in db.pond: which species each
   class adopted, and when each species was first seen (so a find sticks even
   if the task behind it is later unticked). */
const PondArt=window.Pond;
const POND_LEVELS=['Puddle','Spring','Brook','Still Water','Lily Pond','Koi Garden','Deep Pond','Moon Lake','Great Lake','Open Sea'];
/* Lv n needs 5·n·(n−1) finished tasks in all: 10, 30, 60, 100, 150… */
const pondLvAt=L=>5*L*(L-1);
/* the design paired these six classes with these six species */
const ADOPT_BY_NAME=[[/CHM\s*11510/i,'koi'],[/MA\s*16200/i,'goldfish'],[/ENGR\s*13100/i,'clown'],[/python/i,'guppy'],[/EPCS/i,'betta'],[/CS\s*15900/i,'puffer']];
const ADOPT_ORDER=['koi','goldfish','clown','guppy','betta','puffer',
  ...PondArt.SPEC.filter(s=>s.rar==='Common'&&!s.base&&!s.milestone&&s.k!=='catfish').map(s=>s.k)];
const MOOD_INK={great:'#5fae7f',good:'#a4c46a',okay:'#e8b64a',rough:'#ec7a45',bad:'#d9695f'};
/* "Fall 2026 CHM 11510" → "CHM 11510": the term is noise on a small label */
const clsShort=id=>clsName(id).replace(/^(fall|spring|summer|winter)\s+\d{4}\s+/i,'');
function pondMotionOn(){
  let reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  PondArt.PF.ripples=db.settings.pondRipples!==false;
  PondArt.PF.petals=db.settings.pondPetals!==false;
  PondArt.PF.light=db.settings.pondLight===true;     // opt-in: off keeps the ponds exactly as they've always looked
  return db.settings.pondMotion!==false&&!reduce;
}
function togglePondMotion(){
  db.settings.pondMotion=db.settings.pondMotion===false; save(); paintSettingsToggles();
  _tdScene=''; _tdFry='';           // redraw the water still (or moving) next time it's shown
}
/* every active class gets a species, once. Name matches first, so a class
   the design named never loses its fish to one that happened to sort first. */
function pondAdopt(){
  const ad=db.pond.adopt, taken=new Set(Object.values(ad)), act=activeClasses();
  let ch=false;
  const give=(c,k)=>{ ad[c.id]=k; taken.add(k); ch=true; };
  act.forEach(c=>{ if(ad[c.id]&&PondArt.SP[ad[c.id]]) return;
    const m=ADOPT_BY_NAME.find(([re,k])=>re.test(c.name)&&!taken.has(k)); if(m) give(c,m[1]); });
  act.forEach(c=>{ if(ad[c.id]&&PondArt.SP[ad[c.id]]) return;
    const k=ADOPT_ORDER.find(x=>!taken.has(x)); if(k) give(c,k); });
  return ch;
}
/* A finished task rolls from the catalog as it stood when it was done, so
   adding species never re-rolls a fish you already have. Each expansion is
   stamped the first time the pond is worked out after it arrives
   (pondState); a new one is a new row here plus its stamp there. */
const POND_EDITIONS=[[385,'catalog385At'],[380,'catalog380At'],[376,'catalog376At'],[375,'catalog375At'],[275,'catalog275At']];
const pondRoll=a=>PondArt.rollSpecies(a.id,db.pond.adopt[a.classId]||null,
  (POND_EDITIONS.find(([,k])=>a.doneAt>(db.pond[k]||Infinity))||[250])[0]);

/* The whole collection, worked out fresh — cached until the next save. */
let _pondCache=null, _pondKey='';
/* _pondLiveDb: the db the pond has already been worked out for once, so

  if(!db.pond.catalog376At){ db.pond.catalog376At=Date.now(); reset=true; }
  if(!db.pond.catalog380At){ db.pond.catalog380At=Date.now(); reset=true; }
  if(!db.pond.catalog385At){ db.pond.catalog385At=Date.now(); reset=true; }

    db.pond.collectionStartedAt=Date.now();
    db.pond.previousSeen={...db.pond.seen};
    db.pond.seen={};
    reset=true;

  const since=db.pond.collectionStartedAt;
  const key=(db.savedAt||0)+'|'+since+'|'+today()+'|'+db.settings.goal+'|'+db.assignments.length;
  if(_pondCache&&key===_pondKey) return _pondCache;

  const t=today(), goalMs=(+db.settings.goal||0)*MIN;
  const done=db.assignments.filter(a=>a.done&&!a.ann&&a.doneAt>since);
  /* habits */
  const netBy={};
  db.sessions.filter(s=>s.started>since).forEach(s=>{ const k=dayKey(s.started); netBy[k]=(netBy[k]||0)+summarize(s).net; });
  const focusDays=Object.keys(netBy).filter(k=>netBy[k]>0);
  const focusMs=Object.values(netBy).reduce((x,y)=>x+Math.max(0,y),0);
  const jdays=[...new Set((db.diary||[]).filter(e=>e.created>since).map(e=>e.date).filter(Boolean))];
  const bloomDays=goalMs>0?Object.keys(netBy).filter(k=>netBy[k]>=goalMs).sort():[];
  let bloomRun=0, run=0;
  bloomDays.forEach((k,i)=>{ run=i&&daysBetween(bloomDays[i-1],k)===1?run+1:1; bloomRun=Math.max(bloomRun,run); });

     gets its moment (the unlock screen). The first look at a pond just
     loaded, synced in or reset only takes stock, so opening the app never
     sets off a parade of old finds. */

    const cur=sp.goal.m==='reeds'?(found[sp.k]?1:0):Math.floor(M[sp.goal.m]||0);
    return {cur:Math.min(cur,sp.goal.n),n:sp.goal.n,pct:Math.min(100,Math.round(cur/sp.goal.n*100))}; };
  let next=null;
  PondArt.SPEC.forEach(sp=>{ if(found[sp.k]||!sp.goal||sp.goal.m==='reeds') return; const p=prog(sp);
    if(!next||p.pct>next.p.pct||(p.pct===next.p.pct&&p.n<next.p.n)) next={sp,p}; });

    foundN:Object.keys(found).length, total:PondArt.SPEC.length,
    lv, lvName:POND_LEVELS[Math.min(lv,POND_LEVELS.length)-1], lvFrom:pondLvAt(lv), lvTo:pondLvAt(lv+1),
    today:done.filter(a=>a.doneAt&&dayKey(a.doneAt)===t)};

}

/* ═══════════════ the lotus path · a focus streak ═══════════════
   Each day the lotus reaches full bloom (net focus at or over the daily
   goal), a lily pad floats onto the water. Pads on days in a row make a
   path, and its length is the streak. Miss a day and the path breaks; the
   next bloom starts a new one. Today never breaks it: until midnight its
   spot is a bud, still waiting. The longer the path, the more of the pond
   comes to it (PATH_STAGES).
   db.pond.path.hit = {day: that day's goal in minutes}. A day is stamped the
   first time it's seen in bloom and stays stamped, so raising the goal later
   never takes back a path already walked. path.cheer = the last day whose
   moment (the card) was shown. */
const PATH_STAGES=[
  {n:1,  nx:'the first pad', t:'The first pad',     s:'The first pad is down. Tomorrow’s floats in beside it.'},
  {n:3,  nx:'a frog',        t:'A frog climbs on',  s:'Three pads in a row, close enough for a frog to hop across.'},
  {n:7,  nx:'a dragonfly',   t:'A dragonfly',       s:'A week of open pads. A dragonfly has started resting on the path.'},
  {n:14, nx:'lotus flowers', t:'Lotus flowers',     s:'Two weeks. Lotus flowers are opening along the path.'},
  {n:21, nx:'fireflies',     t:'Fireflies',         s:'Three weeks. Fireflies come out over the path at dusk.'},
  {n:30, nx:'the turtle',    t:'The turtle',        s:'A month across the water. A turtle has hauled out to bask on it.'},
  {n:50, nx:'the moon',      t:'Moon on the water', s:'Fifty days. The path is long enough to hold the moon.'},
  {n:100,nx:'the old pond',  t:'The old pond',      s:'A hundred days. An old pond, a frog jumps in, the sound of water.'}];
let _pathKey='', _pathCache=null, _pathLiveDb=null, _pathSig='', _pathHop='', _pathWait=null, _pathCardT=null;
function pathState(noSave){
  const goal=+db.settings.goal||0, t=today(), hit=db.pond.path.hit;
  const key=(db.savedAt||0)+'|'+t+'|'+goal+'|'+db.sessions.length;
  if(_pathCache&&_pathKey===key&&_pathCache.hit===hit) return _pathCache;
  const by={}; let changed=false;
  db.sessions.forEach(s=>{ const k=dayKey(s.started); by[k]=(by[k]||0)+summarize(s).net; });
  if(goal>0) Object.keys(by).forEach(k=>{ if(!hit[k]&&k<=t&&by[k]>=goal*MIN){ hit[k]=goal; changed=true; } });
  const met=!!hit[t], end=met?t:addDays(t,-1);
  let cur=0; for(let d=end;hit[d];d=addDays(d,-1)) cur++;
  const start=cur?addDays(end,1-cur):t;
  const days=Object.keys(hit).filter(k=>k<=t).sort();
  let best=0, run=0;
  days.forEach((k,i)=>{ run=i&&daysBetween(days[i-1],k)===1?run+1:1; best=Math.max(best,run); });
  /* the path before this one, for "your last one reached N days" */
  let prev=0; const pe=days.filter(k=>k<start).pop(); if(pe) for(let d=pe;hit[d];d=addDays(d,-1)) prev++;
  const todayMin=Math.round(Math.max(0,by[t]||0)/MIN);
  const st={goal,cur,best,prev,met,end,start,todayMin,left:Math.max(0,goal-todayMin),hit,
    next:PATH_STAGES.find(s=>s.n>cur)||null, mark:PATH_STAGES.find(s=>s.n===cur)||null};
  _pathCache=st; _pathKey=key;
  if(changed){ if(noSave) _pathKey=''; else save(); }
  return st;
}
/* runs with every screen change (paintPondCard). The first time today is

   The first look after a load or a sync only takes stock, so opening the
   app never replays a moment that already happened. */
function pathCheck(){
  const st=pathState(), t=today(), P=db.pond.path, live=_pathLiveDb===db;
  _pathLiveDb=db;

}

      <div class="bc-f"><span>${st.next?`Next: ${st.next.nx} at ${st.next.n} days`:'Every milestone reached'}</span>${cur==='daily'?'':'<button onclick="pathGo()">See the path</button>'}</div></div>

/* ═══════════════ Today ═══════════════ */
let _tdScene='', _tdFry='', _reedsAll=false, _reedsSig='';
const scoreInk=n=>n>=80?'#b0524a':n>=55?'#a8762f':n>=30?'#2f7a74':'#8f978f';
/* The water behind the greeting: drawn once per size. It starts every day
   empty, with no fish at all; the only fish in it are the ones today's
   finished tasks released (paintTodayFry), so the pond fills as you go. */
function paintTodayScene(st,force){
  const hero=$('td-hero'), el=$('td-scene'); if(!hero||!el) return;
  const W=Math.round(hero.clientWidth)||1100, H=hero.clientHeight||340;
  PondArt.PF.motion=pondMotionOn();
  const moods=(db.diary||[]).filter(e=>e.tagId==='daily'&&e.mood).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).map(e=>e.mood);
  const sig=[W,H,PondArt.PF.motion,moods.join()].join('|');
  if(!force&&sig===_tdScene) return;
  _tdScene=sig; _tdFry='';
  const P=PondArt, f=Math.min(1.25,W/1104), X=x=>+(W-(1104-x)*f).toFixed(1);
  P.reseed(11);
  const k=[];
  k.push(P.caustics(W,H,.22));
  [[640,120,120,0],[930,240,90,2],[780,290,140,4]].forEach(r=>k.push(P.ripple(X(r[0]),r[1],r[2],r[3])));
  /* lily pads carry the last few Daily moods */
  k.push(P.pad(X(1040),40,58,30,'#5f9470',moods[0]||null));
  k.push(P.pad(X(990),122,30,200,'#6f9e7a',null));
  k.push(P.pad(X(470),H-10,54,120,'#5a8d69',moods[1]||null));
  k.push(P.pad(X(1080),H-20,44,280,'#6f9e7a',moods[2]||null));
  k.push(P.petals(H,4));
  k.push(P.glints(W,H,14));
  P.morph(el,k.join(''));                         // in place: a zoom keeps every fish, only the paths move
}
/* One fish per task finished today, in its species' colours, added and
   removed without disturbing the ones already swimming. A fish that
   arrives while you're looking lands with a splash. */
function paintTodayFry(st){
  const el=$('td-fry'), hero=$('td-hero'); if(!el||!hero) return;
  const W=Math.round(hero.clientWidth)||1100, f=Math.min(1.25,W/1104), X=x=>+(W-(1104-x)*f).toFixed(1);
  const list=st.today.slice(0,18).map(a=>({id:a.id,k:st.rel.get(a.id)}));
  const sig=list.map(x=>x.id+x.k).join()+'|'+W;
  if(sig===_tdFry) return;
  /* a new width (resize, zoom) redraws every fish: their paths are in
     pixels, and the old ones could leave a narrower pond for good */
  const sameW=_tdFry.endsWith('|'+W), first=!_tdFry;
  const had=new Set([...el.children].map(c=>c.dataset.id));
  const keep=new Set(list.map(x=>x.id));
  [...el.children].forEach(c=>{ if(!keep.has(c.dataset.id)) c.remove(); });
  PondArt.PF.motion=pondMotionOn();
  list.forEach((x,i)=>{ if(had.has(x.id)&&sameW) return;
    const P=PondArt, sp=P.SP[x.k];
    P.reseed(1+[...x.id].reduce((a,c)=>a+c.charCodeAt(0),0)%9000);
    const rx=(130+P.rnd()*170)*f, ry=58+P.rnd()*62, cx=X(690+P.rnd()*190), cy=158+P.rnd()*30;
    const html=P.swimmer(P.loop(cx,cy,rx,ry,6,.5),(x.k==='puffer'?42:24+P.rnd()*18).toFixed(1),i%2===1,
      P.fish(x.k,+(sp.s*.9).toFixed(2),(.6+P.rnd()*.45).toFixed(2)));
    const old=el.querySelector(`[data-id="${x.id}"]`);
    if(old){ P.morph(old,html); return; }         // the same fish on a new path: it keeps its layers
    const d=document.createElement('div'); d.dataset.id=x.id;
    d.style.cssText='position:absolute;inset:0;z-index:2;animation:pf-in 1.2s ease;pointer-events:none';
    d.innerHTML=html;
    el.appendChild(d);
    if(!first&&sameW&&cur==='daily') pondRings(cx,cy);   // just released: a splash where it swims
  });
  _tdFry=sig;
}
function pondRings(x,y){
  const box=$('td-taps'); if(!box) return;
  [[160,0,1.6],[90,.15,1.2]].forEach(([sz,dl,du])=>{
    const d=document.createElement('div'); d.className='tap-ring';
    d.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;animation-duration:${du}s;animation-delay:${dl}s;opacity:${dl?0:1}`;
    box.appendChild(d); setTimeout(()=>d.remove(),1900);
  });
}
function pondTap(e){
  const hero=$('td-hero'); if(!hero) return;
  const r=hero.getBoundingClientRect();
  pondRings(e.clientX-r.left,e.clientY-r.top);
}
/* After a resize or zoom, fit the ponds to their new width. Each is redrawn
   in place (PondArt.morph), so every fish keeps its layers and only the
   swim paths change. Nothing is redrawn under the Hello page, which covers
   the whole app: that happens once, when it closes. */
function pondsReflow(){
  if(helloOpen()) return;
  if(cur==='daily'){ const st=pondState(); paintTodayScene(st); paintTodayFry(st); }
  const rh=$('run-hero');
  if(cur==='run'&&A&&rh&&Math.abs(rh.clientWidth-+(_runSig.split('|')[0]))>40){
    const W=Math.round(rh.clientWidth); PondArt.morph($('run-water'),runWater(W)); _runSig=W+'|'+A.id;
  }
}
let _tdResize=null;
window.addEventListener('resize',()=>{ clearTimeout(_tdResize); _tdResize=setTimeout(pondsReflow,200); });

/* ═══════════════ Hello ═══════════════
   The page you land on each time the app opens, and again when you come
   back to it on a new day: a greeting, today's catch, and one question.
   Built from the same numbers the Today screen uses, and it never saves.
   Tapping the title card in the sidebar brings it back; Settings can turn
   the automatic one off. */
let _helloDay='', _helloHiddenAt=0, _helloGo='daily', _helloT=null, _helloCovering=false, _helloResized=false, _helloScroll=0;
const helloOpen=()=>{ const v=$('v-hello'); return !!v&&!v.classList.contains('hide')&&!v.classList.contains('out'); };

/* the water behind it: only the fish you caught today swim here, so a new
   day opens on an empty pond */
function helloScene(st){
  const el=$('hl-scene'); if(!el) return;
  const P=PondArt, W=innerWidth, H=innerHeight, cx=W/2, cy=H*.46, s=Math.min(1.2,Math.max(.6,W/1200));
  P.PF.motion=pondMotionOn(); P.reseed(31);
  const caught=[...new Set(st.today.map(a=>st.rel.get(a.id)).filter(Boolean))];
  const k=[P.caustics(W,H,.2),P.ripple(W*.16,H*.3,200*s,0,8),P.ripple(W*.85,H*.72,240*s,3,8),P.ripple(W*.72,H*.16,150*s,5.5,8)];
  caught.slice(0,10).forEach((sk,i)=>{ const sp=P.SP[sk]; if(!sp) return;
    const rx=W*(.22+P.rnd()*.2), ry=H*(.16+P.rnd()*.18);
    k.push(P.swimmer(P.loop(cx+(P.rnd()-.5)*W*.2,cy+(P.rnd()-.5)*H*.2,rx,ry,6,.5),(30+P.rnd()*22).toFixed(1),i%2===1,P.fish(sk,sp.s*1.05*s,(.6+P.rnd()*.4).toFixed(2)))); });
  const moods=(db.diary||[]).filter(e=>e.tagId==='daily'&&e.mood).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).map(e=>e.mood);
  k.push(P.pad(W-50*s,58*s,64*s,30,'#5f9470',moods[0]||null),P.pad(W-130*s,150*s,30*s,200,'#6f9e7a',null),
    P.pad(46*s,H-54*s,58*s,120,'#5a8d69',moods[1]||null),P.pad(150*s,H-24*s,34*s,280,'#6f9e7a',null),P.pad(38*s,70*s,30*s,60,'#6f9e7a',moods[2]||null));
  k.push(P.petals(H,5),P.glints(W,H,18));
  P.morph(el,k.join(''));
}

  const focusM=Math.round(todayNetFocusMs()/MIN), goal=+db.settings.goal||0, ps=pathState();

  let next='';
  if(top&&!A){ const sc=doScore(top), meta=[top.classId?esc(clsShort(top.classId)):'',top.est?'est '+durP(top.est*MIN):'',top.due?esc(dRel(top.due).toLowerCase()):''].filter(Boolean).join(' · ');
    next=`<div class="hl-next"><div style="min-width:0"><div class="k">${open.includes(top)?'First up':'From the reeds'}</div><div class="t">${esc(top.title)}</div>${meta?`<div class="m">${meta}</div>`:''}</div>
      ${sc!=null?`<span class="d" title="Do-score" style="color:${scoreInk(sc)};background:${scoreInk(sc)}1a">${sc}</span>`:''}</div>`; }
  const ex=(db.exams||[]).filter(e=>!e.done&&e.examDate&&e.examDate>=t&&!inArchivedCls(e)).sort((a,b)=>a.examDate.localeCompare(b.examDate))[0];
  if(ex&&dDelta(ex.examDate)<=7) next+=`<div class="hl-next" style="background:#f7ecd9"><div style="min-width:0"><div class="k">Coming up</div><div class="t">${esc(ex.title)}</div>
    <div class="m">${ex.classId?esc(clsShort(ex.classId))+' · ':''}${esc(dRel(ex.examDate).toLowerCase())}</div></div></div>`;
  /* the question, and where each answer goes */

  PondArt.PF.motion=pondMotionOn();

    <div class="hl-ey"${d(1)}>${p.weekday} · ${p.month} ${+p.day}</div>

function helloGo(t){

/* back after a while on a new day: say hello again */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ _helloHiddenAt=Date.now(); return; }
  if(db.onboarded&&_helloDay&&_helloDay!==today()&&Date.now()-_helloHiddenAt>20*MIN&&!helloOpen()) helloShow();

/* A resize or zoom while the Hello page is up would make the browser
   re-lay-out the whole hidden app at every step. So the first one takes the
   app out of layout altogether (display:none) until Hello closes, when it's
   laid out once, at its final size, and the scroll is put back. Hidden that
   way its fish simply start swimming again on return; no one saw them. */

  if(!helloOpen()) return;
  _helloResized=true;
  if(_helloCovering) return;
  _helloScroll=window.scrollY; _helloCovering=true; $('shell').style.display='none';

let _hlResize=null;
window.addEventListener('resize',()=>{ helloCover(); clearTimeout(_hlResize); _hlResize=setTimeout(()=>{ if(helloOpen()) helloScene(pondState()); },200); });

/* ═══════════════ New species ═══════════════
   Every species you find for the first time gets its own moment: a shadow
   surfaces, rings spread, the water flashes, and the fish is there in
   colour with its number, rarity, field-guide entry (pond-lore.js) and what
   brought it in. pondState() queues a find the moment it first records it,
   so anything that finds one plays it: a finished task, an hour of focus,
   a day of journaling. Several at once come one after another. It never
   saves. Tapping a found fish in the Collection opens its card again. */
const UL_TONE={Common:{glow:'#7fc79a55',ray:'#bfe8cf2b',hi:'#bfe8cf'},Uncommon:{glow:'#5fc2b066',ray:'#aef0e42e',hi:'#aef0e4'},
  Rare:{glow:'#a58bd680',ray:'#d9c8ff33',hi:'#d9c8ff'},Legendary:{glow:'#f0c06088',ray:'#ffe7a640',hi:'#ffe19a'}};
const UL_SPARKS={Common:5,Uncommon:7,Rare:10,Legendary:14};
const UL_STAR='<svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10Z" fill="currentColor"/></svg>';
const unlockOpen=()=>{ const v=$('v-unlock'); return !!v&&!v.classList.contains('hide'); };
const unlockPending=k=>_ulQ.some(x=>x.k===k)||!!(_ulCur&&_ulCur.k===k);
function unlockQueue(k,how,task){
  if(!PondArt.SP[k]||unlockPending(k)) return;
  _ulQ.push({k,how,title:(task&&task.title)||''});
  if(!_ulCur){ clearTimeout(_ulT); _ulT=setTimeout(unlockNext,380); return; }   // let the tick land first
  /* one's already up: its buttons now count this one too */
  const box=document.querySelector('#v-unlock .ul-b'), v=$('v-unlock');
  if(box&&!v.classList.contains('out')){ const had=document.activeElement&&document.activeElement.id==='ul-go';
    box.innerHTML=unlockBtns(); if(had) unlockFocus(); }
}
function unlockNext(){
  const it=_ulQ.shift();
  if(it) unlockShow(it,false); else unlockHide();
}
/* the Collection: read a found species' card again */
function unlockView(k){
  const f=pondState().found[k]; if(!f||unlockOpen()) return;
  unlockShow({k,how:f.how,title:''},true);
}
function unlockShow(it,again){
  const v=$('v-unlock'); if(!v) return;
  clearTimeout(_ulT); clearTimeout(_ulFocusT);
  _ulCur=it; _ulAt=Date.now();
  const P=PondArt, sp=P.SP[it.k], R=P.RAR[sp.rar]||P.RAR.Common, tone=UL_TONE[sp.rar]||UL_TONE.Common;
  const st=pondState(), mv=pondMotionOn(), intro=mv&&!again;
  P.PF.motion=mv;
  const s=+Math.min(5.2,Math.max(2.8,(Math.min(innerWidth,560)-40)/76)).toFixed(2);
  const lore=(window.PondLore&&PondLore[it.k])||`A ${sp.rar.toLowerCase()} find, and now part of your pond.`;
  const how=again?speciesLine(sp,st)
    :it.how==='task'?(it.title?`Released when you finished <b>${esc(it.title)}</b>`:'Released by a finished task')
    :it.how==='goal'&&sp.goal?`Found once you ${esc(lowerFirst(sp.goal.t))}`:'Swimming in your pond';
  const n=st.foundN, tot=st.total, from=again?n:Math.max(0,n-1);
  const r=P.hs(it.k+'·unlock');
  const bub=Array.from({length:16},()=>{ const w=(4+r()*9).toFixed(1);
    return `<i style="left:${(r()*100).toFixed(1)}%;width:${w}px;height:${w}px;--t:${(7+r()*6).toFixed(1)}s;--d:${(-r()*12).toFixed(1)}s;--x:${((r()-.5)*90).toFixed(0)}px"></i>`; }).join('');
  const sparks=Array.from({length:UL_SPARKS[sp.rar]||5},()=>{ const a=r()*Math.PI*2, rx=110+r()*80, ry=62+r()*40;

/* ── the reeds ──
   Each overdue task is a clump of reeds, drawn from its id so it always
   keeps the same shape: leaves leaning both ways, a cattail, a patch of
   water, and the shadow of a fish caught in among them. Hover and the
   leaves part, the water rings and the fish edges out, since finishing the
   task is what sets it free. The longer a task has waited, the thicker the
   clump: another leaf at 3, 7, 14 and 30 days, and a second cattail at 7.
   Sway phases come from the clock, so a repaint never makes them jump. */
function reedClump(id,late,moving){
  const r=PondArt.hs(id+'·reeds'), cx=25;
  const n=5+(late>=3)+(late>=7)+(late>=14)+(late>=30), cats=late>=7?2:1;
  const parts=[];
  for(let i=0;i<n;i++){
    const x=rf1(6+(i+.5)/n*38+(r()-.5)*4), off=x-cx, side=off<0?-1:1;
    const h=Math.round(15+r()*16+(Math.abs(off)<9?5:0)), ink=REED_INK[Math.floor(r()*REED_INK.length)];
    const leaf=reedLeaf(h,3.4+r()*1.8,2+r()*4,side,ink,r()<.7?'#e2efd9':null); leaf.h=h;
    parts.push({x,h,p:leaf,lean:rf1(off*1.15+(r()-.5)*8),part:rf1(side*(9+r()*9))});
  }
  for(let i=0;i<cats;i++){
    const h=Math.round(31+r()*8), c=reedCattail(h); c.h=h;
    parts.push({x:rf1(cx+(i?8:-4)+(r()-.5)*4),h,p:c,lean:rf1((i?5:-4)+(r()-.5)*5),part:i?7:-6,cat:true});
  }
  /* tall ones behind; the fish slips in between the back leaves and the front */
  parts.sort((a,b)=>b.h-a.h);
  const back=parts.filter(q=>q.cat||q.h>=23), front=parts.filter(q=>!q.cat&&q.h<23);
  const html=q=>reedPart(q.x,q.p,q.lean,q.part,rf1(1.4+r()*2.2),rf1(2.8+r()*1.8),r);
  return `<span class="rd-ic${moving?' sw':''}" aria-hidden="true"><s class="rw"></s><s class="rr"></s>${back.map(html).join('')}
    <i class="rf">${PondArt.shadowFish('koi',.36,'#1f4d4a')}</i>${front.map(html).join('')}
    <i class="rb" style="left:16px;--d:.1s"></i><i class="rb" style="left:29px;--d:.45s"></i></span>`;
}
/* ── catching the bug of the day ──
   Tap it and it goes in db.pond.bugs as {first,last,days,visits}. Catching the
   same bug on a later visit only counts the day; twice in a day is a no-op. */
function reedBugCatch(ev,k){
  ev.stopPropagation(); ev.preventDefault();
  const t=today(), bug=bugByKey(k); if(!bug) return;
  const B=db.pond.bugs, had=B[k];
  let kind='again';
  if(!had){ B[k]={first:t,last:t,days:1,visits:[t]}; kind='new'; }
  else if(had.last!==t){
    had.visits=[...new Set([had.first,had.last,...(had.visits||[]),t].filter(Boolean))].sort();
    had.last=t; had.days=(had.days||1)+1; kind='visit';
  }
  if(kind!=='again') save();
  bugBurst(ev.clientX,ev.clientY);
  bugCardShow(k,kind);
  _reedsSig=''; if(cur==='daily') paintDaily();
}
function bugBurst(x,y){

  b.innerHTML='<i></i><i class="two"></i>'+[...Array(8)].map((_,i)=>`<s style="--a:${i*45}deg"></s>`).join('');

}

    </div>

function paintDaily(){
  const st=pondState();
  const hr=etHour(Date.now());
  const greet=hr<12?'Good morning.':hr<17?'Good afternoon.':'Good evening.';
  const p=dParts(Date.now());
  const items=todaysItems();
  // announcements ride along in the list but can't be completed, so they must
  // not sit in the denominator — otherwise "all released" becomes unreachable
  const scored=items.filter(countable);
  const done=scored.filter(a=>a.done).length, total=scored.length, left=total-done;
  const line=!total?'Nothing due today. Add a task below and it swims into the pond when it’s done.'
    :left===0?'Everything you finished today is swimming. The pond is full.'
    :done===0?`${total} task${total===1?'':'s'} on today’s list${st.today.length?'':', and the pond is still empty'}. Each one you finish releases a fish.`
    :`${done} swimming, ${left} to go. Some tasks turn up species you haven’t found yet.`;
  $('td-copy').innerHTML=`<div class="ey">${p.weekday} · ${p.month} ${+p.day}</div>
    <div class="gr">${greet}</div><div class="ln">${line}</div>`;
  $('td-pips').innerHTML=total?`<div class="pp">${scored.slice(0,24).map(a=>{ const sp=a.done?PondArt.SP[st.rel.get(a.id)]:null;
      return `<i style="${sp?`background:${sp.c};border-color:${sp.c}`:''}"></i>`; }).join('')}</div>
    <span>${done} of ${total} released</span>`:'';
  paintTodayScene(st); paintTodayFry(st);

  /* the list: open first by do-score, finished ones sink to the bottom */
  $('dr-list').innerHTML=items.length
    ?[...items].sort((x,y)=>x.done!==y.done?(x.done?1:-1):(doScore(y)||0)-(doScore(x)||0)).map(a=>catchRow(a,st)).join('')
    :'<p class="td-empty">Nothing due today. Add a task below, or pull one in from Plan.</p>';

  /* Overdue sits "in the reeds": shown, never counted against the day.
     Folding a growing backlog into today would make the day unwinnable;
     hiding it would be worse, since this is the screen you live on. */
  const t=today();
  const reeds=db.assignments
    .filter(a=>!a.done&&!a.ann&&a.due&&a.due<t&&!inArchivedCls(a)&&journeyAssignmentIsActive(a))
    .sort((x,y)=>(x.due||'').localeCompare(y.due||''));

  /* redrawn only when what's shown changes, so the reeds keep swaying and
