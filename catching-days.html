<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catching Days">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Catching Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reed-bugs.css?v=2">
<link rel="stylesheet" href="projects.css?v=1">
<link rel="stylesheet" href="toads.css?v=2">
<link rel="stylesheet" href="toad-collection.css?v=2">
<link rel="stylesheet" href="daily-letter.css?v=1">
<link rel="stylesheet" href="task-finish.css?v=1">
<link rel="stylesheet" href="pond-events.css?v=8">
<style>
:root{
  /* Koi Pond: warm paper around dark water. */
  --bg:#f4efe6; --panel:#fbf8f2; --panel2:#f1ebdf;
  --line:#e4dccd; --line2:#ebe4d6; --track:#e0d8c8;
  --inputline:#d8cfbd; --dashline:#cfc6b4; --ckline:#b9ae98;

  --tx:#1f2e2c; --tile:#2d3a37; --btn2:#4d5752; --navin:#5f6b67;
  --label:#5f6b67; --dim:#6f7a75; --meta:#6f7a75; --faint:#8f978f;
  --eyebrow:#8f978f; --ghost:#a8a898;

  --focus:#2f7a74; --breakphase:#ef8f86; --onprimary:#2a1408;
  --activetx:#1f2e2c; --xptx:#2f7a74; --xpfill:#7fc79a;
  --seltile:#e7efe9; --goalbg:#e7efe9; --renamebg:#f1f7f3; --renameline:#9fc2bb;
  --over:#b0524a; --bad:#b0524a; --accent:#715c95; --gold:#d69a2e;
  --koi:#ec7a45; --koi2:#f08c5b; --deep:#0f3b41; --shallow:#2a7d78;
  --serif:'Young Serif',Georgia,serif;
  --r:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--tx);background:var(--bg);
  font:15px/1.55 'Outfit',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;font-synthesis-weight:none;
}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400;letter-spacing:0}
a{color:#c65f2e}
.lora{font-family:var(--serif);font-weight:400}

button{font:inherit;cursor:pointer;border-radius:10px;padding:9px 16px;
  background:var(--panel2);color:var(--tx);border:1px solid var(--line2);font-weight:600;
  transition:background .13s,border-color .13s,transform .08s,filter .13s}
button:hover{background:#ebe3d4;border-color:#d8cfbd}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.primary{background:var(--koi);color:var(--onprimary);border-color:transparent;font-weight:600;border-radius:999px;box-shadow:0 8px 20px #ec7a4530}
button.primary:hover{filter:none;background:var(--koi2)}
button.go{background:var(--focus);color:var(--onprimary);border-color:transparent;font-weight:700;border-radius:999px}
button.go:hover{filter:brightness(1.05)}
button.ghost{background:transparent;border-color:var(--inputline);color:var(--btn2);border-radius:999px}
button.sm{padding:6px 12px;font-size:13px;border-radius:8px}
button.xs{padding:3px 9px;font-size:12px;border-radius:7px}
button.danger{color:var(--bad);border-color:#eecccb;background:transparent}
button.danger:hover{background:#fbecec}

.iconbtn{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--btn2);padding:0}
.iconbtn:hover{background:var(--panel2);color:var(--tile)}

input,textarea,select{font:inherit;background:#fff;color:var(--tx);
  border:1px solid var(--inputline);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .13s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--focus);
  box-shadow:0 0 0 3px rgba(47,122,116,.14)}
input[type=color]{padding:2px;height:38px;cursor:pointer}
textarea{resize:vertical;min-height:110px;line-height:1.65}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label.ck{display:flex;gap:9px;align-items:center;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--focus);cursor:pointer;margin:0;border-radius:6px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:22px}
.row{display:flex;gap:10px;align-items:center}
.wrapf{flex-wrap:wrap}
.sp{justify-content:space-between}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.mono{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow);
  margin-bottom:9px;display:block;font-weight:700}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* segmented control (phase / progress-visual) */
.seg2{border-radius:999px;padding:7px 16px;font-weight:700;font-size:12.5px;color:var(--navin);cursor:default}
.seg2.on{background:#fff;color:var(--activetx)}
.seg-wrap{display:inline-flex;gap:8px;background:var(--panel2);border-radius:999px;padding:4px}
.seg{border:none;border-radius:999px;padding:8px 18px;font-weight:700;font-size:12.5px;background:transparent;color:var(--navin);cursor:pointer}
.seg.on{background:#fff;color:var(--activetx)}

/* toggle switch */
.switch{width:42px;height:24px;border-radius:999px;border:none;cursor:pointer;background:var(--line2);position:relative;padding:0;flex:none}
.switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--focus)}
.switch.on .knob{left:21px}

/* app shell / sidebar */
@keyframes rl-fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:rl-fadein .22s ease}
/* one pace for changing screens: the screen's fade, the phone's screen strip,
   and the sidebar's screen list opening and closing all use it */
:root{--tabfade:.45s}
#main>[id^="v-"].fade-in,#subnav.fade-in{animation-duration:var(--tabfade)}
/* One place to switch motion off. Anything animated above should be listed
   here — colour/opacity changes stay, movement goes. */
@media (prefers-reduced-motion:reduce){
  .pf-swim,.pf-part,svg [style*="pf-wag"],svg [style*="pf-fin-stroke"]{animation:none!important}
  .hl>*{animation:none}
  #v-hello,.wordmark .cd-mark{transition:none}
  .fade-in{animation:none}
  .modal{animation:none}
  .veil{animation:none}
  .toast,.toast.out{animation:none}
  .stk{transform:none;transition:none}
  .stk:hover{transform:none}
  .chip:active,.tile:active,.stars button:active,.stars button:hover,button:active{transform:none}
  *{scroll-behavior:auto!important}
}
/* mode-specific copy: `hide-hosted` shows everywhere except the hosted app,
   `only-hosted` shows nowhere else */
.only-hosted{display:none}
html[data-mode=hosted] .only-hosted{display:block}
html[data-mode=hosted] .hide-hosted{display:none}
#shell{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:#ece6d9;border-right:1px solid #e0d8c8;
  padding:30px 18px 22px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh;overflow-y:auto}
/* the title card: the mark, the name set in two lines, and a tagline */
.wordmark{padding:0 6px;display:flex;align-items:center;gap:13px;border:none;background:none;border-radius:16px;
  cursor:pointer;text-align:left;font:inherit;width:100%}
.wordmark:hover{background:none}
.wordmark:hover .cd-mark{transform:rotate(-8deg) scale(1.04)}
.wordmark .cd-mark{flex:none;transition:transform .5s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 6px 10px rgba(15,59,65,.22))}
.wordmark .a{font-family:var(--serif);font-weight:400;font-size:24px;line-height:.98;letter-spacing:-.035em;color:var(--tx)}
.wordmark .a i{font-style:normal;color:var(--koi)}
.wordmark .b{display:block;margin-top:7px;font:500 9.5px/1 'Outfit',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--eyebrow);white-space:nowrap}
.wordmark .wm-m{width:52px;height:52px;flex:none}
@media (max-width:900px){ .wordmark{gap:10px} .wordmark .wm-m,.wordmark .cd-mark{width:42px;height:42px} .wordmark .a{font-size:21px} .wordmark .b{font-size:8.5px;letter-spacing:.06em} }
.xpbar-track{height:5px;border-radius:999px;background:var(--track);overflow:hidden}
.xpbar-fill{height:100%;border-radius:999px;background:var(--xpfill);transition:width .3s}
/* five places, each may hold a few screens (see NAV in the script) */
.navlist{display:flex;flex-direction:column;gap:4px}
.navitem{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;border:none;
  cursor:pointer;text-align:left;font-weight:500;font-size:15px;line-height:1;background:transparent;color:var(--navin);
  transition:background .14s,color .14s;width:100%}
.navitem:hover{background:#e4dccd;color:var(--tx)}
.navitem.on{background:var(--panel);color:var(--tx);box-shadow:0 2px 8px rgba(31,46,44,.06)}
.navitem.on:hover{background:var(--panel)}
.navitem svg{flex:none;width:20px;height:20px}
.navitem .hint{margin-left:auto;font-size:12px;font-weight:500;color:var(--faint);white-space:nowrap}
.navitem .pip{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--koi)}
.navitem.on .hint{display:none}
.navitem:not(.on) .pip{display:none}
/* a hint comes back softly when you leave its place */
@keyframes nv-hint-in{from{opacity:0}}
.navitem:not(.on) .hint{animation:nv-hint-in var(--tabfade) ease}
/* the narrow sidebar (≤900px): Journal's hint is the longest, so it sits a touch tighter */
@media (min-width:761px) and (max-width:900px){ #grp-journal{gap:7px} #grp-journal .hint{font-size:10.5px} }
/* Plan's hint names three screens, too long to sit beside the label, so it goes
   under it, and folds away (rather than snapping) when Plan opens */
.navitem .nv-two{display:flex;flex-direction:column;min-width:0}
.navitem .nv-two .hint{display:grid;grid-template-rows:1fr;margin:5px 0 0;font-size:11.5px;line-height:1.2;white-space:normal;
  transition:grid-template-rows var(--tabfade) ease,margin-top var(--tabfade) ease,opacity var(--tabfade) ease}
.navitem .nv-two .hint>span{min-height:0;overflow:hidden;padding:0 2px 2px;margin:0 -2px -2px}   /* room for the text's soft edges */
.navitem.on .nv-two .hint{display:grid;grid-template-rows:0fr;margin-top:0;opacity:0}
/* a place's screens slide open under it, and the last place's slide shut,
   instead of popping in. Collapsed it stays in the list, so margin-top:-4px
   cancels the extra list gap and the inner top padding gives it back when open */
.navsubs{display:grid;grid-template-rows:0fr;margin-top:-4px;opacity:0;visibility:hidden;
  transition:grid-template-rows var(--tabfade) ease,opacity var(--tabfade) ease,visibility 0s linear var(--tabfade)}
.navsubs.open{grid-template-rows:1fr;opacity:1;visibility:visible;transition-delay:0s}
.navsubs-in{min-height:0;overflow:hidden}
.navsubs-in>div{display:flex;flex-direction:column;gap:2px;padding:6px 0 6px 47px}
@media (prefers-reduced-motion:reduce){
  .navsubs,.navsubs.open,.navitem .nv-two .hint{transition:none}
  .navitem:not(.on) .hint{animation:none}
}
.navsub{background:none;border:none;border-radius:8px;padding:7px 0;text-align:left;font:500 13.5px/1 'Outfit',sans-serif;color:var(--faint);cursor:pointer}
.navsub:hover{background:none;color:var(--tx)}
.navsub.on{color:var(--tx);font-weight:600}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.navset{display:flex;align-items:center;gap:13px;padding:10px 14px;border:none;background:none;border-radius:12px;
  color:var(--faint);font:500 14px/1 'Outfit',sans-serif;cursor:pointer;text-align:left}
.navset:hover{background:#e4dccd;color:var(--tx)}
.navset.on{color:var(--tx);background:var(--panel);padding:12px 14px;box-shadow:0 2px 8px rgba(31,46,44,.06)}
.navset:not(.on) .pip{display:none}
/* the pond's level, under the nav */
.pondcard{background:var(--deep);border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;color:#f4efe6;cursor:pointer;border:none;text-align:left;font-family:'Outfit',sans-serif}
.pondcard:hover{background:#124a51}
.pondcard .t{font:400 18px/1 var(--serif);color:#f7c7a6}
.pondcard .lv{font:500 12px/1 'Outfit',sans-serif;color:#9fc2bb}
.pondcard .bar{height:6px;border-radius:99px;background:#ffffff1f;overflow:hidden}
.pondcard .bar i{display:block;height:100%;background:linear-gradient(90deg,#7fc79a,#f0b35a);border-radius:99px;transition:width .5s}
.pondcard .s{font:400 12.5px/1.4 'Outfit',sans-serif;color:#b9d3cd}
#subnav{display:none}
.main{flex:1;padding:44px 48px;max-width:808px;margin:0 auto;width:100%;min-width:0}
/* the pond screens are laid out for the full width */
.main.wide{max-width:none;padding:40px 48px 44px}
.main.wide.tight{padding:36px 44px 44px}
@media (max-width:900px){ .main{padding:26px 18px} .main.wide{padding:22px 18px 30px} .sidebar{width:210px} }


/* onboarding */
#v-onboard{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
.ob-card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:28px;
  padding:48px 40px;text-align:center;box-shadow:0 20px 50px rgba(195,207,218,.5)}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px;cursor:pointer;
  padding:9px 3px;background:transparent;border:2px solid var(--line);position:relative;
  transition:background .14s,border-color .14s,transform .1s}
.tile:hover{border-color:var(--ckline)}
.tile:active{transform:scale(.97)}
.tile.on{background:var(--seltile);border-color:var(--focus)}
.tile.on:hover{border-color:var(--focus)}
.tile .nm{font-weight:700;font-size:11px;color:var(--tile)}

/* timer */
.stage{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.ringwrap{position:relative;width:260px;height:260px}
.ringwrap svg{transform:rotate(-90deg);display:block}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 46px;text-align:center}
.clock{font-family:var(--serif);font-size:52px;font-weight:600;letter-spacing:0;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s}
.phase{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700}
.sub{font-size:11.5px;line-height:1.35;color:var(--meta);max-width:150px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{font-size:12.5px;padding:6px 12px;border-radius:999px;background:transparent;
  border:1px solid var(--line2);color:var(--btn2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .13s,border-color .13s,color .13s,transform .1s}
.chip:hover{border-color:var(--focus);color:var(--tile)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--seltile);border-color:var(--focus);color:var(--activetx)}

/* toast */
@keyframes rl-toast-in{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rl-toast-out{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,8px)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#212a33;color:#fafcfe;
  border-radius:10px;padding:10px 18px;font-size:13.5px;z-index:99;box-shadow:0 10px 30px rgba(33,42,51,.35);
  max-width:calc(100vw - 32px);text-align:center;animation:rl-toast-in .2s cubic-bezier(.2,.8,.3,1)}
.toast.out{animation:rl-toast-out .22s ease forwards}

/* lists */
/* ── Bio ── a profile page in two halves. Career is dressed like LinkedIn
   (logo rows, roles at one place grouped under it, computed durations)
   because that is the shape an application wants. Life is not a resume, so
   each of its sections gets a layout that suits what it holds: an orbit for
   your people, a poster shelf, colour tiles, a gallery. */
.bio{display:flex;flex-direction:column;gap:14px}
.bio-cover{height:140px;border-radius:var(--r) var(--r) 0 0;background:
  radial-gradient(circle at 14% 28%,rgba(255,255,255,.6) 0 34px,transparent 35px),
  radial-gradient(circle at 86% 78%,rgba(255,255,255,.4) 0 66px,transparent 67px),
  radial-gradient(circle at 64% 12%,rgba(255,255,255,.3) 0 18px,transparent 19px),
  linear-gradient(118deg,#cfe2f5 0%,#ddd8f0 52%,#f3e1d6 100%);background-size:cover;
  background-position:center;position:relative}
.bio-cover .edge{position:absolute;inset:0;border-radius:var(--r) var(--r) 0 0;
  box-shadow:inset 0 -1px 0 var(--line)}
.bio-head{padding:0 22px 20px;margin-top:-50px;position:relative}
.bio-av{width:108px;height:108px;border-radius:50%;border:4px solid var(--panel);
  background:var(--panel2);object-fit:cover;display:block;font-size:37px;
  line-height:100px;text-align:center;color:var(--ghost);overflow:hidden}
.bio-av.ph{font-weight:600;letter-spacing:.02em}
.bio-name{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.bio-headline{font-size:14.5px;color:var(--tx);margin-top:3px;line-height:1.45}
.bio-meta{font-size:12.5px;color:var(--meta);margin-top:5px}
.bio-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12.5px}
.bio-links a{color:var(--accent);text-decoration:none}
.bio-links a:hover{text-decoration:underline}
/* what you're doing right now, the way LinkedIn lists your current company */
.bio-now{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:10px}
.bio-now span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--tile);min-width:0}
.bio-now i{width:22px;height:22px;border-radius:6px;flex:none;display:inline-flex;align-items:center;
  justify-content:center;font-style:normal;font-size:10px;font-weight:700;overflow:hidden}
.bio-now i img{width:100%;height:100%;object-fit:cover}
.bio-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,max-content));gap:8px;margin-top:16px}
button.bio-stat{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 14px 7px;
  border-radius:12px;min-width:86px;text-align:left;font-weight:600}
.bio-stat b{font-family:var(--serif);font-size:20px;line-height:1.15}
.bio-stat span{font-size:11px;color:var(--meta);white-space:nowrap}
button.bio-stat:hover{transform:translateY(-1px)}
/* profile strength — a LinkedIn thing, so it only ever counts LinkedIn things */
.bio-str{border-top:1px solid var(--line2);padding:14px 22px 16px;display:flex;gap:10px 18px;
  align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,rgba(234,243,252,.6),rgba(234,243,252,0))}
.bio-str .t{font-size:12.5px;font-weight:700;color:var(--tile)}
.bio-str .lv{color:var(--accent)}
.bio-str .bar{height:7px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:7px}
.bio-str .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9cc0e4,var(--accent))}
.bio-str.fresh .bar i{animation:bio-grow 1s cubic-bezier(.2,.8,.3,1) .15s backwards}
@keyframes bio-grow{from{width:0}}
/* the two halves */
.bio-side{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin:10px 4px -4px}
.bio-side h2{font-size:20px;display:flex;align-items:center;gap:9px}
.bio-side h2::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--sc)}
.bio-side span{font-size:12.5px;color:var(--meta)}
/* section cards */
.bio-sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.bio-sh-t{font-family:inherit;font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;
  align-items:center;gap:8px;margin:0;min-width:0}
.bio-sh-n{font-size:12px;font-weight:700;color:var(--faint)}
button.bio-plus{width:32px;height:32px;padding:0;border-radius:50%;flex:none;display:inline-flex;
  align-items:center;justify-content:center;font-size:18px;line-height:1;background:transparent;
  border:1px solid var(--line2);color:var(--btn2)}
button.bio-plus:hover{background:var(--panel2)}
button.bio-more{display:block;width:calc(100% + 44px);margin:12px -22px -22px;padding:13px 0;
  background:transparent;border:none;border-top:1px solid var(--line2);border-radius:0 0 var(--r) var(--r);
  color:var(--tile);font-size:13px;font-weight:700}
button.bio-more:hover{background:var(--panel2)}
.bio.fresh>*{animation:bio-up .42s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes bio-up{from{opacity:0;transform:translateY(12px)}}
/* after .fresh, so a jump right after arriving still gets its highlight */
.bio>.bio-flash{animation:bio-flash 1.3s ease}
@keyframes bio-flash{0%,40%{box-shadow:0 0 0 3px rgba(113,92,149,.35)}100%{box-shadow:0 0 0 3px rgba(113,92,149,0)}}
.bio-addrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:0 4px}
.bio-addrow>span{font-size:12px;font-weight:700;color:var(--eyebrow);margin-right:3px}
.bio-ghost{opacity:.55;pointer-events:none;border:1.5px dashed var(--dashline);border-radius:14px;
  padding:2px 14px;margin:14px 0}
/* The logo tile. Real logos would need uploads per entry; initials or the
   category glyph over a per-entry hue read the same at a glance. */
.bio-tile{width:46px;height:46px;border-radius:10px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:20px;
  border:1px solid var(--line2)}
.bio-row{display:flex;gap:13px;align-items:flex-start;padding:15px 4px;
  border-bottom:1px solid var(--line2);border-radius:8px;transition:background .12s;
  cursor:pointer}
.bio-row:hover{background:rgba(33,42,51,.025)}
.bio-row:last-child{border-bottom:none}
.bio-t{font-size:15px;font-weight:650;line-height:1.3;word-break:break-word}
.bio-o{font-size:13px;color:var(--tx);margin-top:2px}
.bio-d{font-size:12.5px;color:var(--meta);margin-top:2px}
.bio-b{margin:8px 0 0;padding-left:17px;font-size:13px;line-height:1.55}
.bio-b li{margin-bottom:3px}
.bio-n{font-size:13px;color:var(--dim);margin-top:7px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bio-n.clamp,.bio-sum.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bio-sum{font-size:13.5px;line-height:1.65;margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
button.bio-seemore{background:none;border:none;padding:0;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--meta)}
button.bio-seemore:hover{background:none;color:var(--accent)}
.bio-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
/* career rows */
.bio-xp{display:flex;gap:13px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line2);
  border-radius:8px;transition:background .12s;cursor:pointer}
.bio-xp:last-child{border-bottom:none}
.bio-xp:hover{background:rgba(33,42,51,.025)}
.bio-xb{flex:1;min-width:0}
.bio-logo{width:48px;height:48px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;letter-spacing:.02em;border:1px solid var(--line2);overflow:hidden}
.bio-logo img{width:100%;height:100%;object-fit:cover}
.bio-xt{font-size:15px;font-weight:700;line-height:1.3;word-break:break-word}
.bio-xo{font-size:13.5px;color:var(--tx);margin-top:1px}
.bio-xd{font-size:12.5px;color:var(--meta);margin-top:1px}
.bio-xd .now{color:var(--activetx);font-weight:700}
/* the journal button stays quiet until you're on its row */
button.bio-jb{flex:none;align-self:flex-start;border-color:transparent;opacity:.5;transition:opacity .12s,border-color .12s}
.bio-xp:hover>button.bio-jb,.bio-role:hover>button.bio-jb,button.bio-jb:focus-visible{opacity:1;border-color:var(--inputline)}
@media (hover:none){ button.bio-jb{opacity:.8} }
/* several roles at one place: one logo, a rail joining the roles */
.bio-xp.grp{cursor:default}
.bio-xp.grp:hover{background:none}
.bio-role{position:relative;padding:10px 6px 8px 22px;margin-left:-2px;border-radius:8px;cursor:pointer;display:flex;gap:8px}
.bio-role:hover{background:rgba(33,42,51,.025)}
.bio-role::before{content:'';position:absolute;left:4px;top:17px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--ckline);box-sizing:border-box}
.bio-role::after{content:'';position:absolute;left:8px;top:28px;bottom:-12px;width:1px;background:var(--line)}
.bio-role:last-child::after{display:none}
/* chips, for skills */
.bio-chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 2px}
button.bio-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--tx)}
button.bio-chip:hover{background:#fff;border-color:var(--accent);transform:translateY(-1px)}
.bio-chip>i{width:8px;height:8px;border-radius:50%;flex:none}
.bio-chip .n{font-size:11px;font-weight:700;color:var(--accent);background:#efeaf6;border-radius:999px;padding:1px 7px}
/* tiles, for hobbies */
.bio-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding-top:4px}
button.bio-tl{position:relative;height:90px;border-radius:15px;overflow:hidden;text-align:left;padding:11px 13px;
  display:flex;align-items:flex-end;background:hsl(var(--h) 72% 92%);border:1px solid hsl(var(--h) 45% 84%);
  color:hsl(var(--h) 45% 24%);font-weight:700;font-size:14.5px;line-height:1.25;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,background .18s}
button.bio-tl:hover{background:hsl(var(--h) 74% 89%);border-color:hsl(var(--h) 45% 78%);transform:translateY(-3px);
  box-shadow:0 10px 20px hsl(var(--h) 40% 60% / .28)}
.bio-tl .em{position:absolute;right:9px;top:5px;font-size:36px;line-height:1;transform:rotate(12deg);
  transition:transform .3s cubic-bezier(.2,.8,.3,1.4)}
button.bio-tl:hover .em{transform:rotate(-8deg) scale(1.18)}
button.bio-tl.img{color:#fff;background-size:cover;background-position:center;border-color:transparent}
button.bio-tl.img::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.6))}
.bio-tl .t{position:relative;word-break:break-word}
/* the shelf, for shows, films, books, games */
/* align-items:start — a button stretched to its row's height centres its
   content, so one-line titles would sit lower than two-line ones */
.bio-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:18px 14px;padding-top:6px;align-items:start}
button.bio-pst{display:block;background:none;border:none;padding:0;text-align:left;color:var(--tx);font-weight:600;border-radius:10px;min-width:0}
button.bio-pst:hover{background:none}
.bio-pst .cv{display:block;position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--panel2);
  box-shadow:0 4px 12px rgba(70,85,100,.2);transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s}
button.bio-pst:hover .cv{transform:translateY(-5px) rotate(-1.2deg);box-shadow:0 16px 28px rgba(70,85,100,.3)}
.bio-pst .cv img{width:100%;height:100%;object-fit:cover;display:block}
.bio-gen{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  background:linear-gradient(160deg,hsl(var(--h) 58% 62%),hsl(calc(var(--h) + 38) 52% 30%));color:#fff}
.bio-gen::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.24),rgba(255,255,255,0) 45%)}
.bio-gen b{position:absolute;right:-4px;top:-10px;font-family:var(--serif);font-size:96px;line-height:1;opacity:.17;font-weight:700}
.bio-gen span{position:relative;font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.22;
  text-shadow:0 1px 8px rgba(0,0,0,.25);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word}
.bio-pst .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12.5px;font-weight:700;margin-top:8px;line-height:1.3;word-break:break-word}
.bio-pst .sb{display:block;font-size:11.5px;color:var(--meta);margin-top:1px}
.bio-badge{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:rgba(255,255,255,.92);color:var(--tile);line-height:1.4}
.bio-badge.r{left:auto;right:6px}
/* gallery, for things */
.bio-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-top:4px}
button.bio-gi{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  padding:0;overflow:hidden;text-align:left;font-weight:600}
button.bio-gi:hover{background:var(--panel);border-color:var(--ckline);transform:translateY(-2px);box-shadow:0 8px 18px rgba(150,165,180,.25)}
.bio-gi .ph{display:flex;aspect-ratio:4/3;align-items:center;justify-content:center;font-size:40px;background:hsl(var(--h) 60% 93%)}
.bio-gi .ph img{width:100%;height:100%;object-fit:cover}
.bio-gi .tx{display:block;padding:10px 12px 12px}
.bio-gi .nm{display:block;font-size:13.5px;font-weight:700;word-break:break-word}
.bio-gi .sb{display:block;font-size:12px;color:var(--meta);margin-top:1px}
/* people: an orbit around you, closest people on the innermost ring */
/* overflow:hidden — each ring is a square box turning around the centre, and
   a turned square's corners poke out past the circle. Those corners are
   empty, but on a phone they widened the page into a sideways scroll. The
   faces and names stay inside: the plan leaves a margin around the outer
   ring for them. */
.orb{position:relative;margin:2px auto 0;max-width:100%;overflow:hidden}
.orb-track{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px dashed var(--tc);opacity:.5;
  transform:translate(-50%,-50%);pointer-events:none}
.orb-ring{position:absolute;inset:0;pointer-events:none;animation:orb-spin var(--d) linear infinite;animation-delay:var(--ph)}
.orb-ring.rev{animation-direction:reverse}
button.orb-p{position:absolute;pointer-events:auto;background:none;border:none;padding:0;border-radius:50%;
  width:var(--a);height:var(--a);margin:calc(var(--a) / -2) 0 0 calc(var(--a) / -2)}
button.orb-p:hover{background:none}
.orb-cr{position:relative;display:block;width:100%;height:100%;
  animation:orb-spin var(--d) linear infinite reverse;animation-delay:var(--ph)}
.orb-ring.rev .orb-cr{animation-direction:normal}
.orb-face{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;overflow:hidden;
  font-weight:700;font-size:calc(var(--a,46px) * .33);letter-spacing:.02em;border:2.5px solid var(--panel);
  box-shadow:0 0 0 2.5px var(--tc),0 4px 10px rgba(70,85,100,.18);transition:transform .2s cubic-bezier(.2,.8,.3,1.3)}
.orb-face img{width:100%;height:100%;object-fit:cover}
button.orb-p:hover .orb-face,button.orb-p:focus-visible .orb-face{transform:scale(1.15)}
.orb-lbl{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);font-size:11.5px;font-weight:700;
  color:var(--tile);white-space:nowrap;max-width:88px;overflow:hidden;text-overflow:ellipsis;
  background:rgba(250,252,254,.88);padding:0 5px;border-radius:6px;line-height:1.45}
.orb:hover .orb-ring,.orb:hover .orb-cr,.orb:focus-within .orb-ring,.orb:focus-within .orb-cr{animation-play-state:paused}
.orb-you{position:absolute;left:50%;top:50%;width:var(--y);height:var(--y);margin:calc(var(--y) / -2) 0 0 calc(var(--y) / -2)}
.orb-you .orb-face{--a:var(--y);background:var(--panel2);color:var(--ghost);box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(113,92,149,.25)}
.orb-you::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);opacity:0;
  animation:orb-pulse 3.4s ease-out infinite}
.orb-you .orb-lbl{color:var(--accent)}
.orb.fresh .orb-face{animation:orb-pop .55s cubic-bezier(.2,.9,.3,1.35) backwards;animation-delay:var(--pd,0s)}
@keyframes orb-spin{to{transform:rotate(360deg)}}
@keyframes orb-pulse{0%{transform:scale(.88);opacity:.5}100%{transform:scale(1.55);opacity:0}}
@keyframes orb-pop{from{transform:scale(.2);opacity:0}}
.orb-legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.orb-legend span{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--dim);
  padding:4px 10px;border-radius:999px;background:var(--panel2)}
.orb-legend i{width:9px;height:9px;border-radius:50%}
.orb-avoid{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:12px}
.orb-avoid>span{font-size:12px;color:var(--faint);font-weight:600}
.orb-key{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel2)}
.orb-key-t{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--eyebrow)}
.orb-key-t i{width:9px;height:9px;border-radius:50%;flex:none}
.orb-key-n{display:flex;flex-wrap:wrap;gap:2px 0;margin:3px 0 0 15px}
button.orb-nm{background:none;border:none;padding:0;font-weight:700;font-size:13px;color:var(--tile);border-radius:4px}
button.orb-nm:not(:last-child)::after{content:'·';color:var(--ghost);font-weight:600;margin:0 8px}
button.orb-nm:hover{background:none;color:var(--accent)}
button.orb-nm.more{color:var(--accent)}
/* people as cards, the other way to look at the same list */
.bio-ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px;padding-top:4px}
button.bio-pc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 10px 13px;
  border-radius:14px;background:var(--panel);border:1px solid var(--line2);font-weight:600;min-width:0}
button.bio-pc:hover{background:var(--panel);border-color:var(--ckline);transform:translateY(-2px);box-shadow:0 8px 18px rgba(150,165,180,.25)}
.bio-pc .orb-face{--a:58px;width:58px;height:58px;margin-bottom:6px}
.bio-pc .nm{font-size:13.5px;font-weight:700;line-height:1.3;word-break:break-word}
.bio-pc .rl{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.bio-pc .sb{font-size:11.5px;color:var(--meta)}
.bio-vt{padding:3px;gap:2px}
.bio-vt .seg{padding:5px 11px;font-size:12px}
/* the quick card an item opens */
.bio-pk{display:flex;gap:16px;align-items:flex-start}
.bio-pk-cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--eyebrow);font-weight:700}
.bio-pk h2{font-size:21px;margin:3px 0 0;line-height:1.25;word-break:break-word}
.bio-pk-j{margin-top:16px;padding:13px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2)}
.bio-pk-last{display:block;margin-top:9px;padding:9px 11px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line2);cursor:pointer;font-size:12.5px}
.bio-pk-last:hover{border-color:var(--ckline)}
.bio-pk-last b{display:block;font-size:13px}
.bio-pk-last span{color:var(--dim)}
/* section settings */
.bio-cm{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.bio-cm-row{display:grid;grid-template-columns:46px minmax(0,1.3fr) minmax(0,1.25fr) minmax(0,.9fr) 24px 30px;gap:7px;align-items:center}
.bio-cm-row input,.bio-cm-row select{padding:7px 9px;font-size:13px}
.bio-cm-row select{padding-right:26px;background-position:calc(100% - 13px) 14px,calc(100% - 8px) 14px}
.bio-cm-ic{text-align:center;padding:7px 2px!important}
.bio-cm-h{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--eyebrow);margin-bottom:-3px}
.bio-cm-h span{padding-left:3px}
.bio-cm-h .h-n{grid-column:2}
.bio-cm-h .h-v{grid-column:3}
.bio-cm-h .h-s{grid-column:4}
.bio-cm-n{font-size:12px;text-align:right}
@media(max-width:620px){
  .bio-cover{height:100px}
  .bio-head{margin-top:-40px;padding:0 16px 18px}
  .bio-av{width:86px;height:86px;line-height:78px;font-size:29px}
  .bio-name{font-size:21px}
  .bio-str{padding:13px 16px 15px}
  .bio-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  button.bio-stat{min-width:0;padding:8px 10px 7px}
  .bio-stat span{white-space:normal;line-height:1.3}
  button.bio-more{width:calc(100% + 32px);margin:12px -16px -16px}
  .bio-logo{width:42px;height:42px;font-size:14px}
  .bio-shelf{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px 11px}
  .bio-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bio-gal,.bio-ppl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bio-cm{gap:9px}
  .bio-cm-row{grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) 22px 30px;gap:6px;
    padding-bottom:9px;border-bottom:1px solid var(--line2)}
  .bio-cm-row .bio-cm-nm{grid-column:2 / 4}
  .bio-cm-row .bio-cm-v{grid-row:2;grid-column:2}
  .bio-cm-row .bio-cm-s{grid-row:2;grid-column:3}
  .bio-cm-row input,.bio-cm-row select{font-size:16px}   /* 16px or iOS zooms on focus */
  .bio-cm-row.bio-cm-h{border-bottom:none;padding-bottom:0}
  .bio-cm-h .h-n{display:none}
  .bio-cm-h .h-v{grid-column:2}
  .bio-cm-h .h-s{grid-column:3}
  .bio-cm-row select{padding-left:8px}
}
@media (prefers-reduced-motion:reduce){
  .bio.fresh>*,.orb.fresh .orb-face,.bio-str.fresh .bar i,.bio>.bio-flash{animation:none}
  .orb-ring,.orb-cr,.orb-you::before{animation:none}
  button.bio-tl,.bio-tl .em,.bio-pst .cv,.orb-face{transition:none}
  button.bio-tl:hover,button.bio-tl:hover .em,button.bio-pst:hover .cv,button.bio-gi:hover,button.bio-pc:hover,
  button.bio-chip:hover,button.bio-stat:hover,button.orb-p:hover .orb-face,button.orb-p:focus-visible .orb-face{transform:none}
}
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line2);
  border-radius:8px;transition:background .12s}
.item:hover{background:rgba(33,42,51,.025)}
.item:last-child{border-bottom:none}
.item .ti{flex:1;min-width:0}
.item .tt{word-break:break-word}
.item.done .tt{color:var(--ghost);text-decoration:line-through}
.item .meta{font-size:11.5px;color:var(--meta);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.item .x{opacity:0;color:var(--faint);background:none;border:none;padding:2px 5px;font-size:13px}
.item:hover .x{opacity:.75}
.item .x:hover{color:var(--bad);background:none}
.due-over{color:var(--bad)} .due-soon{color:var(--over)}

/* due-date dividers */
.daydiv{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;
  margin:26px 0 2px;padding-bottom:9px;border-bottom:1px solid var(--line2);position:relative}
.daydiv:first-child{margin-top:2px}
.daydiv::after{content:'';position:absolute;left:0;bottom:-1px;width:64px;height:2px;
  background:var(--dc);border-radius:2px}
.daydiv .dt{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.daydiv .dr{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;font-weight:600}
.daydiv .dm{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.daydiv+.item{padding-top:12px}

/* importance */
.impd{display:inline-flex;gap:2px;align-items:center;margin-right:7px;vertical-align:1px}
.impd i{border-radius:50%;display:block}
.pill.sub{margin-left:6px;font-size:10.5px;padding:1px 7px;vertical-align:1px}

/* subtasks + notes */
.detail{margin-top:9px;padding:10px 0 4px 3px;border-left:2px solid var(--line2);padding-left:12px}
.detail input[type=checkbox]{width:15px;height:15px}
.subadd{margin-top:6px;padding:8px 12px;font-size:12.5px;background:transparent;border:1.5px dashed var(--dashline);border-radius:14px}
.subadd:focus{border-style:solid;background:#fff}
.note{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;
  padding:8px 11px;margin-bottom:7px}
.note .x{opacity:.55;background:none;border:none;color:var(--faint);padding:0 3px;font-size:12px}
.note .x:hover{opacity:1;color:var(--bad);background:none}

/* modal */
.veil{position:fixed;inset:0;background:rgba(33,42,51,.32);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .16s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;
  width:100%;max-width:520px;max-height:90vh;overflow:auto;overscroll-behavior:contain;
  box-shadow:0 24px 60px rgba(150,165,180,.35)}
.modal.wide{max-width:660px}
@keyframes rl-modal-in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal{animation:rl-modal-in .17s cubic-bezier(.2,.8,.3,1)}
.stars{display:flex;gap:7px;justify-content:center;margin:16px 0 4px}
.stars button{font-size:35px;background:none;border:none;padding:2px 3px;color:var(--track);line-height:1;
  transition:transform .12s cubic-bezier(.2,.8,.3,1),color .12s}
.stars button.lit{color:var(--gold)}
.stars button:hover{background:none;transform:scale(1.14)}
.stars button:active{transform:scale(.94)}

/* stats */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .n{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2}
.stat .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--eyebrow);margin-top:4px;font-weight:600}
.stat .s{font-size:11.5px;color:var(--dim);margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:700;color:var(--eyebrow);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:7px 9px;border-bottom:1px solid var(--line2)}
td{padding:8px 9px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:none}
th.r,td.r{text-align:right}

.bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.bars .b{flex:1;background:linear-gradient(180deg,#8dc899,#c7e8cd);
  border-radius:8px 8px 3px 3px;min-height:2px;position:relative}
.bars .b.today{background:linear-gradient(180deg,#6fb07d,#b3d9b9)}
.bars .b:hover{filter:brightness(1.06)}
.axis{display:flex;gap:8px;margin-top:8px}
.axis span{flex:1;text-align:center;font-size:10.5px;color:var(--ghost)}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:2.5px;background:var(--track);display:block}

.sess{border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--panel)}
.logo{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:var(--panel2);border:1px solid var(--line2);flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.emo{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:8px}
.emo button{font-size:19px;padding:6px 0;background:var(--panel2);border:1px solid transparent;border-radius:8px}
.emo button.on{border-color:var(--focus);background:var(--seltile)}

.banner{background:#fdf6e9;border:1px solid #ecdcb0;
  border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:14px;color:#7a5c1e}
.alarm{background:#fdeeee;border:1px solid #f3caca;
  border-radius:14px;padding:14px 16px;margin-bottom:18px}
.alarm h3{font-size:14.5px;color:#a04a3f;margin-bottom:5px}
.alarm p{margin:0 0 7px;font-size:13px;color:#7a3f3f;line-height:1.55}
.alarm code{background:#f7dede;border:1px solid #eab9b9;border-radius:5px;
  padding:1px 6px;font-size:12.5px;color:#8a3030}
.ok-note{background:#eaf7ee;border:1px solid #bfe4c9;
  border-radius:11px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;color:#2f6b40}
.empty{color:var(--dim);font-size:13.5px;margin:0;padding:6px 0}

/* diary */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav button{background:none;border:none;color:var(--dim);font-size:15px;padding:4px 10px;cursor:pointer}
.cal-nav button:hover{color:var(--tile);background:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:10px;text-align:center;color:var(--eyebrow);font-weight:700;padding-bottom:4px}
.cal-day{aspect-ratio:1;border-radius:10px;border:1px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--navin);background:var(--panel2);cursor:pointer}
.cal-day:hover{border-color:var(--focus)}
.cal-day.empty{visibility:hidden;cursor:default}
.cal-day.today{font-weight:700;color:var(--activetx)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--focus)}
/* one dot per entry, under the number. The cell's fill comes from the Daily
   entry's mood; the dots count everything written that day. */
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;
  max-width:100%;min-height:5px;margin-top:2px}
.cal-dots i{width:4.5px;height:4.5px;border-radius:50%;display:block;flex:none}
.mood-dot{width:24px;height:24px;border-radius:50%;display:block;flex:none;box-shadow:inset 0 0 0 1px rgba(33,42,51,.08)}
.tagpill{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;font-weight:600}
/* journal vault */
.vault-graph{position:relative;height:460px;padding:0;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#fff 0,var(--panel) 60%)}
#vg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.vg-ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.vg-ctl button{width:30px;height:30px;padding:0;border-radius:9px;background:var(--panel);font-size:16px;line-height:1}
.vg-legend{position:absolute;left:12px;top:10px;display:flex;gap:12px;font-size:11px;color:var(--faint);pointer-events:none}
.vg-legend span{display:inline-flex;align-items:center;gap:5px}
.vg-legend i{display:block;border-radius:50%}
.vg-hint{position:absolute;left:12px;bottom:9px;font-size:11px;color:var(--faint);pointer-events:none}
.vault-cols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.vtopic-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
.vtopic-row:hover{background:var(--panel2)}
.vtopic-row.on{background:var(--seltile);color:var(--activetx)}
.vchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:999px;border:1px solid;cursor:pointer;white-space:nowrap}
.vx{background:transparent;border:none;padding:0 0 0 2px;font-size:14px;line-height:1;color:inherit;opacity:.55;border-radius:4px}
.vx:hover{opacity:1;background:transparent}
.vlink{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.vlink:hover{background:var(--panel2)}
.vault-meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
.wikilink{color:var(--accent);font-weight:700;cursor:pointer;border-bottom:1px solid #715c9555}
.wikilink.ghost{color:var(--dim);border-bottom-style:dashed}
.vrow{align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line2);font-size:13px}
.vrow input{margin-top:2px}
#vault-panel mark{background:#f6e7a8;color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:760px){
  .vault-graph{height:360px}
  .vault-cols{grid-template-columns:1fr}
  .vg-hint{display:none}
}
.dia-thumb{width:60px;height:60px;border-radius:10px;overflow:hidden;position:relative;flex:none;background:var(--panel2)}
.dia-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dia-thumb .del{position:absolute;top:1px;right:1px;background:rgba(33,42,51,.55);border:none;color:#fff;
  border-radius:50%;width:16px;height:16px;font-size:10px;line-height:1;cursor:pointer;padding:0}
.dia-thumb .del:hover{background:var(--bad)}
.dia-photo{width:120px;height:120px;border-radius:12px;overflow:hidden;flex:none}
.dia-photo img{width:100%;height:100%;object-fit:cover;display:block}

/* sticky notes */
/* grid, not CSS multi-column: columns distribute sub-pixel remainders
   unevenly, so notes would differ in width by a pixel or two. */
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;align-items:start}
.stk{border-radius:4px 4px 10px 4px;
  padding:13px 14px 11px;position:relative;box-shadow:0 3px 9px rgba(150,165,180,.28);
  transform:rotate(var(--tilt,0deg));transition:transform .16s,box-shadow .16s}
.stk:hover{transform:rotate(0deg) translateY(-2px);box-shadow:0 8px 18px rgba(150,165,180,.4);z-index:2}
.stk .tx{white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.5;color:#2f3a44}
.stk .ts{font-size:10px;color:#2f3a44;opacity:.5;margin-top:9px;display:block}
.stk .acts{position:absolute;top:5px;right:6px;display:flex;gap:1px;opacity:0;transition:opacity .16s}
.stk:hover .acts{opacity:1}
.stk .acts button{background:rgba(255,255,255,.55);border:none;color:#2f3a44;font-size:10.5px;
  padding:3px 5px;line-height:1;cursor:pointer;border-radius:5px}
.stk .acts button:hover{background:rgba(255,255,255,.95)}
.stk.arch{opacity:.72;box-shadow:none;border:1px solid var(--line2)}
.stk-sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex:none}
.stk-sw.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--panel) inset}
@media (prefers-reduced-motion:reduce){
  .stk{transform:none;transition:none}
  .stk:hover{transform:none}
  /* study: the fills and the ring still change, they just stop sliding */
  .sd-comp .r .fl,.sd-bar i,.sd-ring circle{transition:none}
  .sd-unit,.sd-choice,.sd-tok,.sd-heat td.c{transition:background .13s,border-color .13s}
  .sd-unit:not(.lock):hover,.sd-unit:not(.lock):active,
  .sd-choice:active,.sd-tok:active,.sd-heat td.c:hover{transform:none}
  .sd-fb,.sd-note{animation:none}
}


/* ── phone layout ──────────────────────────────────────────────────────────
   The sidebar becomes a bottom tab bar (Daily · Focus · Tasks · Journeys · More).
   Everything else lives in the More sheet, which initMobileNav() builds. */
@media (max-width:760px){
  html{-webkit-text-size-adjust:100%}
  body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
  button,.chip,.tile,.navitem{touch-action:manipulation}
  /* 16px stops iOS from zooming the page when a field is focused */
  input,textarea,select{font-size:16px}
  #shell{flex-direction:column;min-height:100vh;min-height:100dvh}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;z-index:50;
    flex-direction:row;align-items:stretch;gap:0;overflow:visible;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    border-right:none;border-top:1px solid #e0d8c8}
  .sidebar .wordmark,.sidebar .navfoot,.sidebar .navsubs{display:none!important}
  .navlist{flex:1;flex-direction:row!important;gap:0!important;justify-content:space-around}
  .navitem{flex:1;min-width:0;flex-direction:column;justify-content:center;align-items:center;gap:4px;
    padding:8px 2px 6px;font-size:11px;border-radius:12px;text-align:center}
  .navitem svg{width:22px;height:22px}
  .navitem .hint,.navitem .pip{display:none}
  #subnav{display:flex;gap:4px;background:#ece6d9;padding:4px;border-radius:99px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
  #subnav:empty{display:none}
  #subnav::-webkit-scrollbar{display:none}
  #subnav button{flex:1 0 auto;border:none;background:none;border-radius:99px;padding:9px 14px;font:600 13px/1 'Outfit',sans-serif;color:var(--dim);white-space:nowrap}
  #subnav button.on{background:var(--panel);color:var(--tx);box-shadow:0 2px 6px rgba(31,46,44,.1)}
  .main,.main.wide{padding:18px 16px calc(84px + env(safe-area-inset-bottom));max-width:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .veil{padding:12px}
  .modal{padding:20px;max-height:88vh;max-height:88dvh}
  #v-onboard{min-height:100vh;min-height:100dvh;padding:20px}
  .ob-card{padding:36px 24px}
}
@media (max-width:760px){ /* phone views: per-screen fixes */
  /* list rows: the title gets the full width, the small action buttons wrap underneath it */
  .item{flex-wrap:wrap;gap:8px 11px}
  .item>.ti{flex:1 1 calc(100% - 44px);min-width:0}
  .item>.ti+button,.item>.ti+.iconbtn{margin-left:29px}
  .item>button.xs{margin-top:0}
  .item input[type=checkbox],.detail input[type=checkbox]{width:22px;height:22px}
  /* tasks toolbar: search on its own line, buttons below */
  #asg-q{flex:1 1 100%!important;max-width:none!important}
  /* form fields may shrink inside flex/grid rows (native date inputs otherwise refuse and overflow) */
  input,select,textarea{min-width:0;max-width:100%}
  .modal .row>*,.card .row>*{min-width:0}
  input[type=date],input[type=time]{min-height:44px}
  /* sticky notes: two columns, actions on their own line instead of over the text */
  .stk-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stk{display:flex;flex-direction:column}
  .stk .acts{position:static;order:5;align-self:flex-end;margin-top:8px}
  .stk .ts{order:4}
  /* segmented controls stay on one line so their titles don't wrap around them */
  .seg-wrap{gap:2px}
  .seg{padding:8px 11px;white-space:nowrap}
  .row.sp>h2{white-space:nowrap}
/* end phone views */
}
/* touch screens have no hover, so controls that only appeared on hover are always shown */
@media (hover:none){
  .item .x{opacity:.65}
  .stk .acts{opacity:1}
}
@media (pointer:coarse){
  button.sm{padding:9px 14px}
  button.xs{padding:6px 11px}
  .iconbtn{width:38px;height:38px}
}

/* ══════════════ Koi Pond ══════════════
   The water, the fish and the plants are drawn by pond.js; these rules lay
   out the screens around them. Colours are the design's, used directly —
   the water only ever comes in one shade of teal. */
/* both ends spelled out: with only `to`, the start is the fish's inline
   offset-distance, so one parked at 93% would crawl 7% of its loop per lap */
@keyframes pf-swim{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes pf-wag{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes pf-flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.72)}}
@keyframes pf-paddle{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes pf-fin-stroke{from{transform:rotate(-7deg) scaleY(.88)}to{transform:rotate(8deg) scaleY(1.06)}}
/* the same three for a part lifted out of a mirrored group (pond.js · lift):
   a reflection turns every rotation the other way */
@keyframes pf-wag-m{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
@keyframes pf-paddle-m{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes pf-fin-stroke-m{from{transform:rotate(7deg) scaleY(.88)}to{transform:rotate(-8deg) scaleY(1.06)}}
@keyframes pf-in{from{opacity:0}to{opacity:1}}
@keyframes pf-ripple{0%{transform:translate(-50%,-50%) scale(.2);opacity:.55}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@keyframes pf-tap{0%{transform:translate(-50%,-50%) scale(.1);opacity:.9}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes pf-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes pf-orbit{to{transform:rotate(360deg)}}
@keyframes pf-drift1{from{transform:translate(0,0)}to{transform:translate(-160px,-60px)}}
@keyframes pf-drift2{from{transform:translate(-160px,-40px)}to{transform:translate(0,0)}}
@keyframes pf-glint{0%,100%{opacity:0;transform:scaleX(.4)}50%{opacity:.85;transform:scaleX(1)}}
@keyframes pf-float{from{transform:translate(-80px,0) rotate(0)}to{transform:translate(1260px,50px) rotate(260deg)}}
@keyframes pf-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.water{position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 45%,#2a7d78 0%,#1a5c60 42%,#0f3b41 100%);box-shadow:inset 0 0 70px #07252a}
.water>.amb{position:absolute;inset:0;pointer-events:none}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px}
.pcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pcard-t{font:400 22px/1.05 var(--serif);color:var(--tx)}
.pcard-s{font:400 13px/1 'Outfit',sans-serif;color:var(--faint)}
.ptitle{font:400 52px/1 var(--serif);color:var(--tx);margin:0}
.psub{font:400 16px/1.45 'Outfit',sans-serif;color:var(--label);margin-top:10px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.pbtn{font:500 14px/1 'Outfit',sans-serif;color:var(--label);padding:11px 16px;border-radius:99px;border:1px solid #d8cfbd;background:transparent;cursor:pointer}
.pbtn:hover{border-color:var(--faint);color:var(--tx);background:transparent}
.pbtn.go{font-weight:600;font-size:14.5px;color:#2a1408;background:var(--koi);border-color:transparent;padding:12px 20px;box-shadow:0 8px 20px #ec7a4533}
.pbtn.go:hover{background:var(--koi2)}
.pbtn.sm{font-size:13px;padding:8px 13px}
.eyebrow{font:600 10.5px/1 'Outfit',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--focus)}

/* ── the mark (pond.js · mark) ── */
@keyframes cd-orbit{to{transform:rotate(360deg)}}
@keyframes cd-surge{from{transform:rotate(-5deg)}to{transform:rotate(4deg)}}
@keyframes cd-glow{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.25);opacity:.7}}

/* ── Hello: the page you land on each time the app opens ──
   A sheet of pond water over the whole app: who you are, what today holds,
   and one question. Sits above the phone's nav bar (50) and under modals
   (60) and toasts, so anything that pops at boot still shows on top. */
/* The 20% shade over the gradient is how this water has always looked: it
   used to come from the caustic sheets, drawn black (their filters were
   missing) and, in this fixed layer, veiling the water instead of blending
   away. It's kept as a still tint, so the page looks exactly as it did. */
#v-hello{position:fixed;inset:0;z-index:55;overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(#0003,#0003),radial-gradient(ellipse at 50% 38%,#2a7d78 0%,#1a5c60 40%,#113f46 72%,#0b3036 100%);
  display:flex;flex-direction:column;align-items:center;padding:36px 22px;
  transition:opacity .7s ease,transform .7s ease}
#v-hello.hide{display:none}
#v-hello.out{opacity:0;transform:scale(1.035);pointer-events:none}
#v-hello .amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#v-hello .vig{position:fixed;inset:0;pointer-events:none;z-index:7;
  background:radial-gradient(ellipse at 50% 46%,#0b303600 0%,#0b303600 34%,#0b3036b8 100%)}
/* margin:auto centres it when it fits and lets it scroll from the top when it doesn't */
.hl{position:relative;z-index:8;width:100%;max-width:700px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.hl>*{animation:hl-up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes hl-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* on the still pond disc only: a shadow over the moving layers would be recomputed every frame */
.hl svg.cd-mark,.hl .cd-disc{filter:drop-shadow(0 18px 30px rgba(3,20,23,.55))}
.hl-ey{margin-top:20px;font:500 12.5px/1 'Outfit',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9fc2bb}
.hl-h{margin-top:12px;font:400 54px/1.04 var(--serif);color:#fbf8f2;letter-spacing:-.02em;text-wrap:balance}
.hl-l{margin-top:12px;max-width:500px;font:400 18px/1.5 'Outfit',sans-serif;color:#d7e8e3;text-wrap:pretty}
.hl-l b{font-weight:600;color:#f7c7a6}
/* one fish per task on today's line: caught ones in their species' colours */
.hl-catch{margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;max-width:520px}
.hl-catch span{width:46px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  background:#ffffff0d;border:1.5px dashed #cfe9e340}
.hl-catch span svg{opacity:.35}
.hl-catch span.on svg{opacity:1}
.hl-catch span.on{background:#0b303680;border:1.5px solid #f7c7a64d}
.hl-catch span svg{width:34px;height:auto}
.hl-tiles{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.hl-tile{border-radius:20px;padding:16px 16px 15px;background:#0b30367a;border:1px solid #cfe9e324;backdrop-filter:blur(6px);

.hl-tile .v small{font:400 14px/1 'Outfit',sans-serif;color:#9fc2bb;margin-left:4px}
.hl-tile .bar{height:5px;border-radius:99px;background:#ffffff1c;overflow:hidden}
.hl-tile .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7fc79a,#f0b35a);width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1) .5s}
.hl-tile .s{font:400 12.5px/1.35 'Outfit',sans-serif;color:#b9d3cd}
.hl-nexts{margin-top:12px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}

.hl-next .t{font:500 16px/1.3 'Outfit',sans-serif;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hl-next .d{flex:none;margin-left:auto;font:600 13px/1 'Outfit',sans-serif;padding:7px 10px;border-radius:99px}
/* today's bug in the reeds, a glassy row under the tiles */
.hl-bug{margin-top:12px;width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:20px;text-align:left;cursor:pointer;

.hl-bug .pad{width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 60%,#e3efe2,#f1ebdf 72%);display:flex;align-items:center;justify-content:center}
.hl-bug.mv .pad svg{animation:hl-bug-bob 2.6s ease-in-out infinite alternate}
@keyframes hl-bug-bob{from{transform:translateY(1.5px) rotate(-2deg)}to{transform:translateY(-2px) rotate(2deg)}}
.hl-bug .tx{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.hl-bug .k{font:600 10.5px/1 'Outfit',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9fc2bb}
.hl-bug .t{font:400 21px/1.1 var(--serif);color:#fbf8f2}
.hl-bug .m{font:400 12.5px/1.35 'Outfit',sans-serif;color:#b9d3cd}
.hl-bug .c{flex:none;font:600 12.5px/1 'Outfit',sans-serif;color:#f7c7a6;white-space:nowrap}

.hl-q{margin-top:28px;font:400 30px/1.15 var(--serif);color:#fbf8f2}
.hl-b{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.hl-b button{border-radius:99px;font:600 15.5px/1 'Outfit',sans-serif;padding:16px 28px;border:1px solid transparent}
.hl-b .go{background:var(--koi);color:#2a1408;box-shadow:0 12px 30px #ec7a4555}

/* fish swim behind the words; a soft shadow keeps them readable */
.hl-ey,.hl-h,.hl-l,.hl-q{text-shadow:0 2px 18px #0b3036,0 1px 3px #0b303699}

.hl-foot i{width:4px;height:4px;border-radius:50%;background:#9fc2bb66}
@media (max-width:760px){

  .hl-tile .v{font-size:23px}
  .hl-tile .s{display:none}
  .hl-q{font-size:25px;margin-top:28px}

/* ── New species: the unlock screen (unlockShow) ──
   Above Hello (55) and the phone nav, under modals (60) and toasts. Every
   movement is a transform or an opacity, so it runs on the compositor.
   .moving carries the loops (rays, bob, bubbles, sparkles); .intro the
   one-time reveal, which only ever ends on the plain resting styles, so
   dropping .intro mid-way (a tap, Enter) just lands on the finished card.
   With motion off neither class is set and the card simply appears. */
#v-unlock{position:fixed;inset:0;z-index:58;overflow-y:auto;overscroll-behavior:contain;
  --ul-glow:#7fc79a66;--ul-ray:#bfe8cf2e;--ul-hi:#bfe8cf;
  background:radial-gradient(ellipse at 50% 32%,#246f6b 0%,#164e53 38%,#0d353b 70%,#082529 100%);
  display:flex;flex-direction:column;align-items:center;padding:28px 20px;
  animation:ul-in .4s ease;transition:opacity .45s ease}
#v-unlock.hide{display:none}
#v-unlock.out{opacity:0;pointer-events:none}
@keyframes ul-in{from{opacity:0}}
.ul-bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.ul-bubbles i{position:absolute;bottom:-24px;border-radius:50%;border:1.5px solid #cfe9e34d;background:#ffffff0d;opacity:0}
.ul{position:relative;z-index:2;width:100%;max-width:540px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.ul-ey{position:relative;height:14px;width:100%;font:600 12px/14px 'Outfit',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9fc2bb}
.ul-ey span{position:absolute;left:0;right:0;top:0}
.ul-ey .a{opacity:0}
.ul-ey .b{color:var(--ul-hi)}
.ul-stage{position:relative;width:min(100%,440px);height:240px;margin-top:8px;cursor:default}
.ul-stage>*{position:absolute;left:50%;top:50%;pointer-events:none}
.ul-rays{width:640px;height:640px;margin:-320px 0 0 -320px}
.ul-rays i{position:absolute;inset:0;border-radius:50%;opacity:.6;
  background:repeating-conic-gradient(from 0deg,var(--ul-ray) 0deg 7deg,transparent 7deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 16%,transparent 60%);mask:radial-gradient(circle,#000 0,#000 16%,transparent 60%)}
.ul-glow{width:380px;height:230px;margin:-115px 0 0 -190px}
.ul-glow i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse,var(--ul-glow) 0%,transparent 68%)}
.ul-ring{width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:2px solid #e6f5f1;opacity:0}
.ul-ring.idle{border-color:var(--ul-hi)}
.ul-shadow,.ul-fish{transform:translate(-50%,-50%)}
.ul-shadow{opacity:0}
.ul-shadow svg{filter:blur(1.5px)}
.ul-bob{display:block}
.ul-flash{width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,#ffffff 0%,#fffbe8cc 22%,#ffffff00 66%)}
.ul-spark{width:16px;height:16px;margin:-8px 0 0 -8px;opacity:0;color:var(--ul-hi)}
.ul-spark svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 3px var(--ul-hi))}
.ul-meta{margin-top:6px;display:flex;align-items:center;gap:10px}
.ul-no{font:500 12.5px/1 'Outfit',sans-serif;color:#9fc2bb;letter-spacing:.08em}
.ul-rar{font:600 12px/1 'Outfit',sans-serif;font-style:normal;padding:5px 10px;border-radius:99px}
.ul-name{margin:12px 0 0;font:400 52px/1.02 var(--serif);color:#fbf8f2;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 2px 18px #0b3036}
.ul-lore{margin:14px 0 0;max-width:450px;font:400 17px/1.55 'Outfit',sans-serif;color:#d7e8e3;text-wrap:pretty}
.ul-how{margin-top:16px;padding:10px 16px;border-radius:14px;background:#0b303680;border:1px solid #cfe9e324;
  font:400 13.5px/1.4 'Outfit',sans-serif;color:#b9d3cd;max-width:100%;overflow-wrap:anywhere}
.ul-how b{font-weight:500;color:#fbf8f2}
.ul-count{margin-top:18px;width:min(100%,300px);display:flex;flex-direction:column;gap:8px;align-items:center}
.ul-count .bar{width:100%;height:5px;border-radius:99px;background:#ffffff1c;overflow:hidden}
.ul-count .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7fc79a,#f0b35a);transform-origin:left;transform:scaleX(var(--to))}
.ul-count span{font:400 12.5px/1 'Outfit',sans-serif;color:#9fc2bb}
.ul-b{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.ul-b button{border-radius:99px;font:600 15.5px/1 'Outfit',sans-serif;padding:16px 30px;border:1px solid transparent}
.ul-b .go{background:var(--koi);color:#2a1408;box-shadow:0 12px 30px #ec7a4555}
.ul-b .go:hover{background:var(--koi2)}
.ul-b .alt{background:transparent;border-color:#cfe9e366;color:#e6f5f1}
.ul-b .alt:hover{background:#ffffff14;border-color:#cfe9e3aa}
.ul-b button:focus{outline:none}
.ul-b button:focus-visible{outline:2px solid #fbf8f2aa;outline-offset:4px}
.ul-k{flex-basis:100%;margin-top:2px;font:400 12px/1 'Outfit',sans-serif;color:#9fc2bb99}
.ul-k kbd{font:500 11px/1 'Outfit',sans-serif;padding:3px 6px;border-radius:5px;border:1px solid #9fc2bb55;color:#cfe2dd}
/* loops */
#v-unlock.moving .ul-bubbles i{animation:ul-rise var(--t) linear var(--d) infinite}
@keyframes ul-rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.8}100%{transform:translate(var(--x),-112vh);opacity:0}}
#v-unlock.moving .ul-rays i{animation:ul-spin 44s linear infinite}
@keyframes ul-spin{to{transform:rotate(360deg)}}
#v-unlock.moving .ul-glow i{animation:ul-pulse 3.6s ease-in-out 1.6s infinite}
@keyframes ul-pulse{50%{transform:scale(1.12);opacity:.8}}
#v-unlock.moving .ul-ring.idle{animation:ul-ring 3.4s ease-out 2.2s infinite}
@keyframes ul-ring{0%{transform:scale(.25);opacity:.6}100%{transform:scale(1.35);opacity:0}}
#v-unlock.moving .ul-bob{animation:ul-bob 3.4s ease-in-out 1.8s infinite}
@keyframes ul-bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
#v-unlock.moving .ul-spark{animation:ul-twinkle var(--t) ease-in-out var(--d) infinite}
@keyframes ul-twinkle{0%,100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.15)}50%{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}}
/* the reveal: a shadow surfaces, rings spread, a flash, and it's there */
#v-unlock.intro .ul-ey .a{animation:ul-ey 1.2s ease both}
@keyframes ul-ey{0%{opacity:0}18%,72%{opacity:1}100%{opacity:0}}
#v-unlock.intro .ul-ey .b{animation:ul-up .6s ease 1.15s both}
#v-unlock.intro .ul-shadow{animation:ul-shadow 1.3s ease both}
@keyframes ul-shadow{0%{opacity:0;transform:translate(-50%,-38%) scale(.8)}28%{opacity:.85}62%{transform:translate(-50%,-53%) scale(.96)}82%{opacity:.85;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
#v-unlock.intro .ul-ring.r1{animation:ul-ring 1.4s ease-out .15s both}
#v-unlock.intro .ul-ring.r2{animation:ul-ring 1.4s ease-out .5s both}
#v-unlock.intro .ul-ring.r3{animation:ul-ring 1.4s ease-out .85s both}
#v-unlock.intro .ul-rays,#v-unlock.intro .ul-glow{animation:ul-fade 1s ease 1.05s both}
@keyframes ul-fade{from{opacity:0}}
#v-unlock.intro .ul-flash{animation:ul-flash .85s ease-out 1.02s both}
@keyframes ul-flash{0%{opacity:0;transform:scale(.3)}28%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
#v-unlock.intro .ul-fish{animation:ul-pop .95s cubic-bezier(.2,1.45,.4,1) 1.1s both}
@keyframes ul-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}35%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#v-unlock.intro .ul-meta{animation:ul-up .7s cubic-bezier(.2,.8,.2,1) 1.3s both}
#v-unlock.intro .ul-name{animation:ul-up .7s cubic-bezier(.2,.8,.2,1) 1.4s both}
#v-unlock.intro .ul-lore{animation:ul-up .7s cubic-bezier(.2,.8,.2,1) 1.55s both}
#v-unlock.intro .ul-how{animation:ul-up .7s cubic-bezier(.2,.8,.2,1) 1.68s both}
#v-unlock.intro .ul-count{animation:ul-up .7s cubic-bezier(.2,.8,.2,1) 1.78s both}
#v-unlock.intro .ul-count .bar i{animation:ul-bar 1.3s cubic-bezier(.2,.8,.2,1) 2s both}
@keyframes ul-bar{from{transform:scaleX(var(--from))}}
#v-unlock.intro .ul-b{animation:ul-up .7s cubic-bezier(.2,.8,.2,1) 1.9s both}
@keyframes ul-up{from{opacity:0;transform:translateY(14px)}}
/* closing: the fish swims off into the pond as the water fades */
.ul-fish{transition:transform .45s ease-in,opacity .45s ease-in}
#v-unlock.out .ul-fish{transform:translate(30%,-62%) scale(.55);opacity:0}
@media (max-width:760px){
  #v-unlock{padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
  .ul-stage{height:200px}
  .ul-rays{transform:scale(.75)}
  .ul-name{font-size:40px}
  .ul-lore{font-size:15.5px}
  .ul-b{flex-direction:column;width:100%}
  .ul-b button{width:100%}
  .ul-k{display:none}
}

/* ── Today ── */

.cr-m{display:flex;align-items:center;gap:6px 12px;font:400 13px/1.2 'Outfit',sans-serif;color:var(--dim);flex-wrap:wrap}

.reeds-h b{font:400 20px/1 var(--serif);color:#b0524a}
.reeds-h em{font:500 12px/1 'Outfit',sans-serif;font-style:normal;color:#b0524a;background:#d9695f1a;padding:4px 8px;border-radius:99px;margin-left:10px}
.reeds-h span{font:400 13px/1 'Outfit',sans-serif;color:var(--faint)}

/* ── the reeds (reedClump) ──
   Each overdue task is a clump of reeds with a fish caught in it: leaves,
   a cattail or two, a patch of water. The longer it's waited, the thicker
   the clump. Every leaf is its own box, so the idle sway (.rs) and the
   parting on hover (.rp, nested inside it) are plain transforms. */
.rd-ic{width:50px;height:44px;flex:none;position:relative}
.rd-ic .rw{position:absolute;left:2px;right:2px;bottom:0;height:9px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 45%,#cde6df 0%,#b5d8cf 55%,#b5d8cf00 72%)}
.rd-ic .rr{position:absolute;left:50%;bottom:0;width:48px;height:10px;margin-left:-24px;border-radius:50%;border:1.5px solid #6fa89d;opacity:0}
.rd-ic .rs{position:absolute;bottom:3px;transform-origin:50% 100%;transform:rotate(var(--r))}
.rd-ic .rp{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.7,.45,1)}
.rd-ic .rp svg{display:block;width:100%;height:100%;overflow:visible}

.jr-row:hover{background:#f1ebdf}
.jr-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:80px 20px}
.jr-empty .d{font:400 30px/1.1 var(--serif);color:var(--tx)}
.jr-empty p{font:400 15.5px/1.5 'Outfit',sans-serif;color:var(--dim);max-width:360px;margin:0}

/* ── Vault ── */
.vt{display:flex;flex-direction:column;gap:22px}
.vt-search{display:flex;align-items:center;gap:10px;width:300px;max-width:100%;padding:4px 16px;border-radius:99px;background:var(--panel);border:1px solid #e0d8c8}
.vt-search input{flex:1;background:transparent;border:none;box-shadow:none;padding:8px 0;font:400 14.5px/1 'Outfit',sans-serif}
.vt-search input:focus{box-shadow:none}
.pswitch{display:flex;align-items:center;gap:10px;font:500 14px/1 'Outfit',sans-serif;color:var(--label);cursor:pointer;padding:8px 4px;background:none;border:none}
.pswitch:hover{background:none;color:var(--tx)}
.pswitch i{width:40px;height:24px;border-radius:99px;background:#cfc6b4;position:relative;transition:background .2s;flex:none}
.pswitch i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fbf8f2;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pswitch.on i{background:var(--focus)}
.pswitch.on i::after{left:19px}
.vt-ban{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:18px;background:#e7efe9;border:1px solid #cfe0d5;flex-wrap:wrap}
