.vt-ban p b{font-weight:600;color:var(--tx)}
.vt-ban button{font:600 13.5px/1 'Outfit',sans-serif;color:#fbf8f2;background:var(--focus);padding:10px 16px;border-radius:99px;border:none}
.vt-ban button:hover{background:#286a65}
.vt-ban button.gh{background:transparent;color:var(--focus);border:1px solid #9fc2bb}
.vt-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:stretch}
.vt-map{height:620px;border-radius:30px;box-shadow:inset 0 0 80px #07252a;background:radial-gradient(ellipse at 50% 45%,#2a7d78 0%,#1a5c60 45%,#0f3b41 100%)}
.vt-map canvas{position:absolute;inset:0;z-index:5;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.vt-leg{position:absolute;left:20px;top:18px;z-index:9;display:flex;gap:16px;font:400 12.5px/1 'Outfit',sans-serif;color:#cfe2dd;background:#0f3b41cc;padding:9px 12px;border-radius:12px;pointer-events:none;flex-wrap:wrap}
.vt-leg span{display:flex;align-items:center;gap:7px}
.vt-ctl{position:absolute;right:16px;top:16px;z-index:9;display:flex;flex-direction:column;gap:6px}
.vt-ctl button{width:36px;height:36px;border-radius:12px;background:#fbf8f2e6;display:flex;align-items:center;justify-content:center;font:400 18px/1 'Outfit',sans-serif;color:var(--tx);padding:0;border:none}
.vt-ctl button:hover{background:#fbf8f2}
.vt-hint{position:absolute;left:20px;bottom:16px;z-index:9;font:400 12.5px/1 'Outfit',sans-serif;color:#9fc2bb;pointer-events:none}
.vt-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;max-width:320px;text-align:center;color:#cfe2dd;font:400 15px/1.5 'Outfit',sans-serif;pointer-events:none}
.vt-empty b{display:block;font:400 22px/1.2 var(--serif);color:#fbf8f2;margin-bottom:8px;font-weight:400}
.vt-side{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:26px 24px;display:flex;flex-direction:column;gap:18px;min-width:0;max-height:620px;overflow:auto}
.vt-tabs{display:flex;gap:6px;flex-wrap:wrap}
.vt-tabs button{display:flex;align-items:center;gap:6px;font:500 12.5px/1 'Outfit',sans-serif;padding:7px 11px;border-radius:99px;cursor:pointer;color:var(--label);background:#f1ebdf;border:none}
.vt-tabs button:hover{background:#ebe3d4}
.vt-tabs button.on{color:#fbf8f2;background:var(--deep)}
.vt-tabs button i{width:7px;height:7px;border-radius:50%}
.vt-tabs button.add{background:transparent;border:1px dashed #cfc6b4}
.vt-tn{display:flex;align-items:center;gap:12px}
.vt-tn i{width:22px;height:22px;border-radius:50%;flex:none}
.vt-tn b{font:400 32px/1.05 var(--serif);color:var(--tx);font-weight:400;word-break:break-word}
.vt-sum{font:400 16px/1.65 'Outfit',sans-serif;color:#33423f;text-wrap:pretty;margin:0;white-space:pre-wrap}
.vt-al{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vt-al span{font:500 12.5px/1 'Outfit',sans-serif;color:var(--label);padding:5px 10px;border-radius:99px;background:#f1ebdf}
.vt-es{display:flex;flex-direction:column;gap:8px;border-top:1px solid #ebe4d6;padding-top:16px}
.vt-e{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:#f1ebdf;cursor:pointer}
.vt-e:hover{background:#ebe3d4}
.vt-e>i{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.vt-e .t{font:500 14.5px/1.25 'Outfit',sans-serif;color:var(--tx)}
.vt-e .d{font:400 12.5px/1 'Outfit',sans-serif;color:var(--faint)}
.vt-e .w{font:400 13px/1.45 'Outfit',sans-serif;color:var(--label);font-style:italic}

/* ── Collection ── */
.co{display:flex;flex-direction:column;gap:26px}
.co-n{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.co-n div{display:flex;align-items:baseline;gap:8px}
.co-n b{font:400 40px/1 var(--serif);color:var(--tx);font-weight:400}
.co-n span{font:400 16px/1 'Outfit',sans-serif;color:var(--dim)}
.co-n .pbar{width:240px;height:8px}
.co-n .pbar>i{background:linear-gradient(90deg,#2f7a74,#7fc79a)}
.co-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.co-feat{min-height:230px;border-radius:28px;box-shadow:inset 0 0 60px #07252a;background:radial-gradient(ellipse at 65% 50%,#2a7d78 0%,#1a5c60 45%,#0f3b41 100%)}
.co-feat .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0b2f35ee 0%,#0b2f3588 40%,#0b2f3500 65%);z-index:6}
.co-feat .cp{position:absolute;left:32px;top:30px;bottom:30px;z-index:7;display:flex;flex-direction:column;justify-content:space-between;max-width:330px;gap:16px}
.co-feat .ey{color:#9fc2bb;letter-spacing:.16em;font-size:11px}
.co-feat .nm{font:400 34px/1 var(--serif);color:#fbf8f2}
.co-feat p{margin:0;font:400 15px/1.45 'Outfit',sans-serif;color:#d7e8e3}
.co-feat .pg{display:flex;justify-content:space-between;font:500 13px/1 'Outfit',sans-serif;color:#fbf8f2;margin-bottom:8px}
.co-feat .pg span:last-child{color:#9fc2bb}
.co-feat .pbar{height:8px;background:#ffffff22}
.co-feat .pbar>i{background:linear-gradient(90deg,#9fc2bb,#f7c7a6)}
.co-rar{display:flex;flex-direction:column;gap:14px}
.co-rar .r{display:flex;align-items:center;gap:12px}
.co-rar .r em{width:92px;font:600 12px/1 'Outfit',sans-serif;font-style:normal;padding:6px 10px;border-radius:99px;text-align:center;flex:none}
.co-rar .r .pbar{flex:1;background:#ebe4d6}
.co-rar .r span{font:500 13px/1 'Outfit',sans-serif;color:var(--label);width:52px;text-align:right}
.co-rar .last{margin-top:auto;font:400 13px/1.5 'Outfit',sans-serif;color:var(--dim);padding-top:12px;border-top:1px solid #ebe4d6}
.co-rar .last b{font-weight:600;color:var(--tx)}
.co-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.co-filt{display:flex;gap:4px;background:#ece6d9;padding:4px;border-radius:99px;flex-wrap:wrap}
.co-filt button{font:600 13px/1 'Outfit',sans-serif;padding:9px 16px;border-radius:99px;cursor:pointer;color:var(--dim);background:transparent;border:none}
.co-filt button:hover{background:transparent;color:var(--tx)}
.co-filt button.on{color:var(--tx);background:var(--panel);box-shadow:0 2px 6px rgba(31,46,44,.1)}
.dex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.dx{background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;content-visibility:auto;contain-intrinsic-size:auto 260px}
.dx:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(15,59,65,.14)}
.dx.open{cursor:pointer}
.dx-w{height:150px}
.dx-w.hid{background:radial-gradient(ellipse at 50% 55%,#1d5358 0%,#133f45 60%,#0c2f34 100%)}
.dx-w.fnd{background:radial-gradient(ellipse at 50% 55%,#2a7d78 0%,#175459 60%,#0f3b41 100%)}
.dx-r{position:absolute;left:12px;top:12px;z-index:8;font:600 11px/1 'Outfit',sans-serif;letter-spacing:.04em;padding:5px 9px;border-radius:99px}
.dx-no{position:absolute;right:12px;top:12px;z-index:8;font:500 11.5px/1 'Outfit',sans-serif;color:#cfe9e3}
.dx-q{position:absolute;left:50%;top:78px;transform:translate(-50%,-50%);z-index:6;font:400 22px/1 var(--serif);color:#9fc2bb}
.dx-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.dx-b b{font:400 21px/1.1 var(--serif);font-weight:400}
.dx-b p{margin:0;font:400 13px/1.4 'Outfit',sans-serif;color:var(--dim)}
.dx-b .pg{display:flex;align-items:center;gap:8px}
.dx-b .pg .pbar{flex:1;height:5px;background:#ebe4d6}
.dx-b .pg span{font:500 12px/1 'Outfit',sans-serif;color:var(--faint)}

/* ── narrower windows: the two-column screens stack ── */
@media (max-width:1180px){
  .td-grid{grid-template-columns:minmax(0,1fr)}
  .td-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
  .jr-grid{grid-template-columns:minmax(0,1fr)}
  .jr-left{max-width:560px;width:100%;margin:0 auto}
  .jr-panel{min-height:0}
  .vt-grid{grid-template-columns:minmax(0,1fr)}
  .vt-side{max-height:none}
  .dex{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .ptitle{font-size:38px}
  .td-hero{height:300px;border-radius:26px}
  .td-copy{left:24px;top:28px;right:24px}
  .td-copy .gr{font-size:42px;white-space:normal}
  .td-copy .ln{font-size:15.5px}
  .td-pips{left:24px;bottom:24px}
  .td-catch{padding:20px 14px 16px}
  .cr{padding:12px 8px;gap:12px}
  .cr-rel{display:none}
  .cr-act{opacity:1;pointer-events:auto;position:static;transform:none;box-shadow:none;background:none;padding:0}
  .cr{flex-wrap:wrap}
  .cr-act{flex-basis:100%;padding-left:50px}
  .cr-detail{margin-left:12px}
  .rd{gap:12px;padding:10px 6px}
  .rd-c{display:none}
  .rd-go{display:none}
  .reeds-bed{right:4px}
  .calp{padding:18px 14px 18px;border-radius:24px}
  .lp .nm span{font-size:12px}
  .lp.fl .nm span{font-size:10px}
  .lp .in svg{max-width:24px;max-height:24px}
  .moods5 span{font-size:10px}
  .jr-panel{padding:22px 18px}
  .jr-title{font-size:28px}
  .jr-st{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .jr-st>div{padding:10px}
  .jr-st b{font-size:19px}
  .vt-map{height:440px}
  .vt-hint{display:none}
  .co-top{grid-template-columns:minmax(0,1fr)}
  .co-n{align-items:flex-start}
  .dex{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .dx-b{padding:12px 12px 14px}
  .dx-b b{font-size:17px}
}
/* everything that swims or shimmers stops for reduced motion — the app also
   draws the scenes still (Pond.PF.motion), this catches the CSS-only bits */
@media (prefers-reduced-motion:reduce){
  .lp .orb,.tap-ring,.cr.done .cr-ic{animation:none}
  .dx{transition:none}
  .dx:hover{transform:none}
}

/* ══════════════ Koi Pond · the other tabs ══════════════ */
@keyframes pf-breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.35}50%{transform:translate(-50%,-50%) scale(1.06);opacity:.6}}
.scr{display:flex;flex-direction:column;gap:28px}
.pinput{font:400 17px/1.2 'Outfit',sans-serif;color:var(--tx);background:#f1ebdf;border:1.5px solid transparent;border-radius:16px;padding:16px 18px;outline:none;width:100%}
.pinput:focus{border-color:var(--focus);background:var(--panel);box-shadow:none}
.pinput::placeholder,textarea::placeholder{color:#8f978f}
.tbtn{font:600 14px/1 'Outfit',sans-serif;color:#fbf8f2;background:var(--focus);padding:11px 16px;border-radius:99px;border:none;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:#3a8a83}
.tadd{font:500 13px/1 'Outfit',sans-serif}
/* focus · setup */
.st-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:26px;align-items:start}
.st-form{padding:28px 30px;display:flex;flex-direction:column;gap:26px}

.pk:hover{border-color:#cfc6b4}

.pk-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

.st-pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-pre button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;background:#f1ebdf;color:var(--tx);border:1.5px solid transparent;text-align:left}
.st-pre button:hover{background:#ebe3d4;border-color:transparent}
.st-pre button b{font:600 14px/1 'Outfit',sans-serif}
.st-pre button span{font:400 12.5px/1 'Outfit',sans-serif;opacity:.8}

.st-steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.st-step .l{font:500 14px/1 'Outfit',sans-serif;color:var(--label)}
.st-step>div{display:flex;align-items:center;gap:12px}
.st-step button{width:32px;height:32px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font:500 18px/1 'Outfit',sans-serif;color:var(--tx);padding:0;border:none}

.st-step b{font:400 26px/1 var(--serif);color:var(--tx);min-width:36px;text-align:center;font-weight:400}
.st-step em{font:400 13px/1 'Outfit',sans-serif;font-style:normal;color:var(--faint)}
.st-pond{height:420px;border-radius:28px;background:radial-gradient(ellipse at 55% 55%,#2a7d78 0%,#1a5c60 45%,#0f3b41 100%);box-shadow:inset 0 0 70px #07252a}
/* focus · running */

.rn-ring{position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-205px 0 0 -190px;z-index:6}

/* rain (rain.js): the sky over the session water, the drops, and the page */

.rr-lv button.on{background:#9fd8c8;color:#0f3b41}

<script>
/* ═══════════════ store ═══════════════ */
/* One-time move from the old storage names (radhelabs.*) to catchingdays.*.
   Copies each value across, checks the copy, and only then removes the old key,
   so nothing is lost if storage is full or the page closes half way. */
(function(){
  const MOVES=[['radhelabs.focus.v2','catchingdays.app.v2'],
    ['radhelabs.focus.v2.unreadable','catchingdays.app.v2.unreadable'],
    ['radhelabs.sync.cfg','catchingdays.sync.cfg'],
    ['radhelabs.sync.base','catchingdays.sync.base'],
    ['radhelabs.sync.bannerDismissed','catchingdays.sync.bannerDismissed'],
    ['radhelabs.sync.api','catchingdays.sync.api']];
  try{
    for(const [from,to] of MOVES){
      const v=localStorage.getItem(from);
      if(v===null) continue;
      if(localStorage.getItem(to)===null){
        localStorage.setItem(to,v);
        if(localStorage.getItem(to)!==v) continue;
      }
      localStorage.removeItem(from);
    }
  }catch(e){}
})();
const clone=o=>typeof structuredClone==='function'?structuredClone(o):JSON.parse(JSON.stringify(o));
const KEY='catchingdays.app.v2';
/* Journal entry types. 'daily' is special: its mood colors the calendar cell.
   'study' is what auto-generated session write-ups get tagged with. Both are
   builtin and can't be deleted; everything else is the user's to manage. */
const DIARY_TAGS_DEFAULT=[
  {id:'daily',   name:'Daily',       hex:'#4f86b3', builtin:true},
  {id:'study',   name:'Study Block', hex:'#715c95', builtin:true},
  {id:'bio',     name:'Bio',         hex:'#a8762f', builtin:true},
  {id:'fitness', name:'Fitness',     hex:'#3f774d'},
  {id:'rant',    name:'Rant',        hex:'#a96464'},
];
const MAX_JOURNAL_TEMPLATES=5;

/* Spanish course progress. Only PROGRESS lives here — the course content itself
   (units, ~5 000 questions, vocab, cards) is static and fetched read-only from
   spanish-course/data/, never stored in db. See spanish-course/03-SCHEMA.md. */
const blankStudy={
  v:1, startedAt:null, currentUnit:'U1',
  vocab:{},        // vocabId -> {s:0-5, streak, prod:bool, seen, last}
  gp:{},           // GPid    -> {attempts, recent:[1,0,…] last 10, newest last}
  verbs:{},        // "infinitive|tense|person" -> {n, ok}
  cards:{},        // cardId  -> {seen, noteOpened, reopenedOnWrong}
  units:{},        // unitId  -> {lessons:{lessonId:true}, checkpoint:{best, passedAt}}
  exams:{},        // levelId -> {best, passedAt, lastFail}
  watch:{},        // watchId -> {done, at, minutes, eps, rewatch}
  custom:[],       // things watched that aren't on the list
  sessions:[],     // {at, mode, n, ok, unit, ms} — capped, older folded into agg
  agg:{n:0, ok:0, ms:0, days:[]},
  wrongQueue:[],   // question ids missed, re-injected into later sessions
  wqStreak:{},     // questionId -> consecutive corrects since it was queued (leaves at 2)
  /* teachLang is which language EXPLAINS things — rule lines, notes, feedback.
     The material itself (prompts, examples, vocabulary, audio) is always
     Spanish; that's the point. English is the default because you cannot learn
     ser vs estar from a paragraph written in Spanish you can't read yet.
     Worth flipping to 'es' around B1, when reading the explanation is itself
     useful practice. */
  settings:{tts:true, ttsRate:0.9, strictAccents:false, voice:'es-MX', teachLang:'en'}};

/* ── Bio ──
   A structured record of who you are, kept so an AI can answer questions about
   you (applications, cover letters, "which of my projects fits this?") without
   you re-typing your life every time.

   Categories are data, not code: each one names a `kind` that decides which
   fields its form shows. Four kinds cover everything without a field explosion
   — roles have orgs and dates and achievements, people have relationships,
   possessions have details, and everything else is just a title and notes. Add
   your own categories freely; they only have to pick one of these four shapes. */
const BIO_KINDS={
  role  :{fields:['org','role','dates','bullets','link']},
  person:{fields:['org','relation']},
  thing :{fields:['org','link']},
  plain :{fields:[]}
};
const BIO_CATS_DEFAULT=[
  {id:'work'  ,name:'Work Experience'    ,kind:'role'  ,icon:'💼'},
  {id:'proj'  ,name:'Projects'           ,kind:'role'  ,icon:'🛠'},
  {id:'club'  ,name:'Clubs & Orgs'       ,kind:'role'  ,icon:'🏛'},
  {id:'extra' ,name:'Extracurriculars'   ,kind:'role'  ,icon:'✨'},
  {id:'sport' ,name:'Sports'             ,kind:'role'  ,icon:'🏅'},
  {id:'award' ,name:'Awards & Honors'    ,kind:'role'  ,icon:'🏆'},
  {id:'skill' ,name:'Skills'             ,kind:'plain' ,icon:'⚡'},
  {id:'hobby' ,name:'Hobbies & Interests',kind:'plain' ,icon:'🎨'},
  {id:'people',name:'People'             ,kind:'person',icon:'👥'},
  {id:'own'   ,name:'Possessions'        ,kind:'thing' ,icon:'📦'},
  {id:'misc'  ,name:'Other'              ,kind:'plain' ,icon:'📌'}
];
/* 'dislike' sits in the same list as the rest: you asked to record it, and an
   assistant that knows who you avoid gives better advice. It just defaults to
   sensitive so it can never ride along into an application export. */
const BIO_RELATIONS=[['close','Close friend'],['friend','Friend'],['family','Family'],
  ['partner','Partner'],['mentor','Mentor'],['teacher','Teacher / professor'],
  ['colleague','Colleague'],['classmate','Classmate'],['acquaintance','Acquaintance'],
  ['dislike','Dislike / avoid']];
const relName=r=>((BIO_RELATIONS.find(x=>x[0]===r)||[])[1])||'';
/* How a category is drawn, separate from its kind (which only decides the
   form's fields). Optional per category as `view`; bioView() picks one from
   the kind and the name when it's unset. */
const BIO_VIEWS={
  timeline:'Timeline',
  orbit   :'Circle',
  people  :'Cards',
  shelf   :'Posters',
  tiles   :'Tiles',
  chips   :'Chips',
  gallery :'Gallery',
  list    :'List'
};
/* The circle's rings, innermost first. Every relationship lands on exactly
   one ring except 'dislike', which is kept out of the circle altogether. */
const BIO_TIERS=[
  {id:'t0',name:'Partner & family', rel:['partner','family'],c:'#d9788a',bg:'#fbe8ec',tx:'#8e3a4c'},
  {id:'t1',name:'Close friends',    rel:['close'],           c:'#d6a03a',bg:'#fbf1db',tx:'#7d5a14'},
  {id:'t2',name:'Friends & mentors',rel:['friend','mentor'], c:'#6fb07d',bg:'#e5f3e8',tx:'#2f6b40'},
  {id:'t3',name:'Everyone else',    rel:null,                c:'#7f9dbd',bg:'#e7eef6',tx:'#3f5a78'}
];
const BIO_AVOID={c:'#b27575',bg:'#f7e6e6',tx:'#8a3d3d'};
const bioTier=r=>r==='dislike'?null:(BIO_TIERS.find(t=>t.rel&&t.rel.includes(r))||BIO_TIERS[3]);

/* v3 added settings.urgency + exams[]. Nothing branches on `v` yet — when a
   future change actually needs a migration, switch on it here. */
const blank={v:3,settings:{focus:25,brk:5,sound:true,notify:false,tz:'America/New_York',goal:120,pondMotion:true,
    urgency:{wDue:40,wWork:25,wImp:20,wProc:15,capHrsPerDay:3}},
  classes:[],assignments:[],sessions:[],active:null,lastExport:null,lastSync:null,lastImport:null,lastBackup:null,
  loads:0,firstRun:null, motivationVisual:'plant',
  journeys:[], diary:[], stickies:[], exams:[], study:clone(blankStudy),
  /* Tasks you've hand-picked onto a given day, keyed 'YYYY-MM-DD' -> [asgId].
     Deliberately NOT the task's due date: pulling something into today is a
     plan for today, not a promise to the world that the deadline moved. The
     real due date stays untouched, so urgency and overdue stay honest. */
  dailyPicks:{}, countdowns:[],
  activeCourse:'es', courses:{},
  bio:{profile:{},entries:[],cats:clone(BIO_CATS_DEFAULT)},
  journalTags:clone(DIARY_TAGS_DEFAULT), journalTemplates:[], onboarded:false,
  /* Journal vault: topics + the tags and links around entries (see ensureVault) */
  vaultTopics:[], vaultTags:[], vaultLinks:[],
  /* The pond's own memory (see ensurePond). Almost everything about the

function blankCourseProgress(){ return {v:1,startedAt:null,currentUnit:null,

   missing on every existing save. Merge them back, one level deep.
   Every load path funnels through here: boot()'s two branches, adoptFromFile()

function ensureSettings(d){
  d.settings=Object.assign(clone(blank.settings),d.settings||{});

/* Same contract as ensureStudy: a save written before Bio existed, or one
   half-written, comes back up to the current shape without losing anything.
   Categories merge by id rather than being replaced, so defaults you never
   touched keep arriving while your own edits and additions survive. */
function ensureBio(d){
  const b=Object.assign({profile:{},entries:[],cats:[]},d.bio||{});
  if(!b.profile||typeof b.profile!=='object') b.profile={};
  if(!Array.isArray(b.entries)) b.entries=[];
  if(!Array.isArray(b.cats)||!b.cats.length) b.cats=clone(BIO_CATS_DEFAULT);
  BIO_CATS_DEFAULT.forEach((c,i)=>{ if(!b.cats.some(x=>x.id===c.id)) b.cats.splice(i,0,{...c}); });
  b.cats.forEach(c=>{

    if(c.view&&!BIO_VIEWS[c.view]) delete c.view;
    if(c.side&&c.side!=='career'&&c.side!=='life') delete c.side;

     something under it before the two synced, that entry would belong to no
     category and silently vanish from the page, so it lands in Other. */
  const ids=new Set(b.cats.map(c=>c.id));
  b.entries.forEach(e=>{ if(!ids.has(e.cat)) e.cat='misc'; });

/* Backfill one entry. Separate so anything minting an entry from outside the
   form (an import, a future agent path) lands on the same shape. */
function fixBioEntry(e){
  if(!e.id) e.id=uid();

  if(!Array.isArray(e.bullets)) e.bullets=[];
  ['title','cat','org','role','relation','start','end','link','notes','img'].forEach(k=>{

/* Intl.DateTimeFormat construction is genuinely expensive — roughly 0.1ms each
   — and these formatters were being rebuilt on every single call. One render of
   the assignment list was constructing ~874 of them (measured), which was most
   of that render's ~100ms. The objects are immutable and reusable, so cache
   them per (timezone + options). Keyed on TZ() so changing the timezone in
   Settings still takes effect immediately. */
const _iFCache=new Map();
const iF=(o)=>{
  const k=TZ()+'|'+JSON.stringify(o||{});
  let f=_iFCache.get(k);
  if(!f){
    try{ f=new Intl.DateTimeFormat('en-US',{timeZone:TZ(),...o}); }
    catch(e){ f=new Intl.DateTimeFormat('en-US',o); }
    _iFCache.set(k,f);
  }
  return f;
};
/* Dates read like a person wrote them: "August 8th, 2026", never 08/08/26. */
const MONTH_NAMES=['January','February','March','April','May','June','July',

function ord(n){ n=+n;
  if(n%100>=11&&n%100<=13) return n+'th';
  return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th'); }
const dParts=ts=>{ const p={};
  iF({weekday:'long',month:'long',day:'numeric',year:'numeric'}).formatToParts(ts)
    .forEach(x=>p[x.type]=x.value); return p; };
const fDate =ts=>{ const p=dParts(ts); return `${p.month} ${ord(p.day)}, ${p.year}`; };
const fDay  =ts=>{ const p=dParts(ts); return `${p.weekday}, ${p.month} ${ord(p.day)}`; };
const fMD   =ts=>{ const p=dParts(ts); return `${p.month.slice(0,3)} ${ord(p.day)}`; };
const fTime =ts=>iF({hour:'numeric',minute:'2-digit'}).format(ts);
const fExact=ts=>{ const p=dParts(ts);
  return `${p.month} ${ord(p.day)}, ${p.year} at `+
    iF({hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(ts); };
const fStamp=ts=>{ const p=dParts(ts);
  return `${p.month} ${ord(p.day)}, ${p.year} at `+
    iF({hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'}).format(ts); };
const fWk   =ts=>iF({weekday:'short'}).format(ts);

/* 'YYYY-MM-DD' is a plain calendar date — format it literally, never through
   a Date object, or it shifts a day depending on the zone. */
function dDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return '';
  return `${MONTH_NAMES[+m[2]-1]} ${ord(+m[3])}, ${m[1]}`; }
function dShort(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return '';
  return `${MONTH_NAMES[+m[2]-1].slice(0,3)} ${ord(+m[3])}`; }
function dDayName(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return '';
  const w=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][
    new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay()];
  return `${w}, ${MONTH_NAMES[+m[2]-1]} ${ord(+m[3])}, ${m[1]}`; }
/* "Wed, Sep 30" — for tight labels */
function dMini(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return '';
  return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][weekdayOf(s)]}, ${MONTH_NAMES[+m[2]-1].slice(0,3)} ${+m[3]}`; }
function dDelta(s){                       // whole days from today, in your zone
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return null;
  const t=/^(\d{4})-(\d{2})-(\d{2})$/.exec(today());
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(+t[1],+t[2]-1,+t[3]))/DAY); }
function dRel(s){ const d=dDelta(s); if(d===null) return '';
  return d===0?'Today':d===1?'Tomorrow':d===-1?'Yesterday'
    :d<0?`${-d} days overdue`:d<7?`in ${d} days`
    :d<14?'next week':`in ${Math.round(d/7)} weeks`; }
const etHour=ts=>+iF({hour:'2-digit',hour12:false}).format(ts)%24;
/* Same caching story as iF() above — dayKey() is the single hottest date helper
   in the app, because every dDelta() calls today() calls dayKey(). */
let _dkFmt=null, _dkTz=null;
function dayKey(ts){
  try{
    const tz=TZ();
    if(!_dkFmt||_dkTz!==tz){ _dkTz=tz; _dkFmt=new Intl.DateTimeFormat('en-CA',{timeZone:tz}); }
    return _dkFmt.format(ts);

/* today() was being recomputed hundreds of times per render — once for every
   dDelta(), i.e. once per assignment row and twice per sort comparison. It can
   only change at midnight, so recompute at most once a minute (and immediately
   if the timezone changed). Worst case the date is up to 60s stale right at
   midnight, which is invisible for a value that only names a calendar day. */
let _todayVal='', _todayKey='';
const today=()=>{
  const k=TZ()+'|'+Math.floor(Date.now()/60000);
  if(k!==_todayKey){ _todayKey=k; _todayVal=dayKey(Date.now()); }
  return _todayVal;
};

/* pure calendar-date math on 'YYYY-MM-DD' strings — always via Date.UTC,
   never through TZ()/dayKey(), same reasoning as dDayName above. */
function ymd(u){ const d=new Date(u); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
function addDays(dk,n){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dk); return ymd(Date.UTC(+m[1],+m[2]-1,+m[3])+n*DAY); }
function weekdayOf(dk){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dk); return new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay(); }

function daysBetween(from,to){
  const p=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null; };
  const a=p(from), b=p(to);
  return (a===null||b===null)?null:Math.round((b-a)/DAY);

  db.sessions.forEach(s=>{ if(dayKey(s.started)===dk) ms+=summarize(s).net; });
  return Math.max(0,ms);
}
function todayNetFocusMs(){ return netFocusMsOn(today()); }

/* ═══════════════ RULES ═══════════════
   ratio r        = break ÷ focus, fixed at session start
   break earned   = actual focus × r      (over → longer break, early → shorter)
   break overrun  = actual break − earned, when positive. Shown as negative time.
                    Never added to focus. Tallied and subtracted at the end:
   net focus      = raw focus − break overrun
   session rating = mean of cycle focus ratings, /5
   Every completion is stamped with an exact epoch timestamp, rendered in your TZ.
─────────────────────────────────── */

let A=null, tick=null, beeped=false;
const elapsed=()=>A.paused?A.pausedAt-A.phaseStart-A.pausedMs:Date.now()-A.phaseStart-A.pausedMs;

  imp:o.imp||0, assignedDate:o.assignedDate||'', subs:[], log:[],
  done:false,doneAt:null,doneSession:null,doneCycle:null,created:Date.now(),logged:0,notes:'',
  habitId:o.habitId||null,journeyId:o.journeyId||null,habitOutcome:null,
  /* An announcement is a dated thing you want in front of you — "Microsoft
     internships open" — not work you finish. It shows on Daily and Tasks, but
     has no checkbox and cannot be completed; you delete it when it stops
     mattering. It's an assignment field rather than its own collection so it
     inherits dating, grouping, search and rendering for free. */
  ann:!!o.ann}; }
const fix=a=>{ a.subs=a.subs||[]; a.log=a.log||[]; a.imp=a.imp||0;
  if(a.assignedDate===undefined) a.assignedDate='';                  // v3 rows
  if(a.habitId===undefined) a.habitId=null; if(a.journeyId===undefined) a.journeyId=null;
  if(a.habitOutcome===undefined) a.habitOutcome=null;
  if(a.ann===undefined) a.ann=false;                                 // pre-announcement rows
  return a; };                                                       // v2 rows

/* exams — a parallel collection to assignments, deliberately not merged into
   db.assignments: they have their own fields (confidence, reviewTasks) and
   their own urgency formula, and mixing them would complicate every existing
   assignment query for no gain. */
function newExam(o){ return {id:uid(),title:o.title,classId:o.classId||null,
  examDate:o.examDate||'', confidence:o.confidence||0, reviewTasks:[], log:[], notes:'',
  kind:o.kind||'exam',                    // 'quiz' | 'exam' — drives the badge
  done:false,doneAt:null,created:Date.now()}; }
/* Everything already in db.exams predates the quiz/exam split, so infer the
   kind from the title once. Titles here are things like "Quiz 3 (Lessons 7-9)"
   and "Wk2 Pre-Recitation Quiz", so the word is a reliable signal — and the
   value is stored, so a wrong guess is a one-click fix that then sticks. */
const fixExam=e=>{ e.reviewTasks=e.reviewTasks||[]; e.log=e.log||[]; e.confidence=e.confidence||0;
  e.notes=e.notes||'';
  if(!e.kind) e.kind=/\bquiz\b/i.test(e.title||'')?'quiz':'exam';
  return e; };

   fixExam() yet (or carries a value from a future version) must not crash a

   Tasks and exams live in separate collections (they have genuinely different
   fields — confidence and review checklists vs. estimates and subtasks) but
   they're shown together, because "what's coming up" doesn't care which table
   a row came from. These accessors are the seam that lets one render path
   handle both without merging the storage. */

const isAnn   = x=>!!x && x.ann===true;

   denominator would make 100% unreachable. Everything that measures progress

/* ── countdowns ──
   db.countdowns holds ids you've explicitly pinned (tasks OR exams). With
   nothing pinned it falls back to the single nearest upcoming exam/quiz, so
   the strip is useful before you've configured anything. */
const isPinned=id=>((db.countdowns)||[]).includes(id);
function toggleCountdown(id){
  db.countdowns=db.countdowns||[];
  const i=db.countdowns.indexOf(id);
  if(i<0) db.countdowns.push(id); else db.countdowns.splice(i,1);
  save(); repaint();
}
function countdownItems(){
  const t=today();
  const pinned=((db.countdowns)||[]).map(anyItem).filter(Boolean).map(x=>isExam(x)?fixExam(x):x)
    .filter(x=>!x.done && itemDate(x) && !inArchivedCls(x));
  if(pinned.length) return pinned.sort((a,b)=>itemDate(a).localeCompare(itemDate(b)));
  const next=(db.exams||[]).map(fixExam)
    .filter(e=>!e.done && e.examDate && e.examDate>=t && !clsArchived(e.classId))
    .sort((a,b)=>a.examDate.localeCompare(b.examDate))[0];
  return next?[next]:[];
}

/* ═══════════════ do-score — urgency engine ═══════════════
   0–100, higher = do it sooner. Four named components, each 0–100, combined
   as a weighted average whose weights live in db.settings.urgency. A component
   whose input is missing returns null and drops out, and the remaining weights
   renormalize — a missing due date shouldn't read as "not urgent", it should
   read as "we can't say from that signal".
   Never stored on the record: always computed at render time so it tracks the
   clock without anything needing to invalidate it. */
const DUE_HALF_LIFE_DAYS=3;

function duePressure(d,half){                  // d = days left (dDelta)
  if(d===null||d===undefined) return null;
  if(d<=0) return 100;
  return Math.round(100/(1+d/(half||DUE_HALF_LIFE_DAYS)));
}
function workloadPressure(a,d,capHrsPerDay){   // hrs/day the deadline implies
  if(!a.est||d===null||d===undefined) return null;
  const doneFrac=a.subs.length?a.subs.filter(s=>s.done).length/a.subs.length:0;
  const remainMin=a.est*(1-doneFrac);
  const daysLeft=Math.max(d,1/24);             // floor at an hour: spikes, never divides by zero
  const hrsPerDay=(remainMin/60)/daysLeft;
  return Math.round(Math.min(100,hrsPerDay/(capHrsPerDay||3)*100));
}
const IMP_URGENCY=[50,10,30,50,75,100];        // index by imp; 0 (unset) reads neutral, not lowest
function importancePressure(a){ return IMP_URGENCY[a.imp||0]; }
function procrastinationPressure(a){
  if(!a.assignedDate||!a.due) return null;
  const totalDays=daysBetween(a.assignedDate,a.due);
  const elapsedDays=daysBetween(a.assignedDate,today());
  if(totalDays===null||elapsedDays===null) return null;
  const elapsedFrac=Math.min(1,Math.max(0,elapsedDays)/Math.max(1,totalDays));
  const started=a.logged>0||a.subs.some(s=>s.done)||a.log.length>0;
  return Math.round(100*elapsedFrac*(started?0.35:1));   // started = ice broken, stop shouting
}

function doScore(a){
  if(!a||a.done) return null;
  fix(a);
  const d=a.due?dDelta(a.due):null;
  if(d!==null&&d<0) return 100;                // overdue is a hard override, not an average
  const w=(db.settings&&db.settings.urgency)||blank.settings.urgency;
  const parts=[
    [duePressure(d),w.wDue],
    [workloadPressure(a,d,w.capHrsPerDay),w.wWork],
    [importancePressure(a),w.wImp],
    [procrastinationPressure(a),w.wProc],
  ].filter(([v,wt])=>v!==null&&v!==undefined&&wt>0);
  if(!parts.length) return null;
  const totalW=sum(parts,p=>p[1]);
  return totalW?Math.round(sum(parts,p=>p[0]*p[1])/totalW):null;
}

const CONF_URGENCY=[50,100,75,50,25,0];        // inverted: Not ready = urgent, Ready = calm
function examScore(e){
  if(!e) return null;
  fixExam(e);
  if(e.done) return null;
  const d=e.examDate?dDelta(e.examDate):null;
  if(d!==null&&d<0) return null;               // §3.5 — past-due prompts, never scores 100 forever
  const total=e.reviewTasks.length;
  const review=total?Math.round(100*(1-e.reviewTasks.filter(t=>t.done).length/total)):50;
  // v1: fixed weights, revisit if this needs its own Settings section
  const parts=[[duePressure(d),40],[review,30],[CONF_URGENCY[e.confidence||0],30]]
    .filter(([v])=>v!==null&&v!==undefined);
  if(!parts.length) return null;
  const totalW=sum(parts,p=>p[1]);
  return totalW?Math.round(sum(parts,p=>p[0]*p[1])/totalW):null;
}

function doBadge(score){
  if(score==null) return '';
  const c = score>=80?'#a96464' : score>=55?'#c9a227' : score>=30?'#4f86b3' : '#7a8189';
  return `<span class="pill sub" style="color:${c};border-color:${c}55;background:${c}18" title="Do score — how urgent this is right now">${score}</span>`;
}

/* subtasks */
function subToggle(aid,sid,on){
  const a=asg(aid); if(!a) return; fix(a);
  const s=a.subs.find(x=>x.id===sid); if(!s) return;
  const subtaskPrevious={done:s.done,doneAt:s.doneAt};
  s.done=on; s.doneAt=on?Date.now():null;
  // finishing the last subtask finishes the assignment
  if(a.subs.length&&a.subs.every(x=>x.done)&&!a.done)
    toggleAsg(aid,true,A?A.id:null,A?A.cycles.length+(A.phase==='break'?0:1):null,{subtaskId:s.id,subtaskPrevious});
  else if(a.done&&!on) toggleAsg(aid,false);
  save(); repaint();
}
function subAdd(aid,text){
  const a=asg(aid); if(!a||!text.trim()) return; fix(a);
  a.subs.push({id:uid(),text:text.trim(),done:false,doneAt:null,created:Date.now()});
  save(); repaint();
}
function subDel(aid,sid){ const a=asg(aid); if(!a) return; fix(a);
  a.subs=a.subs.filter(x=>x.id!==sid); save(); repaint(); }
const subProg=a=>{ fix(a); return a.subs.length?a.subs.filter(s=>s.done).length+'/'+a.subs.length:''; };

/* earliest timestamp of any real work on an assignment: a session that had it
   selected, a checked subtask, or a note written against it. null = never
   touched. Powers the start-lag / crunch-rate stats. */
function firstWorkedAt(aid){
  const a=asg(aid); if(!a) return null; fix(a);
  const candidates=[];
  db.sessions.forEach(s=>{ if(s.assignmentIds&&s.assignmentIds.includes(aid)) candidates.push(s.started); });
  a.subs.forEach(s=>{ if(s.doneAt) candidates.push(s.doneAt); });
  a.log.forEach(n=>{ if(n.at) candidates.push(n.at); });
  return candidates.length?Math.min(...candidates):null;
}

      clsName(x.classId).localeCompare(clsName(y.classId))||(y.confidence||0)-(x.confidence||0)||x.created-y.created);

    <div class="daydiv" style="--dc:${col}">
      <span class="dt"${tone==='over'||tone==='today'?` style="color:${col}"`:''}>${k?dDayName(k):'No date set'}</span>

      <span class="dm">${rows.length} exam${rows.length===1?'':'s'}</span>
    </div>
    ${rows.map(examRow).join('')}`;
  }).join('');

  return `
  ${hero?`<div class="card" style="margin-bottom:14px;background:var(--goalbg);border-color:var(--renameline)">
    <span class="lbl" style="color:var(--activetx)">Next exam</span>
    <div class="row sp wrapf" style="gap:10px;align-items:flex-end">
      <div>
        <div style="font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2">${esc(hero.title)}</div>
        <div class="dim" style="font-size:12.5px;margin-top:3px">${dDayName(hero.examDate)}${
          hero.classId?` · ${esc(clsName(hero.classId))}`:''}</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:var(--serif);font-size:22px;font-weight:600;color:var(--activetx)">${dRel(hero.examDate)}</div>
        ${revProg(hero)?`<div class="faint" style="font-size:11.5px">${revProg(hero)} reviewed</div>`:''}
      </div>
    </div>
  </div>`:''}

  <div class="card">
    <div class="row sp wrapf" style="margin-bottom:13px;gap:9px">
      <div class="row wrapf" style="gap:6px">
        <button class="chip ${examFilter==='upcoming'?'on':''}" onclick="examFilter='upcoming';paintAsg()">Upcoming (${upcoming.length})</button>
        <button class="chip ${examFilter==='past'?'on':''}" onclick="examFilter='past';paintAsg()">Past (${past.length})</button>
      </div>
      <button class="sm primary" onclick="examModal()">+ Exam</button>
    </div>
    ${list.length?grouped:`<p class="empty">${examFilter==='upcoming'
      ?'No exams scheduled — add one and it starts counting down.'
      :'Nothing taken yet.'}</p>`}
  </div>`;
}

/* ═══════════════ IMPORT — parsers ═══════════════
   Accepts, in order of detection: JSON (incl. Google Tasks API shapes),
   CSV/TSV, then freeform syllabus text. Every path yields the same row:
   { title, cls, est (minutes), due ('YYYY-MM-DD'), notes }
──────────────────────────────────────────────── */
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const pad2=n=>String(n).padStart(2,'0');

function normDue(v){
  if(v==null||v==='') return '';
  if(typeof v==='number') v=new Date(v).toISOString();
  v=String(v).trim(); if(!v) return '';
  // ISO / RFC3339. Google Tasks stores due as UTC midnight — take the date part
  // verbatim, never convert, or every due date slides back a day.
  let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=v.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(m){ let y=m[3]?+m[3]:new Date().getFullYear(); if(y<100) y+=2000;
    if(+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31) return `${y}-${pad2(+m[1])}-${pad2(+m[2])}`; }
  // (?!\d) or "Aug 2026" parses its year as the day and lands on the 20th
  m=v.match(/\b([a-z]{3,9})\.?\s+(\d{1,2})(?!\d)(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?/i);
  if(m){ const mo=MONTHS[m[1].slice(0,3).toLowerCase()];
    if(mo&&+m[2]>=1&&+m[2]<=31){ const y=m[3]?+m[3]:new Date().getFullYear(); return `${y}-${pad2(mo)}-${pad2(+m[2])}`; } }
  m=v.match(/\b(\d{1,2})\s+([a-z]{3,9})\.?(?:,?\s*(\d{4}))?/i);
  if(m){ const mo=MONTHS[m[2].slice(0,3).toLowerCase()];
    if(mo){ const y=m[3]?+m[3]:new Date().getFullYear(); return `${y}-${pad2(mo)}-${pad2(+m[1])}`; } }
  return '';
}
function normEst(v){
  if(typeof v==='number') return Math.max(0,Math.round(v));
  if(!v) return 0;
  const s=String(v).toLowerCase();
  let m=s.match(/(\d+(?:\.\d+)?)\s*(?:h\b|hr|hour)/); if(m) return Math.round(parseFloat(m[1])*60);
  m=s.match(/(\d+)\s*(?:m\b|min)/);                   if(m) return +m[1];
  m=s.match(/^\s*(\d+)\s*$/);                          return m?+m[1]:0;
}
const isDone=o=>o.status==='completed'||o.completed===true||o.done===true||o.state==='done';
function normImp(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return Math.max(0,Math.min(5,Math.round(v)));
  const s=String(v).trim().toLowerCase();
  if(/^\d$/.test(s)) return Math.max(0,Math.min(5,+s));
  if(/^!+$/.test(s)) return Math.min(5,s.length+2);
  return {critical:5,urgent:5,highest:5,high:4,important:4,normal:3,medium:3,med:3,
          low:2,minor:2,whenever:1,someday:1,none:0}[s]??0;
}
function normSubs(v){
  if(!Array.isArray(v)) return [];
  return v.map(s=>{
    const text=typeof s==='string'?s:(s.text||s.title||s.name||'');
    if(!String(text).trim()) return null;
    const done=typeof s==='object'&&isDone(s);
    return {id:uid(),text:String(text).trim(),done,doneAt:done?Date.now():null,created:Date.now()};
  }).filter(Boolean);
}

function rowsFromJSON(data){
  const out=[];
  const one=(o,cls)=>{
    if(typeof o==='string'){ if(o.trim()) out.push({title:o.trim(),cls,est:0,due:'',notes:''}); return; }
    if(!o||typeof o!=='object') return;
    if(isDone(o)) return;                                   // already finished elsewhere
    const title=o.title||o.name||o.task||o.assignment||o.text||o.summary||'';
    if(!String(title).trim()) return;
    out.push({ title:String(title).trim(),
      cls:String(o.class||o.klass||o.course||o.subject||o.category||o.list||o.listTitle||o.project||cls||'').trim(),
      est:normEst(o.est??o.estimate??o.estMinutes??o.est_minutes??o.minutes??o.duration??0),
      due:normDue(o.due??o.dueDate??o.due_date??o.deadline??o.date??''),
      assigned:normDue(o.assigned??o.assignedDate??o.assigned_date??o.startDate??o.start??''),
      imp:normImp(o.imp??o.importance??o.priority??o.pri??o.urgency??0),
      subs:normSubs(o.subs||o.subtasks||o.sub_tasks||o.steps||o.children||o.items),
      notes:String(o.notes||o.note||o.description||'').trim() });
  };
  const many=(arr,cls)=>Array.isArray(arr)&&arr.forEach(o=>one(o,cls));
  // an array where every entry carries its own item list is a list of lists
  const isLists=a=>Array.isArray(a)&&a.length&&a.every(o=>o&&typeof o==='object'&&
    (Array.isArray(o.items)||Array.isArray(o.tasks))&&(o.title||o.name));
  if(isLists(data)) data.forEach(L=>many(L.items||L.tasks,L.title||L.name||''));
  else if(Array.isArray(data)) many(data,'');
  else if(Array.isArray(data.lists))  data.lists.forEach(L=>many(L.items||L.tasks||L.assignments||[],L.title||L.name||''));
  else if(Array.isArray(data.items))  many(data.items,data.title||data.list||'');   // Google Tasks API
  else if(Array.isArray(data.tasks))  many(data.tasks,data.title||'');
  else if(Array.isArray(data.assignments)) many(data.assignments,'');
  else Object.entries(data).forEach(([k,v])=>{ if(Array.isArray(v)) many(v,k); });   // {"AP Chem":[...]}
  return out;
}

function splitCSV(line){
  const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(c==='"'){q=false;} else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c==='\t'){ out.push(cur); cur=''; }
    else cur+=c; }
  out.push(cur); return out.map(s=>s.trim());
}
function rowsFromCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return null;
  const head=splitCSV(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z]/g,''));
  const col=(...ns)=>head.findIndex(h=>ns.includes(h));
  const iT=col('title','task','assignment','name','item'),
        iC=col('class','course','subject','category','list','project'),
        iE=col('est','estimate','estminutes','minutes','duration','time'),
        iD=col('due','duedate','deadline','date'),
        iN=col('notes','note','description');
  if(iT<0) return null;
  return lines.slice(1).map(l=>{ const p=splitCSV(l);
    if(!p[iT]) return null;
    return { title:p[iT], cls:iC>=0?(p[iC]||''):'', est:iE>=0?normEst(p[iE]):0,
             due:iD>=0?normDue(p[iD]):'', notes:iN>=0?(p[iN]||''):'' };
  }).filter(Boolean);
}

function rowsFromText(text){
  const out=[]; let ctx='';
  const L=text.split(/\r?\n/);
  const bullet=s=>/^\s*(?:[-*•·–—]|\d+[.)]|\[[ xX]\])\s+/.test(s);
  const indent=s=>/^(?:\s{2,}|\t)/.test(s);

  L.forEach((raw,i)=>{
    if(!raw.trim()) return;
    let t=raw.trim();

    // ── running class context ──
    let h=t.match(/^#{1,6}\s+(.+?)\s*:?\s*$/);              // ## AP Chemistry
    if(h){ ctx=h[1].trim(); return; }
    if(!bullet(raw)){
      h=t.match(/^([^|#\[\]:]{2,42}):\s*$/);                // AP Chemistry:
      if(h){ ctx=h[1].trim(); return; }
      // a bare short line is a header only if what follows is a list under it
      if(!indent(raw)&&t.length<=42&&!/[.,;|]$/.test(t)&&!/\d{1,2}[\/:]/.test(t)){
        const nxt=L.slice(i+1).find(x=>x.trim());
        if(nxt&&(bullet(nxt)||indent(nxt))){ ctx=t.replace(/:$/,'').trim(); return; }
      }
    }

    if(/^\s*(?:[-*•·–—]\s*)?\[[xX]\]/.test(raw)) return;    // [x] already done
    t=t.replace(/^(?:[-*•·–—]|\d+[.)])\s*/,'').replace(/^\[\s?\]\s*/,'').trim();
    if(!t) return;
    const indented=indent(raw);

    let cls=ctx, est=0, due='', notes='', imp=0;

    // importance: !!! / !! / ! or !4 — anywhere in the line
    let im=t.match(/(?:^|\s)!([1-5])(?!\d)/);
    if(im){ imp=+im[1]; t=t.replace(im[0],' '); }
    else { im=t.match(/(?:^|\s)(!{1,3})(?=\s|$)/);
      if(im){ imp=Math.min(5,im[1].length+2); t=t.replace(im[0],' '); } }

    if(t.includes('|')){                       // Title | Class | 45m | 2026-08-14
      const p=t.split('|').map(s=>s.trim()).filter(Boolean);
      t=p.shift()||'';
      p.forEach(x=>{ const d=normDue(x), e=normEst(x);
        if(d&&!due) due=d; else if(e&&!est) est=e; else if(!cls||cls===ctx) cls=x; });
    } else {
      // allow the comma in "Sep 4, 2026" but stop at any other comma
      let m=t.match(/\bdue\s*:?\s*((?:[^,;()\[\]|]|,\s*\d{4})+)/i);
      if(m&&normDue(m[1])){ due=normDue(m[1]); t=t.replace(m[0],' '); }
      if(!due){ m=t.match(/[(\[]\s*((?:\d{4}-\d{2}-\d{2})|(?:\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)|(?:[a-z]{3,9}\.?\s+\d{1,2}(?:,?\s*\d{4})?))\s*[)\]]/i);
        if(m&&normDue(m[1])){ due=normDue(m[1]); t=t.replace(m[0],' '); } }
      if(!due){ m=t.match(/[—–-]\s*((?:\d{4}-\d{2}-\d{2})|(?:\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)|(?:[a-z]{3,9}\.?\s+\d{1,2}(?:,?\s*\d{4})?))\s*$/i);
        if(m&&normDue(m[1])){ due=normDue(m[1]); t=t.replace(m[0],' '); } }

      m=t.match(/[~(\[]?\s*(?:est\.?|approx\.?|about)?\s*(\d+(?:\.\d+)?)\s*(h\b|hr?s?\b|hours?\b|m\b|mins?\b|minutes?\b)\s*[)\]]?/i);
      if(m){ est=normEst(m[1]+m[2]); t=t.replace(m[0],' '); }

      m=t.match(/\[([^\]|]{1,42})\]/);                             // [Calc BC] — needs the closing bracket
      if(m){ cls=m[1].trim(); t=t.replace(m[0],' '); }
      else { m=t.match(/(?:^|\s)#([^\s#|\[\]]{1,30})/);            // #Chem — hashtags have no spaces
        if(m){ cls=m[1].trim(); t=t.replace(m[0],' '); }
        else { m=t.match(/\(([^)0-9]{2,42})\)\s*$/);               // trailing (AP Bio)
          if(m){ cls=m[1].trim(); t=t.replace(m[0],' '); }
          else if(!indented){ m=t.match(/^([A-Za-z][\w&+ .]{1,30}):\s+(.+)$/);  // Chem: read ch 7
            if(m){ cls=m[1].trim(); t=m[2]; } } } }
    }
    t=t.replace(/\s{2,}/g,' ').replace(/^[\s,;:–—-]+|[\s,;:–—-]+$/g,'').trim();
    if(t.length<2) return;
    out.push({title:t,cls:cls.trim(),est,due,imp,notes,subs:[]});
  });
  return out;
}

function parseImport(text){
  const s=(text||'').trim();
  if(!s) return {rows:[],fmt:'empty'};
  if(/^[\[{]/.test(s)){
    try{ return {rows:rowsFromJSON(JSON.parse(s)),fmt:'JSON'}; }catch(e){}
    // NDJSON fallback
    const nd=s.split(/\r?\n/).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
    if(nd.length) return {rows:rowsFromJSON(nd),fmt:'JSON lines'};
  }
  const first=s.split(/\r?\n/)[0]||'';
  if(/[,\t]/.test(first)&&/\b(title|task|assignment|name|item)\b/i.test(first)){
    const r=rowsFromCSV(s); if(r&&r.length) return {rows:r,fmt:'CSV'};
  }
  return {rows:rowsFromText(s),fmt:'text'};
}
