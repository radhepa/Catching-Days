/* ═══════════════ server-backed save ═══════════════
   Start Catching Days.bat runs server.py (or server.js), a tiny local server that,
   unlike a plain static server, also accepts POST to write a file into this
   folder. As long as SERVER is true we're talking to it, so focus-data.json
   just IS the save file — no folder picker, no permissions, nothing to
   re-connect on each launch. */
let inboxBusy=false;
async function wFile(name,text){
  if(!SERVER) return false;
  try{ const r=await fetch('/'+name,{method:'POST',body:text}); return r.ok; }
  catch(e){ return false; }
}
async function rFile(name){
  if(!SERVER) return null;
  try{ const r=await fetch('/'+name,{cache:'no-store'});
    if(!r.ok) return null; return await r.text();
  }catch(e){ return null; }
}
async function initServer(){
  if(!SERVER) return;
  const got=await adoptFromFile();            // existing data on disk wins
  await wFile('AGENTS.md',agentBrief());
  if(await rFile('inbox.json')==null) await wFile('inbox.json',JSON.stringify({assignments:[]},null,2));
  rehydrate();  // always — this is what reveals the screen under SERVER, see the boot block below
  // after rehydrate(), db is the real on-disk state, so the digest reflects it
  await wFile('agent-context.md',agentContext());
  await wFile('bio.md',bioMd(true));
  await dailyBackup();
  paintWarn(); paintSyncInfo();
}
/* Once a day, on the first launch, snapshot the database as it stood before
   anything today touched it. focus-data.json is a single file that every save
   overwrites — this is the copy that survives a bad edit or an accidental
   wipe. Cheap: one extra write per day, and only ever writes a full, already
   loaded database. */
async function dailyBackup(){
  if(!SERVER) return;
  const t=today();
  if(db.lastBackup===t) return;
  if(!db.assignments.length&&!db.sessions.length&&!(db.diary||[]).length) return;  // nothing worth keeping yet
  const ok=await wFile('focus-data.backup.json',JSON.stringify(db,null,2));
  if(ok){ db.lastBackup=t; cacheSave(); }
}
async function syncOut(){
  if(!SERVER) return false;
  const ok=await wFile('focus-data.json',JSON.stringify(db,null,2));
  if(ok){ db.lastSync=Date.now(); cacheSave();      // cacheSave, not save — save() re-queues this
    if(cur==='set'){ paintSyncInfo(); paintHealth(); }
    paintWarn(); }
  // Keep the agent digest in step with the real save. Deliberately not
  // awaited and never allowed to affect `ok` — this is a convenience file for
  // an outside reader, and it must never be able to make a real save look
  // like it failed.
  try{ wFile('agent-context.md',agentContext()); }catch(e){}
  try{ wFile('bio.md',bioMd(true)); }catch(e){}
  return ok;
}

/* Under the local server, focus-data.json is the source of truth and always wins
   at startup. The copy the browser keeps in localStorage can be stale (another
   browser has written the file since) or can be a freshly seeded blank database
   with a brand-new timestamp; letting either outrank the file would overwrite
   real data on the next save. */
async function adoptFromFile(){
  if(!SERVER) return 'none';
  const txt=await rFile('focus-data.json');
  if(txt==null) return 'none';
  let f; try{ f=JSON.parse(txt); }catch(e){ return 'bad'; }
  if(!f||!Array.isArray(f.sessions)||!Array.isArray(f.assignments)) return 'bad';
  const loads=db.loads;
  db=ensureSettings(Object.assign(clone(blank),f));
  db.loads=Math.max(loads||0,f.loads||0);
  if(!db.onboarded && (db.classes.length||db.assignments.length||db.sessions.length)) db.onboarded=true;
  CACHE_HIT=true;                     // the file is now our restored copy
  cacheSave();
  return 'loaded';
}
function rehydrate(){
  window.PondEvents?.reconcile();
  clearInterval(tick); tick=null;
  A=db.active||null;
  paintMarks();
  if(db.onboarded){
    $('v-onboard').classList.add('hide'); $('shell').classList.remove('hide');
    /* A live session always wins the boot, whatever tab was last active —
       jump to Focus and sync the nav highlight so it matches what's shown.
       Otherwise just open the current tab normally (Daily on a cold start). */
    if(A){
      cur='run';
      navSync();
      if(A.phase==='rating'&&A.pending){ run(); rateModal(); } else { openSeg(); run(); }
    }
    else tab(cur);
    repaint();
    if(!_helloDay) helloShow();     // once per launch; rehydrate can run twice
  } else {
    $('shell').classList.add('hide'); $('v-onboard').classList.remove('hide');
  }
  paintWarn();
}
async function checkInbox(quiet){
  if(!SERVER||inboxBusy) return; inboxBusy=true;
  try{
    const txt=await rFile('inbox.json');
    if(txt==null){ if(!quiet) toast('No inbox.json in this folder.'); return; }
    /* Journal-vault suggestions ride in the same file under "vault". They get
       their own preview first, and the assignment importer never sees them. */
    let obj=null, rest=txt;
    try{ obj=JSON.parse(txt); }catch(e){}
    if(obj&&typeof obj==='object'&&!Array.isArray(obj)&&'vault' in obj){
      const p=vaultInboxParse(obj.vault);
      if(vaultInboxCount(p)){ vaultInboxModal(p); return; }
      await vaultInboxClear();                  // nothing new in it — stop re-reading it
      if(!quiet&&obj.vault&&Object.keys(obj.vault).length) toast('Everything Hermes suggested is already in your vault.');
      delete obj.vault; rest=JSON.stringify(obj);
    }
    const {rows}=parseImport(rest);
    if(!rows.length){ if(!quiet) toast('Inbox is empty.'); return; }
    importModal(rows,'inbox.json');
    inboxPending=true;
  } finally{ inboxBusy=false; }
}
let inboxPending=false;
async function clearInbox(){
  if(SERVER&&inboxPending){ await wFile('inbox.json',JSON.stringify({assignments:[]},null,2)); inboxPending=false; }
}
let toastEl=null, toastT=null;
function toast(msg){
  // one at a time — stacked toasts used to overlap illegibly at the same spot
  if(toastEl){ toastEl.remove(); clearTimeout(toastT); }
  const d=document.createElement('div');
  d.className='toast';
  d.textContent=msg;
  document.body.appendChild(d);
  toastEl=d;
  toastT=setTimeout(()=>{
    d.classList.add('out');
    setTimeout(()=>{ d.remove(); if(toastEl===d) toastEl=null; },240);
  },2400);
}

function agentBrief(){
  return `# Catching Days · instructions for an AI agent

You are helping with a study-tracking app. Three jobs, all described below:
**planning tasks**, **reading the journal**, and **organizing the journal vault**.

## Start here

Read **agent-context.md** in this folder. It is a plain-language snapshot of
everything you need — open tasks, what was finished recently, upcoming exams
with their coverage, and the journal — and the app rewrites it every time it
saves. Use it in preference to focus-data.json, which is the same information
as ~100 KB of raw JSON and much easier to misread.

## What you may read and write

- **Read** \`agent-context.md\` — start here, this is the digest.
- **Read** \`focus-data.json\` — the raw store, only if you need a field the
  digest leaves out. Never edit it; the app overwrites it constantly.
- **Read** \`bio.md\` — who the user is: work, projects, clubs, sports, skills,
  people they know, things they own. Read it before writing anything *about*
  them (an application, a cover letter, a bio, an essay) so you use their real
  history instead of inventing one. Entries marked _(private)_ are context for
  your reasoning only — never copy them into outward-facing text.
- **Write** \`inbox.json\` — the only file you should ever write.

This boundary is enforced by the app, not merely requested here. Everything
you put in inbox.json arrives as a **proposal** (new assignments, or topics
and connections for the journal vault in Job 3), shown to the user as a
preview they approve before anything is stored. Nothing you write can
complete, edit, delete, reschedule, or grade an existing task, exam, or
journal entry, and the text of a journal entry is never changed. If you're asked to do one of those, say it has to be done in
the app itself — don't try to achieve it by writing files.

## Job 1 — plan the day or the week

Everything you need is in agent-context.md: each open task carries its class,
due date, importance, estimated minutes, and a **do-score** (0–100) that the
app already computes from urgency, workload, importance, and how long it has
sat unstarted. Overdue items are always 100.

A good plan respects what's actually there: match the day's real capacity, put
high-score and overdue work first, keep exam prep ahead of the exam date
rather than the night before, and say plainly when there is more work than
time. Suggest an order — don't invent new deadlines.

## Job 2 — read the journal

agent-context.md carries the journal entries with their date, mood, tag, and
full text, plus per-cycle reflections written during focus sessions. Use them
to answer what was asked: spot patterns across entries, connect how a study
session felt to what actually got done, notice what keeps recurring.

The journal is personal writing. Work from it to answer the question at hand,
don't quote it back at length when a summary will do, and never copy it
anywhere outside this conversation.

## Job 3 — organize the journal vault

The Journal has a **Vault**: an Obsidian-style graph where topics are notes,
journal entries are tagged with them, and related entries are connected.
Your job is to build it out. agent-context.md lists every entry with its
**id**, the topics that already exist (with how many entries each), which
entries are not in the vault yet, and anything the user removed.

1. Read the entries — at least every one under "Not in the vault yet".
   Older entries' full text is in focus-data.json under "diary".
2. Name the themes that actually recur: people, places, classes, habits,
   worries, goals, projects, feelings ("Sleep", "Calc anxiety", "Mom",
   "Gym"). Short, Title Case, one to three words. **Reuse an existing topic**
   before inventing a near-duplicate; if the writing uses another word for
   it, add that word as an alias instead.
3. Tag each entry with the one to five topics it is really about, not every
   noun it mentions. Give a one-line \`why\` that points at the part that fits.
4. Connect two entries only when one clearly continues, answers or echoes
   the other (the same worry a month later, a plan and how it went). Say why.
5. Write or improve each topic's \`summary\`: one to three sentences on what
   this theme has looked like across the entries so far, in second person
   ("You…"), plain and kind. Update it when new entries change the picture.
6. Never re-suggest anything listed under "Removed by the user".

Write it all under a \`"vault"\` key in inbox.json, keeping any \`"assignments"\`
already in the file:

\`\`\`json
{
  "assignments": [],
  "vault": {
    "topics": [
      { "name": "Sleep", "aliases": ["tired", "insomnia"],
        "summary": "You keep tying rough days to late nights before quizzes." }
    ],
    "tags": [
      { "entry": "mf3k2a9x1b", "topics": ["Sleep", "Calc anxiety"],
        "why": "up until 3am before the calc quiz" }
    ],
    "links": [
      { "from": "mf3k2a9x1b", "to": "mg0p7c2d4e",
        "why": "the quiz worry, then how the quiz went" }
    ]
  }
}
\`\`\`

- \`entry\`, \`from\` and \`to\` are entry **ids** from agent-context.md. Anything
  pointing at an id that doesn't exist is dropped.
- A topic named in \`tags\` that doesn't exist yet is created; list it under
  \`topics\` too so it arrives with a summary.
- Sending an existing topic under \`topics\` with a new \`summary\` or extra
  \`aliases\` updates it (the user approves that as well).
- Tags and links already in the vault are ignored, so re-sending is harmless.
- The user can write \`[[Topic]]\` in an entry; those count as tags already.

## inbox.json format

\`\`\`json
{
  "assignments": [
    { "title": "Ch. 7 problem set 1-24", "class": "AP Chemistry",
      "est": 45, "due": "2026-08-14", "importance": 4,
      "notes": "odd problems only",
      "subtasks": ["Read 7.1-7.3", "Problems 1-12", "Problems 13-24", "Check answers"] },
    { "title": "Lab writeup: gas laws", "class": "AP Chemistry",
      "est": 120, "due": "2026-08-18", "importance": 5 }
  ]
}
\`\`\`

- \`title\`      required. Everything else optional.
- \`class\`      matched case-insensitively to an existing class; created with a
               new color if it doesn't exist. Reuse exact names from focus-data.json.
- \`est\`        estimated minutes, integer. "1.5h" and "90 min" are also accepted.
- \`due\`        YYYY-MM-DD. Date-only — no time, no timezone conversion.
- \`importance\` 1–5, where **5 is most important** (1 Whenever, 2 Low, 3 Normal,
               4 High, 5 Critical). Words work too: "high", "critical", "low".
               Note this is the opposite of P1/P2 systems where 1 is highest —
               convert before writing. Omit if the source gives no signal.
- \`subtasks\`   array of strings, or objects with \`text\` and optional \`done\`.
               Checking off the last subtask auto-completes the assignment.
- \`notes\`      free text, shown on the assignment.

Items marked \`"status": "completed"\` or \`"done": true\` are skipped, so you can
pass a raw task-manager export straight through.

## Also accepted

The importer sniffs the format, so any of these work in inbox.json or the
paste box:

- A bare JSON array of the objects above.
- Google Tasks API output: \`{"items":[{"title":..., "due":"2026-08-14T00:00:00.000Z"}]}\`
  Multiple lists: \`{"lists":[{"title":"AP Chem","items":[...]}]}\` — the list
  title becomes the class.
- Grouped object: \`{"AP Chemistry":[...], "Calc BC":[...]}\`
- CSV/TSV with a header row containing title/class/est/due.
- Plain syllabus text, where \`!\`/\`!!\`/\`!!!\` or \`!4\` set importance:
  \`\`\`
  AP Chemistry:
    - Ch. 7 problem set 1-24 (45 min) due Aug 14 !!
    - Lab writeup: gas laws ~2h due 8/18 !!!
  \`\`\`
- Pipe rows: \`Ch. 7 problem set | AP Chemistry | 45m | 2026-08-14\`

## Rules

1. One assignment per item. Don't bundle a whole unit into one row — the app
   tracks focus time per assignment, so granularity is the point.
2. Estimate in minutes if the syllabus gives any signal. It feeds the
   estimate-accuracy stats.
3. Don't invent due dates. Omit \`due\` rather than guessing.
4. Check the open-task list in agent-context.md and don't re-add something
   that's already there.
5. Use subtasks for multi-step work — a lab report becomes "collect data",
   "write methods", "make graphs", "conclusion". Don't split something that
   is already a single action.
6. Importance should reflect weight and consequence (exam > homework >
   optional reading), not urgency. The due date already carries urgency.
7. Reuse class names exactly as they appear in agent-context.md. A near-miss
   ("CHM 11510" instead of "Fall 2026 CHM 11510") creates a second,
   duplicate class.
8. Planning is not writing. If you're asked to plan a day, answer in the
   conversation — only write inbox.json when the user actually wants new
   tasks created.
9. Organizing the vault never needs assignments. Leave \`assignments\` empty
   unless the user also asked for tasks.
`;
}

/* ═══════════════ agent bridge ═══════════════
   A local agent (Hermes, or anything else with file access) gets two
   generated files: AGENTS.md above is the standing prompt, and
   agent-context.md below is the data, rewritten on every save.

   The digest exists because focus-data.json is ~100 KB of raw JSON — an
   expensive and error-prone thing to hand a model when what it actually
   needs is "what's open, what's done, what's coming, what did I write".
   Same information, a fraction of the size, already in words rather than
   ids and epoch timestamps.

   Nothing here widens what an agent can do. inbox.json remains the only
   write path, and that path can only ever PROPOSE new assignments, which
   the user approves in a preview before anything is stored. */
/* ── Bio accessors ── */
const bio        = ()=>{ if(!db.bio) ensureBio(db); return db.bio; };
const bioCats    = ()=>bio().cats;
const bioCat     = id=>bioCats().find(c=>c.id===id)||null;
const bioKind    = id=>(bioCat(id)||{}).kind||'plain';
const bioEntries = ()=>bio().entries;
const bioEntry   = id=>bioEntries().find(e=>e.id===id)||null;
const bioIn      = cat=>bioEntries().filter(e=>e.cat===cat);
const bioProfile = ()=>bio().profile;

/* A role's date range, printed the way a resume prints it. */
function bioRange(e){
  if(!e.start&&!e.end&&!e.current) return '';
  const a=e.start||'', b=e.current?'Present':(e.end||'');
  return a&&b ? a+' – '+b : (a||b);
}
/* Role dates are free text, so read the ways people actually write them:
   "Aug 2026", "August 2026", "Aug '26", "2026-08", "8/2026", "Fall 2025",
   "2026". Returns {n: year*12+month} or null; year-only dates are flagged
   `y` so nothing pretends to know their month. A season or bare year means
   its first month as a start and its last as an end. */
const BIO_MONTHS=['january','february','march','april','may','june','july',
  'august','september','october','november','december'];
const BIO_SEASONS={spring:[0,4],summer:[4,7],fall:[7,11],autumn:[7,11],winter:[0,2]};
function bioYM(s,isEnd){
  s=String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!s) return null;
  const mk=(y,mo)=>mo>=0&&mo<12&&y>1900&&y<2200?{n:y*12+mo}:null;
  let m;
  if((m=/^(\d{4})[-\/.](\d{1,2})(?:[-\/.]\d{1,2})?$/.exec(s))) return mk(+m[1],+m[2]-1);
  if((m=/^(\d{1,2})[-\/.](?:\d{1,2}[-\/.])?(\d{4})$/.exec(s))) return mk(+m[2],+m[1]-1);
  if((m=/^([a-z]+)\.?,? '?(\d{4}|\d{2})$/.exec(s))){
    const w=m[1], y=m[2].length===2?2000+(+m[2]):+m[2];
    const mo=w.length>=3?BIO_MONTHS.findIndex(n=>n.startsWith(w)):-1;
    if(mo>=0) return mk(y,mo);
    if(BIO_SEASONS[w]) return mk(y,BIO_SEASONS[w][isEnd?1:0]);
    return null;
  }
  if((m=/^(\d{4})$/.exec(s))){ const r=mk(+m[1],isEnd?11:0); return r&&{n:r.n,y:true}; }
  return null;
}
const bioNowYM=()=>{ const t=today(); return (+t.slice(0,4))*12+(+t.slice(5,7))-1; };
/* LinkedIn's arithmetic: both ends count, so Aug–Aug is 1 mo. */
function bioDur(n){
  const y=Math.floor(n/12), m=n%12;
  return [y?y+(y===1?' yr':' yrs'):'', m?m+(m===1?' mo':' mos'):''].filter(Boolean).join(' ');
}
function bioSpan(e){
  const a=bioYM(e.start,false), b=e.current?{n:bioNowYM()}:bioYM(e.end,true);
  if(!a||!b||a.y||b.y) return '';       // year-only: show the range, skip the maths
  const n=b.n-a.n+1;
  return n>=1&&n<1200?bioDur(n):'';
}
/* Sort within a category: roles newest-first (current on top, since that's
   what an application asks for), people grouped by relationship, the rest
   alphabetical. Roles sort on the parsed dates — as text, "May 2025" would
   land above "Aug 2026". Anything unreadable sinks to the bottom. */
function bioSort(list,kind){
  const l=list.slice();
  if(kind==='role'){
    const key=e=>{ const s=bioYM(e.start,false), f=e.current?{n:1e7}:(bioYM(e.end,true)||s);
      return [f?f.n:-1, s?s.n:-1]; };
    return l.sort((x,y)=>{ const X=key(x), Y=key(y);
      return Y[0]-X[0] || Y[1]-X[1] || String(x.title).localeCompare(String(y.title)); });
  }
  if(kind==='person'){
    const rank=r=>{ const i=BIO_RELATIONS.findIndex(x=>x[0]===r); return i<0?99:i; };
    return l.sort((x,y)=>rank(x.relation)-rank(y.relation)||String(x.title).localeCompare(String(y.title)));
  }
  return l.sort((x,y)=>String(x.title).localeCompare(String(y.title)));
}

/* ── bio.md ── the whole point of the section.
   Two audiences, one generator:

     full=true   → bio.md on disk, for an assistant running on this machine.
                   Includes everything, sensitive entries marked as such so the
                   model knows they are private context and not resume material.
     full=false  → what you copy into an application, a cover letter, or a
                   chat with a model you don't control. Sensitive entries are
                   dropped entirely — not redacted, not summarised, absent.

   That split is the safety property of this feature: "people I dislike" is
   useful for advice and catastrophic in a scholarship essay. */
function bioMd(full,opt){
  opt=opt||{};
  const plain=!!opt.plain;                       // no markdown syntax
  const only=opt.cats||null;                     // Set of category ids, or null for all
  const q=(opt.q||'').trim().toLowerCase();      // honour an active search
  const L=[], P=x=>L.push(x);
  const p=bioProfile();
  const keep=e=>(full||!e.sensitive)
    && (!only||only.has(e.cat))
    && (!q||[e.title,e.org,e.role,e.notes,relName(e.relation),(e.tags||[]).join(' '),
             (e.bullets||[]).join(' '),e.start,e.end,bioRange(e)
            ].join(' ').toLowerCase().includes(q));
  const has=v=>v&&String(v).trim();
  const H1=t=>plain?String(t).toUpperCase():'# '+t;
  const H2=t=>plain?'':'## '+t;
  const B =t=>plain?t:'**'+t+'**';
  const li=(t,d)=>plain?(d?'  ':'')+(d?'\u2022 ':'')+t:(d?'  - ':'- ')+t;

  P(H1(has(p.name)?p.name:'Bio'));
  P('');
  const head=[];
  if(has(p.headline)) head.push(p.headline);
  if(has(p.location)) head.push(p.location);
  if(head.length){ P(head.join(' \u00b7 ')); }
  const acad=[];
  if(has(p.school)) acad.push(p.school);
  if(has(p.major)) acad.push(p.major);
  if(has(p.grad))  acad.push('Expected graduation '+p.grad);
  if(has(p.gpa))   acad.push('GPA '+p.gpa);
  if(acad.length) P(acad.join(' \u00b7 '));
  if(head.length||acad.length) P('');

  const contact=[];
  if(has(p.email)) contact.push('Email: '+p.email);
  if(full&&has(p.phone)) contact.push('Phone: '+p.phone);   // never in an application copy
  if(has(p.pronouns)) contact.push('Pronouns: '+p.pronouns);
  if(has(p.links)) contact.push('Links: '+String(p.links).split(/\n+/).join(' \u00b7 '));
  if(contact.length){ contact.forEach(c=>P(li(c))); P(''); }
  if(has(p.summary)){ P(p.summary.trim()); P(''); }

  if(full&&!plain){
    P('> Generated by Catching Days from the Bio tab. This is the user writing about');
    P('> themselves — treat it as fact about them, and prefer it over guessing.');
    P('> Entries marked _(private)_ are personal context for your reasoning only:');
    P('> never copy them into anything outward-facing — an application, an email,');
    P('> an essay, a public profile — unless the user asks for that in the moment.');
    P('');
  }

  let any=false;
  bioCats().forEach(c=>{
    const list=bioSort(bioIn(c.id).filter(keep),c.kind);
    if(!list.length) return;
    any=true;
    if(plain){ P(c.name.toUpperCase()); P(''); } else { P(H2(c.name)); P(''); }
    list.forEach(e=>{
      const bits=[];
      if(c.kind==='role'){
        if(has(e.role)) bits.push(e.role);
        if(has(e.org))  bits.push(e.org);
        const r=bioRange(e); if(r) bits.push(r);
      } else if(c.kind==='person'){
        if(has(e.relation)) bits.push(relName(e.relation));
        if(has(e.org))      bits.push(e.org);
      } else if(has(e.org)) bits.push(e.org);

      if(plain){
        P(e.title+(full&&e.sensitive?'  (private)':''));
        if(bits.length) P(bits.join(' \u00b7 '));
      } else {
        P(li(B(e.title)+(bits.length?' — '+bits.join(' \u00b7 '):'')+
             (full&&e.sensitive?' _(private)_':'')));
      }
      (e.bullets||[]).filter(has).forEach(b=>P(li(b,true)));
      if(has(e.notes)) P(li(e.notes.trim().replace(/\n+/g,' '),true));
      if(has(e.link))  P(li(e.link,true));
      /* tags are an organising tool for you, not a line a recruiter should
         read — they only survive into the full, AI-facing copy */
      if(full&&(e.tags||[]).length) P(li('tags: '+e.tags.join(', '),true));
      if(plain) P('');
    });
    if(!plain) P('');
  });

  if(!any) P(plain?'Nothing to export.':'_Nothing matched — widen the sections or clear the search._');
  return L.join('\n');
}

function agentContext(){
  const L=[], P=s=>L.push(s);
  const t=today();
  const impWord=n=>(n&&IMP[n])?IMP[n].t:'unset';
  const tagName=id=>((db.journalTags||[]).find(x=>x.id===id)||{}).name||'untagged';
  const when=d=>d===null?'':d===0?'today':d===1?'tomorrow':d<0?`${-d}d overdue`:`in ${d}d`;

  const line=a=>{
    const d=a.due?dDelta(a.due):null, s=doScore(a);
    const bits=[clsName(a.classId)];
    if(a.due) bits.push(`due ${a.due} (${when(d)})`);
    if(a.imp) bits.push(impWord(a.imp));
    if(a.est) bits.push(`est ${a.est}m`);
    if(s!==null) bits.push(`score ${s}`);
    let out=`- **${a.title}** — ${bits.join(' · ')}`;
    const subs=(a.subs||[]).filter(x=>x&&x.text);
    if(subs.length) out+=`\n  - subtasks: ${subs.map(x=>`${x.text}${x.done?' [done]':''}`).join('; ')}`;
    if(a.notes) out+=`\n  - ${a.notes.replace(/\n+/g,' ')}`;
    return out;
  };

  P('# Catching Days · current state');
  P('');
  P(`Snapshot taken **${dDayName(t)}** (${t}), timezone ${TZ()}.`);
  P('The app rewrites this file every time it saves. Read-only —');
  P('to propose new tasks write inbox.json, and read AGENTS.md first.');
  P('');

  P('## Classes');
  P('');
  P('Use these names verbatim in inbox.json.');
  P('');
  activeClasses().forEach(c=>{
    const n=db.assignments.filter(a=>a.classId===c.id&&!a.done).length;
    P(`- ${c.name} — ${n} open`);
  });
  if(db.assignments.some(a=>!a.classId&&!a.done)) P('- (Unfiled) — no class set');
  const arch=archivedClasses();
  if(arch.length){
    P('');
    P(`Archived — old classes, excluded from everything below. Don't file new work here: ${
      arch.map(c=>c.name).join(', ')}.`);
  }
  P('');

  // ── open work, bucketed by when it is actually due ──
  const open=db.assignments.filter(a=>!a.done&&!inArchivedCls(a));
  const B={over:[],today:[],week:[],later:[],none:[]};
  open.forEach(a=>{
    const d=a.due?dDelta(a.due):null;
    if(d===null) B.none.push(a);
    else if(d<0) B.over.push(a);
    else if(d===0) B.today.push(a);
    else if(d<=7) B.week.push(a);
    else B.later.push(a);
  });
  const byDue=(x,y)=>(x.due||'9999').localeCompare(y.due||'9999')||((doScore(y)||0)-(doScore(x)||0));
  Object.values(B).forEach(g=>g.sort(byDue));

  P(`## Open tasks (${open.length})`);
  P('');
  P('score = the app’s do-score, 0–100, already weighing urgency, workload,');
  P('importance and how long it has sat unstarted. Overdue is always 100.');
  P('');
  const sect=(title,arr)=>{ if(!arr.length) return;
    P(`### ${title} (${arr.length})`); P(''); arr.forEach(a=>P(line(a))); P(''); };
  sect('Overdue',B.over);
  sect('Due today',B.today);
  sect('Due within 7 days',B.week);
  sect('Later',B.later);
  sect('No due date — reference and open-ended',B.none);
  if(!open.length){ P('Nothing open.'); P(''); }

  // ── what has actually been finished lately ──
  const cutoff=addDays(t,-21);
  const done=db.assignments.filter(a=>a.done&&a.doneAt&&dayKey(a.doneAt)>=cutoff&&!inArchivedCls(a))
    .sort((x,y)=>y.doneAt-x.doneAt);
  P(`## Completed in the last 21 days (${done.length})`);
  P('');
  if(done.length) done.forEach(a=>P(`- ${dayKey(a.doneAt)} — **${a.title}** (${clsName(a.classId)})`));
  else P('Nothing marked done in this window.');
  P('');

  // ── exams: the app tracks these separately from tasks ──
  const exams=(db.exams||[]).filter(e=>!e.done&&!clsArchived(e.classId))
    .sort((x,y)=>(x.examDate||'9999').localeCompare(y.examDate||'9999'));
  P(`## Upcoming exams and quizzes (${exams.length})`);
  P('');
  P('Tracked separately from tasks. You cannot create these — they are added in the app.');
  P('');
  exams.forEach(e=>{
    const d=e.examDate?dDelta(e.examDate):null, s=examScore(e);
    const bits=[clsName(e.classId)];
    bits.push(e.examDate?`${e.examDate} (${when(d)})`:'date TBA');
    bits.push(`readiness: ${(e.confidence&&CONF[e.confidence])?CONF[e.confidence].t:'not rated'}`);
    if(s!==null) bits.push(`score ${s}`);
    P(`- **${e.title}** — ${bits.join(' · ')}`);
    if(e.notes) P(`  - ${e.notes.replace(/\n+/g,' ')}`);
    const rt=(e.reviewTasks||[]);
    if(rt.length) P(`  - review: ${rt.filter(r=>r.done).length}/${rt.length} done — ${rt.map(r=>`${r.text}${r.done?' [done]':''}`).join('; ')}`);
  });
  if(!exams.length) P('None scheduled.');
  P('');

  // ── the journal. Recent entries in full; older ones as an index so this
  //    file stays a sane size across a whole semester. ──
  const diary=(db.diary||[]).slice().sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  const vx=vaultIndex();
  const fullFrom=addDays(t,-45);
  const recent=diary.filter(e=>(e.date||'')>=fullFrom);
  const older=diary.filter(e=>(e.date||'')<fullFrom);
  P(`## Journal (${diary.length} entries)`);
  P('');
  if(!diary.length){ P('No entries yet.'); P(''); }
  if(recent.length){
    P(`### Last 45 days — full text (${recent.length})`);
    P('');
    recent.forEach(e=>{
      P(`#### ${e.date} · ${diaMoodInfo(e.mood).label} · ${tagName(e.tagId)}${e.title?` · ${e.title}`:''} · id: ${e.id}`);
      P('');
      const tp=(vx.byEntry.get(e.id)||[]).map(r=>r.topic.name);
      if(tp.length){ P(`Topics: ${tp.join(', ')}`); P(''); }
      P((e.body||'(no body)').trim());
      P('');
    });
  }
  if(older.length){
    P(`### Earlier entries — index only (${older.length})`);
    P('');
    P('Full text for these is in focus-data.json under "diary".');
    P('');
    older.forEach(e=>P(`- ${e.date} · ${diaMoodInfo(e.mood).label} · ${tagName(e.tagId)}${e.title?` · ${e.title}`:''} · id: ${e.id}`));
    P('');
  }

  // ── the journal vault: topics over the entries (Job 3 in AGENTS.md) ──
  const vts=vTopics().slice().sort((a,b)=>
    (vx.byTopic.get(b.id)||[]).length-(vx.byTopic.get(a.id)||[]).length||a.name.localeCompare(b.name));
  P(`## Journal vault (${vts.length} topics)`);
  P('');
  P('Topics built over the journal. Reuse these names exactly; see Job 3 in AGENTS.md.');
  P('');
  vts.forEach(tp=>{
    const n=(vx.byTopic.get(tp.id)||[]).length;
    P(`- **${tp.name}** — ${n} entr${n===1?'y':'ies'}${tp.aliases.length?` · also: ${tp.aliases.join(', ')}`:''}`);
    if(tp.summary) P(`  - ${tp.summary.replace(/\n+/g,' ')}`);
  });
  if(!vts.length) P('No topics yet.');
  P('');
  const loose=diary.filter(e=>!(vx.byEntry.get(e.id)||[]).length);
  P(`### Not in the vault yet (${loose.length})`);
  P('');
  loose.forEach(e=>P(`- ${e.date} · ${e.title||'Untitled'} · id: ${e.id}`));
  if(!loose.length) P('Every entry has at least one topic.');
  P('');
  const vlk=vLinks().filter(l=>!l.off&&diaryById(l.a)&&diaryById(l.b));
  if(vlk.length){
    P(`### Connections (${vlk.length})`); P('');
    vlk.forEach(l=>P(`- ${l.a} ↔ ${l.b}${l.why?` — ${l.why}`:''}`)); P('');
  }
  const offT=vTags().filter(g=>g.off&&diaryById(g.entryId)&&vTopic(g.topicId));
  const offL=vLinks().filter(l=>l.off&&diaryById(l.a)&&diaryById(l.b));
  if(offT.length||offL.length){
    P('### Removed by the user — do not suggest again'); P('');
    offT.forEach(g=>P(`- tag: entry ${g.entryId} ✕ ${vTopic(g.topicId).name}`));
    offL.forEach(l=>P(`- link: ${l.a} ↔ ${l.b}`));
    P('');
  }

  // ── reflections written mid-session; the honest record of how study went ──
  const refl=[];
  (db.sessions||[]).slice().reverse().forEach(s=>{
    (s.cycles||[]).forEach(c=>{
      if(c.journal&&c.journal.trim()) refl.push({
        date:dayKey(c.started||s.started), n:c.n, rating:c.rating,
        name:s.name||'Session', text:c.journal.trim()});
    });
    if(s.journal&&s.journal.trim()) refl.push({
      date:dayKey(s.started), n:null, rating:null,
      name:s.name||'Session', text:s.journal.trim()});
  });
  P(`## Focus-session reflections (${refl.length})`);
  P('');
  P('Written during or right after a study session — how the work actually felt.');
  P('');
  if(refl.length) refl.slice(0,25).forEach(r=>{
    const head=[r.date,r.name,r.n?`cycle ${r.n}`:null,r.rating?`rated ${r.rating}/5`:null]
      .filter(Boolean).join(' · ');
    P(`- ${head}`); P(`  - ${r.text.replace(/\n+/g,' ')}`);
  });
  else P('None recorded.');
  P('');

  // ── numeric grounding for "how am I actually doing" questions ──
  const mins=(db.sessions||[]).reduce((n,s)=>n+(s.cycles||[]).reduce((m,c)=>m+Math.round((c.actual||0)/60000),0),0);
  P('## Totals');
  P('');
  P(`- Open tasks: ${open.length} · completed all-time: ${db.assignments.filter(a=>a.done).length}`);
  P(`- Exams tracked: ${(db.exams||[]).length} (${exams.length} still ahead)`);
  P(`- Focus sessions logged: ${(db.sessions||[]).length}, ~${mins} minutes total`);
  P(`- Daily goal: ${db.settings.goal} minutes of net focus`);
  { const ps=pathState(true);
    P(`- Lotus path (focus streak: days in a row at the daily goal): ${ps.cur} day${ps.cur===1?'':'s'}${ps.met?', today already counts':ps.cur?`, ${ps.left} more minutes today keeps it going`:''}; best ${ps.best}`); }
  P('');
  return L.join('\n');
}
function copyBrief(btn){
  navigator.clipboard.writeText(agentBrief()).then(()=>{
    const o=btn.textContent; btn.textContent='Copied'; setTimeout(()=>btn.textContent=o,1400);
  }).catch(()=>toast('Copy failed — open Settings to download it instead.'));
}
function downloadBrief(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([agentBrief()],{type:'text/markdown'}));
  a.download='AGENTS.md'; a.click();
}

function toggleAsg(id,on,sessionId,cycle,origin){
  const a=asg(id); if(!a) return;
  if(a.ann) return;        // announcements are reminders, not work — never completable
  if(on&&a.done) return;
  const finishSnapshot=on&&window.TaskFinish?TaskFinish.capture(a,origin):null;
  if(!on&&window.TaskFinish) TaskFinish.cancel(id);
  if(a.habitId){ on?completeHabitAsg(id,sessionId,cycle):uncompleteHabitAsg(id); if(on) pondReleased(a,finishSnapshot); return; }
  a.done=on;
  a.doneAt=on?Date.now():null;
  a.doneSession=on?(sessionId||null):null;
  a.doneCycle=on?(cycle||null):null;
  save();
  if(on) pondReleased(a,finishSnapshot);      // every finished task swims into the pond
}

/* ═══════════════ Plan · Tasks ═══════════════
   Sorted by how deep each task sits: overdue in the reeds, then this week,
   further upstream, and no date. Inside a group, highest do-score first. */
let asgFilter={cls:'all',q:''};
let showArchCls=false;
let asgMore=new Set(), asgJustDone=new Map();   // ticked this visit → the score it had, so it stays put
const TASK_GROUPS=[['o','In the reeds','#b0524a','#d9695f1a','overdue · always 100'],['w','This week','#1f2e2c','#ebe4d6','next 7 days'],
  ['l','Further upstream','#1f2e2c','#ebe4d6','later'],['n','No date','#1f2e2c','#ebe4d6','reference and open-ended']];
function taskGroupOf(a){ if(!a.due) return 'n'; const d=dDelta(a.due); return d<0?'o':d<=7?'w':'l'; }
function taskDueLabel(a){
  if(!a.due) return 'No date';
  const d=dDelta(a.due);
  if(d===0) return 'Today'; if(d===1) return 'Tomorrow';
  if(d>1&&d<7) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][weekdayOf(a.due)];
  return d<0?dMini(a.due):dMini(a.due).replace(/^\w+, /,'');
}
function asgTap(id){
  const a=asg(id); if(!a||a.ann) return;
  const on=!a.done; if(on) asgJustDone.set(id,doScore(a)||0);
  toggleAsg(id,on); paintAsg();
}
function asgSetCls(k){ asgJustDone.clear(); asgFilter.cls=asgFilter.cls===k&&k!=='all'?'all':k; asgMore=new Set(); paintAsg(); }

    +(openAll.some(a=>!a.classId)?`<div class="cc${asgFilter.cls==='none'?' on':''}" onclick="asgSetCls('none')">

    +`<div class="cc" onclick="classModal()"><div class="cc-f" style="background:transparent;border:1.5px dashed #cfc6b4">+</div>

    +(archivedClasses().length?`<button class="tg-more" style="padding:8px 8px 2px" onclick="showArchCls=!showArchCls;paintAsg()">${showArchCls?'Hide':'Show'} ${archivedClasses().length} archived</button>

        <div class="cc-b"><span class="t">${esc(clsShort(c.id))}</span><span class="m">archived · edit to restore</span></div></div>`).join(''):''}`:'');
  /* tests: how ready you feel, as pebbles */

  const exams=(db.exams||[]).map(fixExam).filter(e=>!e.done&&!clsArchived(e.classId)&&e.examDate&&dDelta(e.examDate)>=0&&inCls(e))
    .sort((a,b)=>a.examDate.localeCompare(b.examDate)).slice(0,6);
  const tests=exams.map(e=>{ const d=dDelta(e.examDate), col=d<=3?'#c65f2e':d<=7?'#a8762f':'#2f7a74', r=e.confidence||0;

        <span style="font:400 20px/1 var(--serif);color:${col};white-space:nowrap">${d===0?'today':'in '+d+'d'}</span></div>
      <div class="pebs">${[1,2,3,4,5].map(n=>`<button onclick="examReady('${e.id}',${n})" title="${RL[n]}" style="background:${n<=r?'#8fae7c':'transparent'};border-color:${n<=r?'#6f9e7a':'#cfc6b4'}"></button>`).join('')}

  $('asg-body').innerHTML=`<div class="scr" style="gap:22px">

/* ── due-date dividers ──
   Primary order is the due date. Inside a day: class, then importance,
   then whatever you added first. Undated work sinks to the bottom. */
let expanded=new Set();
function toggleExp(id){ expanded.has(id)?expanded.delete(id):expanded.add(id); repaint(); }

function groupRows(list){
  const byDone=asgFilter.show==='done';
  const groups=new Map();
  list.forEach(a=>{ const k=byDone?(a.doneAt?dayKey(a.doneAt):''):(itemDate(a)||'');
    if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(a); });
  let keys=[...groups.keys()].filter(Boolean).sort();
  if(byDone) keys.reverse();
  if(groups.has('')) keys.push('');

  return keys.map(k=>{
    /* exams and quizzes sort to the top of their day — if something is being
       graded that day, it's the thing you want to see first */
    const rows=groups.get(k).sort((x,y)=>
      (isExam(y)?1:0)-(isExam(x)?1:0)||
      clsName(x.classId).localeCompare(clsName(y.classId))||
      (y.imp||0)-(x.imp||0)|| x.created-y.created);
    const d=k?dDelta(k):null;
    const tone = byDone?'done' : !k?'none' : d<0?'over' : d===0?'today' : d===1?'soon' : 'future';
    const col  = {over:'#a96464',today:'#c9a227',soon:'#4f86b3',future:'#9399a0',
                  done:'#6fb07d',none:'#d6dee5'}[tone];
    const est=sum(rows,a=>(a.est||0)*MIN);
    return `
    <div class="daydiv" style="--dc:${col}">
      <span class="dt"${tone==='over'||tone==='today'?` style="color:${col}"`:''}>${
        k?(byDone?`Completed ${dDate(k)}`:dDayName(k)):'No due date'}</span>
      ${k&&!byDone?`<span class="dr" style="color:${col};border-color:${col}55;background:${col}18">${dRel(k)}</span>`:''}
      <span class="dm">${rows.length} item${rows.length===1?'':'s'}${est?` · ${durP(est)} est`:''}</span>
    </div>
    ${rows.map(itemRow).join('')}`;
  }).join('');
}

/* ── countdown strip ──
   Shown on Daily and Tasks. Deliberately compact: the point is a glance, not
   a dashboard. Days are whole-day deltas so "1" always means tomorrow. */

    ${_rowCtx==='daily'&&isPicked(a.id)?`<button class="xs ghost" onclick="removeFromToday('${a.id}')" title="Take off today's plan — the task itself stays">✕ Today</button>`:''}
    ${a.due&&!a.done?`<button class="xs ghost" onclick="toggleCountdown('${a.id}')" title="${isPinned(a.id)?'Remove countdown':'Show a countdown for this'}" style="${isPinned(a.id)?'color:var(--accent)':''}">${isPinned(a.id)?'◷ Pinned':'◷'}</button>`:''}
    ${a.habitId?'':`<button class="xs ghost" onclick="asgModal('${a.id}')">Edit</button>`}
  </div>`;
}

/* ═══════════════ journeys (habit tracker) ═══════════════
   A Journey runs for a fixed number of days and holds one or more Habits.
   Habits never get their whole future pre-generated into the tasks list —
   only the current Monday-anchored week's due occurrences exist as real
   assignments at any time (generateHabitBacklog), tracked via a genThrough
   watermark so the same due date is never generated twice. A habit's streak
   is derived from its history log (done/skipped/missed), never cached, so
   it can't drift out of sync with what actually happened. */
const WEEKDAY_LETTERS=['S','M','T','W','T','F','S'];
function newJourney(o){ return {id:uid(),name:o.name,start:o.start||today(),days:o.days||30,
  status:'active',endedAt:null,habits:[],journal:[],journalPrompted:false,created:Date.now()}; }
function newHabit(o){ const freq=o.scheduleType==='freq'; return {id:uid(),name:o.name,
  scheduleType:freq?'freq':'days',
  days:freq?[]:(o.days&&o.days.length?o.days:[1,2,3,4,5]),
  timesPerWeek:freq?Math.max(1,Math.min(7,+o.timesPerWeek||3)):null,
  weekAnchor:null,skipsUsedThisWeek:0,genThrough:null,history:[],active:true,created:Date.now()}; }
function journeyEndDate(j){ return addDays(j.start,j.days); }
function findHabit(id){ for(const j of db.journeys||[]){ const h=j.habits.find(x=>x.id===id); if(h) return h; } return null; }
function findHabitJourney(hid){ return (db.journeys||[]).find(j=>j.habits.some(h=>h.id===hid))||null; }
function hasOccurrence(habitId,dk){ return db.assignments.some(a=>a.habitId===habitId&&a.due===dk); }
function journeyAssignmentIsActive(a){
  if(!a.habitId&&!a.journeyId) return true;
  const j=(db.journeys||[]).find(x=>x.id===a.journeyId)||findHabitJourney(a.habitId);
  const h=a.habitId&&findHabit(a.habitId);
  return !!j&&j.status==='active'&&(!h||h.active!==false);
}
function removeAssignmentRefs(ids){
  if(!ids.size) return;
  db.dailyPicks=db.dailyPicks||{};
  Object.keys(db.dailyPicks).forEach(d=>{
    db.dailyPicks[d]=(db.dailyPicks[d]||[]).filter(id=>!ids.has(id));
    if(!db.dailyPicks[d].length) delete db.dailyPicks[d];
  });
}
/* Generated occurrences are implementation details of a Journey, not
   independent tasks. Ending a Journey removes every unfinished occurrence;
   completed ones stay in history for streaks/stats. Deleting the Journey (or
   an individual habit) removes its occurrences entirely. */
function removeJourneyOccurrences(journeyId,all=false){
  const j=(db.journeys||[]).find(x=>x.id===journeyId);
  const habitIds=new Set((j?.habits||[]).map(h=>h.id));
  const removed=new Set(db.assignments
    .filter(a=>(a.journeyId===journeyId||habitIds.has(a.habitId))&&(all||!a.done)).map(a=>a.id));
  db.assignments=db.assignments.filter(a=>!removed.has(a.id));
  removeAssignmentRefs(removed);
}
function removeHabitOccurrences(habitId,all=false){
  const removed=new Set(db.assignments
    .filter(a=>a.habitId===habitId&&(all||!a.done)).map(a=>a.id));
  db.assignments=db.assignments.filter(a=>!removed.has(a.id));
  removeAssignmentRefs(removed);
}

/* Skip budget is proportional to commitment, not the full count of "off
   days" a weekly target implies — granting all of them would let a
   low-frequency habit (e.g. 1x/week) coast an entire week doing nothing.
   Halved and capped, with a guaranteed floor of 1 so a streak is always
   forgiving of at least one planned miss. */
function skipBudget(h){ return Math.max(1,Math.min(h.days.length,Math.floor((7-h.days.length)/2))); }
function ensureWeekWindow(h){
  const wa=mondayOf(today());
  if(h.weekAnchor!==wa){ h.weekAnchor=wa; h.skipsUsedThisWeek=0; }
}
function freqDoneThisWeek(h){ return h.history.filter(e=>e.outcome==='done'&&e.date>=mondayOf(today())).length; }
function generateHabitBacklog(journey,habit){
  if(journey.status!=='active'||!habit.active) return;
  const monday=mondayOf(today()), sunday=addDays(monday,6);
  /* Frequency habits have no due weekday known in advance — whether today
     needs an occurrence depends on how many times this week are already
     logged, so unlike day-scheduled habits this only ever looks at today. */
  if(habit.scheduleType==='freq'){
    const t=today();
    if(t>=journey.start && t<=journeyEndDate(journey) && freqDoneThisWeek(habit)<habit.timesPerWeek && !hasOccurrence(habit.id,t))
      db.assignments.push(newAsg({title:habit.name,due:t,habitId:habit.id,journeyId:journey.id}));
    habit.genThrough=t; return;
  }
  if(!habit.genThrough) habit.genThrough=addDays(monday,-1);
  let d=addDays(habit.genThrough,1);
  while(d<=sunday){
    if(d>=journey.start && d<=journeyEndDate(journey) && habit.days.includes(weekdayOf(d)) && !hasOccurrence(habit.id,d))
      db.assignments.push(newAsg({title:habit.name,due:d,habitId:habit.id,journeyId:journey.id}));
    habit.genThrough=d; d=addDays(d,1);
  }
}
function closeoutPastDue(habit){
  /* Frequency habits are flexible about WHICH day, so a stale open occurrence
     just quietly expires — it isn't a miss unless the whole week comes up
     short, and that's judged from actual 'done' entries by freqHabitStreak(),
     not by logging a miss here. */
  db.assignments.filter(a=>a.habitId===habit.id && !a.done && a.due<today()).forEach(a=>{
    if(habit.scheduleType!=='freq') habit.history.push({date:a.due,outcome:'missed'});
    db.assignments.splice(db.assignments.indexOf(a),1);
  });
}
function advanceHabit(habit){
  const j=findHabitJourney(habit.id); if(!j) return;
  ensureWeekWindow(habit);
  generateHabitBacklog(j,habit);
}
function journeyTick(){
  (db.journeys||[]).forEach(j=>{
    if(j.status!=='active'){ removeJourneyOccurrences(j.id); return; }
    j.habits.forEach(h=>{
      ensureWeekWindow(h);
      closeoutPastDue(h);
      generateHabitBacklog(j,h);
    });
  });
  save();
}
function checkJourneyEnds(){
  let changed=false;
  (db.journeys||[]).forEach(j=>{
    if(j.status==='active' && today()>=journeyEndDate(j)){
      j.status='completed'; j.endedAt=Date.now(); j.habits.forEach(h=>h.active=false);
      removeJourneyOccurrences(j.id); changed=true;
    }
  });
  if(changed) save();
  const pending=(db.journeys||[]).find(j=>j.status!=='active'&&!j.journalPrompted);
  if(pending) journalPromptModal(pending);
}
/* Not computeStreak() — that walks consecutive calendar days (right for the
   session-log streak it was built for), but a Mon/Wed/Fri habit's streak is
   consecutive DUE OCCURRENCES, not consecutive dates. */
function habitStreak(h){
  if(h.scheduleType==='freq') return freqHabitStreak(h);
  let cur=0,best=0;
  [...h.history].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(e=>{
    if(e.outcome==='missed') cur=0; else { cur++; best=Math.max(best,cur); }
  });
  return {streak:cur,best};
}
/* A day-scheduled habit's streak is consecutive due occurrences; a frequency
   habit has no due occurrences to walk, so its streak is consecutive WEEKS
   that hit the target count — including weeks with zero completions, which
   simply never appear in doneByWeek and so correctly break the streak. */
function freqHabitStreak(h){
  const j=findHabitJourney(h.id);
  const doneByWeek={};
  h.history.forEach(e=>{ if(e.outcome==='done') doneByWeek[mondayOf(e.date)]=(doneByWeek[mondayOf(e.date)]||0)+1; });
  const curWk=mondayOf(today());
  let cur=0,best=0;
  for(let wk=mondayOf(j?j.start:today()); wk<curWk; wk=addDays(wk,7)){
    if((doneByWeek[wk]||0)>=h.timesPerWeek){ cur++; best=Math.max(best,cur); } else cur=0;
  }
  return {streak:cur,best};
}

function completeHabitAsg(id,sessionId,cycle){
  const a=asg(id), h=findHabit(a?.habitId); if(!a||!h) return;
  a.done=true; a.doneAt=Date.now(); a.doneSession=sessionId||null; a.doneCycle=cycle||null; a.habitOutcome='done';
  h.history.push({date:a.due,outcome:'done'});
  advanceHabit(h);
  save();
}
function uncompleteHabitAsg(id){
  const a=asg(id); if(!a) return;
  const h=findHabit(a.habitId);
  if(h){
    h.history=h.history.filter(e=>!(e.date===a.due&&e.outcome===a.habitOutcome));
    if(a.habitOutcome==='skipped') h.skipsUsedThisWeek=Math.max(0,h.skipsUsedThisWeek-1);
  }
  a.done=false; a.doneAt=null; a.habitOutcome=null; save();
}
function skipHabitAsg(id){
  const a=asg(id); if(!a?.habitId) return;
  const h=findHabit(a.habitId); if(!h) return;
  ensureWeekWindow(h);
  const budget=skipBudget(h);
  if(h.skipsUsedThisWeek>=budget){ toast(`No skips left this week (${budget} used).`); return; }
  h.skipsUsedThisWeek++;
  a.done=true; a.doneAt=Date.now(); a.habitOutcome='skipped';
  h.history.push({date:a.due,outcome:'skipped'});
  advanceHabit(h);
  save(); repaint();
}

function jnSaveJourney(){
  const name=$('jn-name').value.trim(); if(!name){ toast('Give the journey a name.'); return; }
  const days=Math.max(1,+$('jn-days').value||30);
  const start=$('jn-start').value||today();
  const validHabits=jnHabitsDraft.filter(h=>h.name.trim()&&(h.scheduleType==='freq'?h.timesPerWeek>=1:h.days.size));
  if(!validHabits.length&&!jnEditId){ toast('Add at least one habit with a name and a schedule.'); return; }
  let j=jnEditId?(db.journeys||[]).find(x=>x.id===jnEditId):null;
  let boundaryChanged=false;
  if(!j){
    j=newJourney({name,start,days}); db.journeys=db.journeys||[]; db.journeys.push(j);
  } else {
    const kept=new Set(validHabits.map(h=>h.id).filter(Boolean));
    j.habits.filter(h=>!kept.has(h.id)).forEach(h=>removeHabitOccurrences(h.id,true));
    boundaryChanged=j.start!==start||j.days!==days;
    j.name=name; j.start=start; j.days=days;
  }
  const oldById=new Map(j.habits.map(h=>[h.id,h]));
  j.habits=validHabits.map(d=>{
    const dayList=d.scheduleType==='days'?[...d.days].sort((a,b)=>a-b):[];
    let h=d.id&&oldById.get(d.id);
    if(!h) h=newHabit({name:d.name.trim(),scheduleType:d.scheduleType,days:dayList,timesPerWeek:d.timesPerWeek});
    else {
      const scheduleChanged=h.scheduleType!==d.scheduleType ||
        JSON.stringify(h.days||[])!==JSON.stringify(dayList) ||
        (d.scheduleType==='freq'&&h.timesPerWeek!==d.timesPerWeek);
      if(scheduleChanged||boundaryChanged){ removeHabitOccurrences(h.id); h.genThrough=null; }
      h.name=d.name.trim(); h.scheduleType=d.scheduleType; h.days=dayList;
      h.timesPerWeek=d.scheduleType==='freq'?d.timesPerWeek:null;
      db.assignments.filter(a=>a.habitId===h.id&&!a.done).forEach(a=>{ a.title=h.name; a.journeyId=j.id; });
    }
    h.active=j.status==='active';
    return h;
  });
  j.habits.forEach(h=>generateHabitBacklog(j,h));
  save(); closeModal(); paintJourneys();
}

/* ═══════════════ Plan · Journeys ═══════════════
   Habits as stepping stones across a stream: one stone per day of the
   journey. With no journey yet, the page shows a labelled example. */
let jrnSel=null, jSample={}, jReflect='';
function jDayState(j,dk){
  const t=today();
  if(dk>t) return 'ahead';
  const outs=j.habits.flatMap(h=>h.history.filter(e=>e.date===dk).map(e=>e.outcome));
  if(outs.includes('done')) return 'kept';
  if(outs.includes('skipped')) return 'skip';
  if(dk===t) return 'today';
  return outs.includes('missed')?'missed':'skip';
}
function journeyStream(days,states,todayIdx,W){
  const P=PondArt; P.reseed(33);
  const H=330, f=W/1104;
  const k=[P.deep('koi',P.loop(W/2,170,440*f,110,6,.3),60,false,1.7),P.caustics(W,H,.22),P.ripple(300*f,200,160,0),P.ripple(850*f,140,120,2.5)];
  const n=days, gap=(W-140)/Math.max(1,n-1);
  const pts=Array.from({length:n},(_,i)=>[70+i*gap,205+Math.sin(i*.55)*42]);
  k.push(`<svg width="${W}" height="${H}" style="position:absolute;inset:0;z-index:3"><path d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L')}" fill="none" stroke="#cfe9e3" stroke-opacity=".18" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  const sz=Math.max(14,Math.min(26,gap*.78));
  pts.forEach(([x,y],i)=>{ const s=states[i], w=sz+(i%3)*3*(sz/26);
    const bg=s==='kept'?'radial-gradient(ellipse at 40% 35%,#b5cf9f,#6f9e7a)':s==='skip'?'radial-gradient(ellipse at 40% 35%,#8d9c9c,#5c6d6e)':s==='missed'?'radial-gradient(ellipse at 40% 35%,#6d7c7c,#46595a)':s==='today'?'radial-gradient(ellipse at 40% 35%,#fbd6bd,#ec7a45)':'transparent';
    k.push(`<div title="Day ${i+1}" style="position:absolute;left:${(x-w/2).toFixed(1)}px;top:${(y-w*.36).toFixed(1)}px;width:${w.toFixed(1)}px;height:${(w*.72).toFixed(1)}px;border-radius:50%;background:${bg};z-index:5;
      border:${s==='ahead'?'1.5px dashed #cfe9e388':'none'};box-shadow:${s==='ahead'?'none':s==='today'?'0 0 0 4px #ec7a4555, 0 6px 8px rgba(5,25,28,.4)':'0 6px 8px rgba(5,25,28,.4)'};
      animation:${s!=='ahead'&&P.PF.motion?`pf-bob ${(4+P.rnd()*3).toFixed(1)}s ease-in-out infinite`:'none'}">${s==='kept'&&i%4===1?`<div style="position:absolute;left:${(w*.55).toFixed(1)}px;top:-3px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#f0c24a 0 30%,#fbf8f2 34%)"></div>`:''}</div>`); });
  const last=pts[n-1];
  k.push(`<div style="position:absolute;left:${(last[0]-24).toFixed(1)}px;top:${(last[1]-60).toFixed(1)}px;z-index:6;opacity:.9">${P.creature('turtle','#0a2a2f','#0a2a2f',1.3,0,'flat')}</div>`);
  k.push(`<div style="position:absolute;left:${(last[0]-60).toFixed(1)}px;top:${(last[1]-88).toFixed(1)}px;z-index:6;font:italic 400 12px 'Outfit',sans-serif;color:#cfe9e3;white-space:nowrap">day ${n}${n>=30?' · Turtle':''}</div>`);
  k.push(P.glints(W,H,10),P.petals(H,3));
  return k.join('');
}
function jHabitToggle(hid){

function diaryEntry(o){ return {id:uid(), mood:o.mood||null, tagId:o.tagId||null, title:o.title||'', body:o.body,
  date:o.date||today(), createdAt:o.createdAt||Date.now(), photos:o.photos||[],

const fixDiary=e=>{

/* What a given day actually held, derived from sessions and assignments —
   never stored on the entry, so it stays right if you edit a session later
   or backfill a journal entry weeks after the fact. */
function dayStats(dk){
  let net=0, cycles=0; const ratings=[];
  db.sessions.forEach(s=>{
    if(dayKey(s.started)!==dk) return;
    net+=summarize(s).net;
    (s.cycles||[]).forEach(c=>{ cycles++; if(c.rating) ratings.push(c.rating); });
  });
  const tasks=db.assignments.filter(a=>a.done&&a.doneAt&&dayKey(a.doneAt)===dk).length;
  const exams=(db.exams||[]).filter(e=>e.done&&e.doneAt&&dayKey(e.doneAt)===dk).length;
  const avg=ratings.length?ratings.reduce((x,y)=>x+y,0)/ratings.length:null;
  return {net:Math.max(0,net), cycles, tasks, exams, avg, rated:ratings.length};
}
function dayStatsStrip(dk){
  const st=dayStats(dk);
  if(!st.net&&!st.cycles&&!st.tasks&&!st.exams)
    return `<p class="faint" style="font-size:11.5px;margin:0">No focus time or completed tasks tracked this day.</p>`;
  const scoreCol=st.avg==null?null:st.avg>=4?'var(--focus)':st.avg>=3?'var(--gold)':'var(--over)';
  return `<div class="grid" style="grid-template-columns:repeat(3,1fr)">
    ${stat(dur(st.net),'Focused',st.net?'var(--xptx)':null,
       st.cycles?`${st.cycles} cycle${st.cycles===1?'':'s'}`:'no cycles')}
    ${stat(st.tasks,'Tasks done',st.tasks?'var(--focus)':null,
       st.exams?`plus ${st.exams} exam${st.exams===1?'':'s'} taken`:'assignments completed')}
    ${stat(st.avg==null?'—':st.avg.toFixed(1)+' / 5','Focus score',scoreCol,
       st.rated?`${st.rated} of ${st.cycles} cycles rated`:'nothing rated')}
  </div>`;
}

/* A session's closing write-up becomes a Study Block entry on the day the
   session started. Keyed by sessionId so re-saving can never duplicate it. */
function diaryFromSession(s){
  if(!s||!s.journal||!s.journal.trim()) return null;
  db.diary=db.diary||[];
  if(db.diary.some(e=>e.sessionId===s.id)) return null;
  const e=diaryEntry({tagId:'study', title:s.name||'Study block', body:s.journal.trim(),
    date:dayKey(s.started), createdAt:s.ended||Date.now(), sessionId:s.id});
  db.diary.push(e);
  return e;
}

function pickDiaryPhotos(inp){
  const files=[...(inp.files||[])]; if(!files.length) return;
  const MAXD=1100;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{
        const scale=Math.min(1,MAXD/Math.max(im.width,im.height));
        const w=Math.round(im.width*scale), h=Math.round(im.height*scale);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        diaryDraft.photos.push(c.toDataURL('image/jpeg',.82));
        drawDiaryPhotos();
      }; im.src=r.result; };
    r.readAsDataURL(f);
  });
  inp.value='';
}

function hexMix(hex,to,f){

/* ═══════════════ vault (Journal → Vault) ═══════════════
   An Obsidian-style layer over the journal: topics are notes, entries link to
   them, and a graph shows the whole web at once. Three flat id-lists, so cloud
   sync merges them record by record like everything else:
     vaultTopics  {id,name,summary,aliases[],hex,by,created,updated}
     vaultTags    {id,entryId,topicId,why,by,at,off}    entry <-> topic
     vaultLinks   {id,a,b,why,by,at,off}                entry <-> entry
   Hermes proposes all three through inbox.json and you approve them in a
   preview. A tag or link you remove is kept with off:true instead of deleted,
   so the agent is told not to suggest it again. Entry text is never touched:
   a [[Topic]] typed in an entry is read live from the body, never stored. */
const VAULT_PALETTE=['#4f86b3','#715c95','#3f774d','#a96464','#b08d1e','#2f7b7a','#965253','#96518f','#5b7fa6','#8a6f3a'];
function vaultHexFor(name){
  const h=[...vNorm(name)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  return VAULT_PALETTE[h%VAULT_PALETTE.length];
}
function ensureVault(d){
  ['vaultTopics','vaultTags','vaultLinks'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  d.vaultTopics.forEach(t=>{
    if(!Array.isArray(t.aliases)) t.aliases=[];
    if(typeof t.summary!=='string') t.summary='';
    if(!t.hex) t.hex=vaultHexFor(t.name||'');
  });
  return d;
}
const vNorm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const vTopics=()=>db.vaultTopics||(db.vaultTopics=[]);
const vTags  =()=>db.vaultTags  ||(db.vaultTags=[]);
const vLinks =()=>db.vaultLinks ||(db.vaultLinks=[]);
const vTopic =id=>vTopics().find(t=>t.id===id)||null;
const diaryById=id=>(db.diary||[]).find(e=>e.id===id)||null;
function vTopicByName(name){
  const n=vNorm(name); if(!n) return null;
  return vTopics().find(t=>vNorm(t.name)===n)
      || vTopics().find(t=>(t.aliases||[]).some(a=>vNorm(a)===n)) || null;
}
/* [[Name]] and Obsidian's [[Name|shown text]] */
const WIKI_RE=/\[\[([^\[\]\n|]{1,80})(?:\|([^\[\]\n]{1,80}))?\]\]/g;
function wikiNames(body){
  const out=[]; String(body||'').replace(WIKI_RE,(m,n)=>{ out.push(n.trim()); return m; });
  return out.filter(Boolean);
}
function vaultMakeTopic(name,o){
  o=o||{};
  const nm=String(name).trim().slice(0,80);
  const t={id:uid(),name:nm,summary:o.summary||'',aliases:o.aliases||[],hex:o.hex||vaultHexFor(nm),
    by:o.by||'you',created:Date.now(),updated:Date.now()};
  vTopics().push(t); return t;
}
/* typing [[Something]] that isn't a topic yet makes it one — same as Obsidian
   letting you link to a note before it exists */
function vaultWikiSync(e){
  let made=0;
  wikiNames(e&&e.body).forEach(n=>{ if(!vTopicByName(n)){ vaultMakeTopic(n,{by:'you'}); made++; } });
  return made;
}
function vaultTagEntry(entryId,topicId,by,why){
  const ex=vTags().find(g=>g.entryId===entryId&&g.topicId===topicId);
  if(ex){ ex.off=false; ex.at=Date.now(); if(why) ex.why=why; if(by) ex.by=by; return ex; }
  const g={id:uid(),entryId,topicId,why:why||'',by:by||'you',at:Date.now(),off:false};
  vTags().push(g); return g;
}
function vaultLinkEntries(a,b,by,why){
  const ex=vLinks().find(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));
  if(ex){ ex.off=false; ex.at=Date.now(); if(why) ex.why=why; return ex; }
  const l={id:uid(),a,b,why:why||'',by:by||'you',at:Date.now(),off:false};
  vLinks().push(l); return l;
}

/* One pass over the journal: which topics each entry belongs to (explicit
   tags plus [[wikilinks]]) and the reverse. Built once per paint. */
function vaultIndex(){
  const byEntry=new Map(), byTopic=new Map();
  const tagsBy=new Map();
  vTags().forEach(g=>{ if(g.off) return; (tagsBy.get(g.entryId)||tagsBy.set(g.entryId,[]).get(g.entryId)).push(g); });
  (db.diary||[]).forEach(e=>{
    fixDiary(e);
    const refs=new Map();
    (tagsBy.get(e.id)||[]).forEach(g=>{ const t=vTopic(g.topicId); if(t) refs.set(t.id,{topic:t,tag:g,wiki:false}); });
    wikiNames(e.body).forEach(n=>{ const t=vTopicByName(n); if(!t) return;
      const r=refs.get(t.id); if(r) r.wiki=true; else refs.set(t.id,{topic:t,tag:null,wiki:true}); });
    const arr=[...refs.values()];
    byEntry.set(e.id,arr);
    arr.forEach(r=>{ (byTopic.get(r.topic.id)||byTopic.set(r.topic.id,[]).get(r.topic.id)).push({entry:e,ref:r}); });
  });
  byTopic.forEach(list=>list.sort((x,y)=>(y.entry.date||'').localeCompare(x.entry.date||'')));
  return {byEntry,byTopic};
}
function entryLinksFor(id){
  return vLinks().filter(l=>!l.off&&(l.a===id||l.b===id))
    .map(l=>({link:l,other:diaryById(l.a===id?l.b:l.a)})).filter(x=>x.other);
}
function vaultChip(t,extra){
  return `<span class="vchip" style="color:${t.hex};border-color:${t.hex}66;background:${t.hex}14"${extra||''}>${esc(t.name)}</span>`;
}
const byWho=b=>b==='hermes'?'Hermes':b==='agent'?'agent':'you';

/* the entry body with [[links]] made clickable */
function vaultBodyHTML(body){
  const s=String(body||''); let out='', last=0;
  s.replace(WIKI_RE,(m,name,shown,at)=>{
    out+=esc(s.slice(last,at)); last=at+m.length;
    const t=vTopicByName(name);
    out+=`<span class="wikilink${t?'':' ghost'}" onclick="vaultWikiClick('${esc(encodeURIComponent(name.trim()))}')">${esc((shown||name).trim())}</span>`;
    return m;
  });
  return out+esc(s.slice(last));
}
function vaultWikiClick(enc){
  const name=decodeURIComponent(enc);
  const t=vTopicByName(name)||vaultMakeTopic(name,{by:'you'});
  save(); vaultOpenTopic(t.id);
}

/* ── the Topics + Connections block under an entry (calendar view) ── */

  return `<div class="jr-links">
    <div class="row wrapf" style="gap:8px">
      <span class="eyebrow" style="margin-right:6px">Topics</span>
      ${refs.map(r=>`<span class="tchip" style="color:${r.topic.hex};background:${r.topic.hex}24"
          title="${esc(r.tag&&r.tag.why?r.tag.why+' — added by '+byWho(r.tag.by):r.wiki?'Linked with [[ ]] in the text':'Added by '+byWho(r.tag&&r.tag.by))}"
          onclick="vaultOpenTopic('${r.topic.id}')"><i style="background:${r.topic.hex}"></i>${esc(r.topic.name)}${r.tag&&!r.wiki
          ?`<button class="vx" title="Remove from this entry" onclick="event.stopPropagation();vaultUntag('${e.id}','${r.topic.id}')">×</button>`:''}</span>`).join('')}
      <button class="tadd" onclick="vaultAddTopicModal('${e.id}')">+ Topic</button>
      <button class="tadd" onclick="vaultLinkModal('${e.id}')">+ Connect</button>

        <span style="font:500 14.5px/1.2 'Outfit',sans-serif;color:var(--tx)">${esc(other.title||'Untitled')} <span style="color:var(--faint);font-weight:400">· ${dMini(other.date)}</span></span>
        ${link.why?`<span style="font:400 13px/1.3 'Outfit',sans-serif;color:var(--dim)">${esc(link.why)}</span>`:''}
      </div>
      <button class="vx" title="Disconnect" onclick="event.stopPropagation();vaultUnlink('${link.id}')">×</button>
      <span style="color:var(--faint)">→</span>
    </div>`).join('')}
  </div>`;
}
function vaultUntag(entryId,topicId){
  const g=vTags().find(x=>x.entryId===entryId&&x.topicId===topicId);
  if(g){ g.off=true; g.at=Date.now(); }
  save(); paintDiary();
}
function vaultUnlink(id){
  const l=vLinks().find(x=>x.id===id); if(l){ l.off=true; l.at=Date.now(); }
  save(); paintDiary();
}
function vaultAddTopicModal(entryId){

  modal(`<h2>Add a topic</h2>
    <p class="dim" style="font-size:12.5px;margin:5px 0 14px">Pick one you already have or type a new one.
      You can also write <b>[[Topic]]</b> anywhere in an entry.</p>
    <input id="vt-name" list="vt-list" placeholder="Sleep, Calc anxiety, Mom…" autocomplete="off">
    <datalist id="vt-list">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    ${names.length?`<div class="row wrapf" style="gap:6px;margin-top:12px">${vTopics().slice(0,24).map(t=>
      vaultChip(t,` onclick="$('vt-name').value=this.textContent;vaultAddTopic('${entryId}')"`)).join('')}</div>`:''}
    <div class="row" style="gap:9px;margin-top:18px">
      <button class="primary" onclick="vaultAddTopic('${entryId}')">Add</button>

  const inp=$('vt-name'); inp.focus();

}
function vaultAddTopic(entryId){
  const name=$('vt-name').value.trim(); if(!name){ toast('Type a topic name.'); return; }
  const t=vTopicByName(name)||vaultMakeTopic(name,{by:'you'});
  vaultTagEntry(entryId,t.id,'you');
  save(); closeModal(); paintDiary();
}
function vaultLinkModal(entryId){
  const others=(db.diary||[]).filter(x=>x.id!==entryId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!others.length){ toast('Write another entry first — there is nothing to connect this to yet.'); return; }
  modal(`<h2>Connect to another entry</h2>
    <label class="lbl" style="margin-top:14px">Entry</label>
    <select id="vl-to">${others.map(o=>`<option value="${o.id}">${esc(dShort(o.date))} · ${esc(o.title||'Untitled')}</option>`).join('')}</select>
    <label class="lbl" style="margin-top:14px">Why <span class="faint" style="text-transform:none;letter-spacing:0">— optional</span></label>
    <input id="vl-why" placeholder="Same worry, a month apart" autocomplete="off">
    <div class="row" style="gap:9px;margin-top:18px">
      <button class="primary" onclick="vaultLinkSave('${entryId}')">Connect</button>
      <button class="ghost" onclick="closeModal()">Cancel</button></div>`);
}
function vaultLinkSave(entryId){
  vaultLinkEntries(entryId,$('vl-to').value,'you',$('vl-why').value.trim());
  save(); closeModal(); paintDiary();
}

/* ── navigation between the calendar and the vault ── */
let diaMode='cal', diaFromVault=false, diaShownMode='cal';
let vaultSel=null, vaultQ='', vaultShowEntries=true;
function diaSetMode(m){ diaMode=m; diaFromVault=false; if(m==='vault'){ diaSel=null; diaEntrySel=null; } paintDiary(); }
function vaultOpenTopic(id){
  diaMode='vault'; diaFromVault=false; diaSel=null; diaEntrySel=null;
  vaultSel=id; vaultQ='';
  if(cur!=='dia') tab('dia'); else paintDiary();
  if(VG){ VG.focus='t:'+id; vgKick(); }
  const p=$('vault-panel'); if(p&&window.innerWidth<=760) p.scrollIntoView({behavior:'smooth',block:'start'});
}
function vaultOpenEntry(id,keepReturn){
  const e=diaryById(id); if(!e) return;
  diaFromVault=keepReturn?diaFromVault:(diaMode==='vault');
  diaMode='cal'; diaCal=e.date.slice(0,7); diaSel=e.date; diaEntrySel=e.id;
  paintDiary();
}

/* an entry's colour on the water: its mood if it has one, else its tag */
const entryInk=e=>e.mood?MOOD_INK[e.mood]||diaMoodInfo(e.mood).hex:tagWater(e.tagId);
/* ── the vault page ── */
let VX=null;     // index for the current paint

  $('dia-body').innerHTML=`<div class="vt">${diaHeader()}

      ${hermes?'Hermes can tag and connect them for you. Nothing is added until you approve it.':'Add a topic from any entry, or write [[Topic]] in its text.'}</p>
    ${hermes?`<button onclick="vaultCopyAsk(this)">Copy request for Hermes</button><button class="gh" onclick="checkInbox()">Check inbox</button>`:''}
  </div>`:''}
  <div class="vt-grid">
    <div class="vt-map water">
      <div class="amb" style="inset:auto;left:50%;top:50%;width:900px;height:620px;margin:-310px 0 0 -450px">${amb}</div>
      <canvas id="vg"></canvas>
      <div class="vt-leg">
        <span><i style="width:12px;height:12px;border-radius:50%;background:#6f9e7a"></i>Topic</span>
        <span><svg width="18" height="9" viewBox="-32 -12 56 24"><path d="M-17 0 L-30 -8 Q-26 0 -30 8 Z" fill="#f0b35a"/><ellipse cx="-2" cy="0" rx="17" ry="7" fill="#f0b35a"/><ellipse cx="9" cy="0" rx="10" ry="6.5" fill="#f0b35a"/></svg>Entry</span>

        :!topics.length?`<div class="vt-empty" style="top:auto;bottom:40px;transform:translateX(-50%)">No topics yet, so every entry swims free.</div>`:''}
    </div>
    <div class="vt-side" id="vault-panel"></div>
  </div></div>`;
  paintVaultSide();
  vgInit();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>vgDraw());

function vaultSearch(q){ vaultQ=q; if(q) vaultSel=null; paintVaultSide(); vgDraw(); }
function vaultMatchTopic(t,q){
  return vNorm(t.name).includes(q)||(t.aliases||[]).some(a=>vNorm(a).includes(q))||vNorm(t.summary).includes(q);
}
function vaultMatchEntry(e,q){ return vNorm(e.title).includes(q)||vNorm(e.body).includes(q); }
function paintVaultSide(){
  if(!VX) VX=vaultIndex();
  const q=vNorm(vaultQ);
  const P=$('vault-panel'); if(!P) return;
  const count=t=>(VX.byTopic.get(t.id)||[]).length;
  const list=vTopics().slice().sort((a,b)=>count(b)-count(a)||a.name.localeCompare(b.name));
  const MAXT=14;
  const tabs=`<div class="vt-tabs">${list.slice(0,MAXT).map(t=>`<button class="${vaultSel===t.id?'on':''}" onclick="vaultPick('${t.id}')"><i style="background:${t.hex}"></i>${esc(t.name)}</button>`).join('')}
    <button class="add" onclick="vaultNewTopicModal()">+ Topic</button></div>
    ${list.length>MAXT?`<span class="pcard-s" style="margin-top:-8px">${list.length-MAXT} more topic${list.length-MAXT===1?'':'s'} — search to find them</span>`:''}`;
  const t=vaultSel&&vTopic(vaultSel);
  P.innerHTML=tabs+(t?vaultTopicPage(t):q?vaultSearchResults(q):vaultOverview());
}
function vaultPick(id){
  vaultSel=vaultSel===id?null:id;
  if(vaultSel){ vaultQ=''; const qi=$('vault-q'); if(qi) qi.value=''; if(VG){ VG.focus='t:'+id; vgKick(); } }
  paintVaultSide(); vgDraw();
}
function vaultEntryRow(e,why,extra){
  return `<div class="vt-e" onclick="vaultOpenEntry('${e.id}')">
    <i style="background:${entryInk(e)}"></i>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
      <span class="t">${esc(e.title||'Untitled')}</span>
      <span class="d">${dMini(e.date)}${e.date.slice(0,4)!==today().slice(0,4)?', '+e.date.slice(0,4):''}</span>
      ${why?`<span class="w">${why}</span>`:''}
    </div>${extra||''}
  </div>`;
}
function vaultSnippet(body,q){
  const s=String(body||'').replace(/\s+/g,' '); const i=vNorm(s).indexOf(q);
  if(i<0) return esc(s.slice(0,120))+(s.length>120?'…':'');
  const a=Math.max(0,i-50), b=Math.min(s.length,i+q.length+70);
  return (a?'…':'')+esc(s.slice(a,i))+`<mark>${esc(s.slice(i,i+q.length))}</mark>`+esc(s.slice(i+q.length,b))+(b<s.length?'…':'');
}
function vaultSearchResults(q){
  const ts=vTopics().filter(t=>vaultMatchTopic(t,q));
  const es=(db.diary||[]).filter(e=>vaultMatchEntry(e,q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <span class="eyebrow">Search · “${esc(vaultQ.trim())}”</span>
    ${ts.length?`<div class="vt-tabs">${ts.map(t=>`<button onclick="vaultPick('${t.id}')"><i style="background:${t.hex}"></i>${esc(t.name)}</button>`).join('')}</div>`:''}
    <div class="vt-es" style="border:none;padding:0">${es.length?es.map(e=>vaultEntryRow(e,vaultSnippet(e.body,q))).join('')
      :`<p class="pcard-s" style="line-height:1.5">No entries mention that.</p>`}</div></div>`;
}

      gather around the same pad, so the themes you keep coming back to form little schools.</p>
    <div class="jr-st">${tile(topics.length,'Topics')}${tile(n,'Entries')}${tile(loose,'Free-swimming',loose?'#a8762f':null)}</div>

        :`On your computer, Hermes can tag and connect entries for you. Here you can add topics by hand.`}
        You can also add a topic from any entry, or write <b>[[Topic]]</b> in its text.</p>
      ${hermes?`<div class="row wrapf" style="gap:8px"><button class="pbtn sm" onclick="vaultCopyAsk(this)">Copy request for Hermes</button>
        <button class="pbtn sm" onclick="checkInbox()">Check for suggestions</button></div>`:''}
    </div></div>`;
}
function vaultCopyAsk(btn){
  const txt='Open my Catching Days folder, read AGENTS.md and agent-context.md, and do Job 3: organize my journal vault. '+
    'Tag the entries that are not in the vault yet, connect entries that belong together, and write everything to inbox.json.';
  navigator.clipboard.writeText(txt).then(()=>{ const o=btn.textContent; btn.textContent='Copied'; setTimeout(()=>btn.textContent=o,1400); })
    .catch(()=>toast('Copy failed.'));
}
function vaultTopicPage(t){
  const list=VX.byTopic.get(t.id)||[];
  const co=new Map();
  list.forEach(({entry})=>(VX.byEntry.get(entry.id)||[]).forEach(r=>{ if(r.topic.id!==t.id) co.set(r.topic.id,(co.get(r.topic.id)||0)+1); }));
  const related=[...co.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12).map(([id,n])=>({t:vTopic(id),n})).filter(x=>x.t);
  const dates=list.map(x=>x.entry.date).filter(Boolean).sort();
  const who=t.by==='hermes'?'added by Hermes, approved by you':t.by==='agent'?'added by an agent, approved by you':'added by you';
  return `<div style="display:flex;flex-direction:column;gap:12px;padding-top:6px">
      <div class="vt-tn"><i style="background:conic-gradient(from 200deg,transparent 0 34deg,${t.hex} 34deg 360deg)"></i><b>${esc(t.name)}</b></div>
      <div class="pcard-s" style="line-height:1.45">${list.length} entr${list.length===1?'y':'ies'} · ${who}${
        dates.length>1?` · ${dShort(dates[0])} to ${dShort(dates[dates.length-1])}`:''}</div>
      ${t.summary?`<p class="vt-sum">${esc(t.summary)}</p>`
        :`<p class="pcard-s" style="line-height:1.5;margin:0">No summary yet. Hermes writes one when it tags entries, or add your own with Edit.</p>`}
      ${t.aliases.length?`<div class="vt-al"><em class="eyebrow" style="font-style:normal;margin-right:4px">Also called</em>${t.aliases.map(a=>`<span>${esc(a)}</span>`).join('')}</div>`:''}
      <div class="row" style="gap:8px"><button class="pbtn sm" onclick="vaultEditTopicModal('${t.id}')">Edit</button>
        <button class="pbtn sm" style="border-color:transparent;color:var(--faint)" onclick="vaultDeleteTopicModal('${t.id}')">Delete</button></div>
    </div>
    ${related.length?`<div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Often alongside</span>
      <div class="vt-tabs">${related.map(x=>`<button onclick="vaultPick('${x.t.id}')" title="${x.n} shared entr${x.n===1?'y':'ies'}"><i style="background:${x.t.hex}"></i>${esc(x.t.name)}</button>`).join('')}</div></div>`:''}

          ref.tag&&ref.tag.why?`“${esc(ref.tag.why)}”`:ref.wiki?'Linked in the text':'',
          ref.tag&&!ref.wiki?`<button class="vx" title="Remove from this entry" onclick="event.stopPropagation();vaultUntagHere('${entry.id}','${t.id}')">×</button>`:'')).join('')
        :`<p class="pcard-s" style="line-height:1.5">Nothing tagged with this yet.</p>`}
    </div>`;
}

}
function vaultSaveTopic(id){
  const name=$('vte-name').value.trim(); if(!name){ toast('A topic needs a name.'); return; }
  const clash=vTopicByName(name); if(clash&&clash.id!==id){ toast(`“${clash.name}” already exists.`); return; }

  vaultSel=t.id; save(); closeModal(); if(cur==='dia'&&diaMode==='vault') paintVault(); else paintDiary();
}
function vaultDeleteTopicModal(id){

function vaultDeleteTopic(id){

/* ── graph ──
   A small force layout on a canvas: nodes push each other apart, links pull
   them together, a weak pull keeps everything near the middle. Positions are
   kept by node id between repaints so the picture doesn't reshuffle every
   time you click something. */
let VG=null;
const VG_POS=new Map();
function vgBuild(){
  const nodes=[], edges=[], by=new Map();
  const add=n=>{ const p=VG_POS.get(n.id);
    if(p){ n.x=p.x; n.y=p.y; } else { const a=Math.random()*Math.PI*2, r=40+Math.random()*120; n.x=Math.cos(a)*r; n.y=Math.sin(a)*r; }
    n.vx=0; n.vy=0; nodes.push(n); by.set(n.id,n); };
  vTopics().forEach(t=>{ const c=(VX.byTopic.get(t.id)||[]).length;
    add({id:'t:'+t.id,kind:'topic',ref:t.id,label:t.name,hex:t.hex,r:18+7*Math.sqrt(c),count:c,t}); });
  if(vaultShowEntries){
    (db.diary||[]).forEach(e=>add({id:'e:'+e.id,kind:'entry',ref:e.id,e,
      label:`${e.title||'Untitled'} · ${dShort(e.date)}`,hex:entryInk(e),ang:vgAng(e.id),r:10}));
    VX.byEntry.forEach((refs,eid)=>refs.forEach(r=>edges.push({a:'e:'+eid,b:'t:'+r.topic.id,len:100})));
    vLinks().forEach(l=>{ if(!l.off) edges.push({a:'e:'+l.a,b:'e:'+l.b,len:80,link:true}); });
  } else {
    const co=new Map();
    VX.byEntry.forEach(refs=>{ const ids=refs.map(r=>r.topic.id).sort();
      for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){ const k=ids[i]+'|'+ids[j]; co.set(k,(co.get(k)||0)+1); } });
    co.forEach((w,k)=>{ const [a,b]=k.split('|'); edges.push({a:'t:'+a,b:'t:'+b,len:200/Math.sqrt(w),w}); });
  }
  const E=edges.filter(ed=>{ ed.s=by.get(ed.a); ed.d=by.get(ed.b); return ed.s&&ed.d; });
  const nb=new Map(nodes.map(n=>[n.id,new Set()]));
  E.forEach(ed=>{ nb.get(ed.a).add(ed.b); nb.get(ed.b).add(ed.a); });

  return {nodes,edges:E,by,nb};
}
function vgInit(){
  const cv=$('vg'); if(!cv) return;
  const g=vgBuild();
  const keep=VG&&VG.view?VG.view:null;
  VG={cv,ctx:cv.getContext('2d'),...g,view:keep||{x:0,y:0,k:1},alpha:1,hover:null,drag:null,
    focus:VG&&VG.focus||null,raf:0,fitted:!!keep,ptrs:new Map()};
  const newcomers=g.nodes.some(n=>!VG_POS.has(n.id));
  if(!newcomers) VG.alpha=0.25;
  vgSize();
  const ro=new ResizeObserver(()=>{ if(!cv.isConnected){ ro.disconnect(); return; } vgSize(); vgDraw(); });
  ro.observe(cv.parentNode);
  cv.addEventListener('pointerdown',vgDown);
  cv.addEventListener('pointermove',vgMove);
  cv.addEventListener('pointerup',vgUp);
  cv.addEventListener('pointercancel',vgUp);
  cv.addEventListener('pointerleave',()=>{ if(VG&&!VG.drag){ VG.hover=null; vgDraw(); } });
  cv.addEventListener('wheel',vgWheel,{passive:false});
  if(!keep){ for(let i=0;i<320&&VG.alpha>0.02;i++) vgStep(); vgFit(true); }
  vgKick();
}
function vgSize(){
  const cv=VG.cv, r=cv.parentNode.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  VG.w=r.width; VG.h=r.height;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  VG.dpr=dpr;
}
function vgStep(){
  const N=VG.nodes, a=VG.alpha;
  for(let i=0;i<N.length;i++){ const p=N[i];
    for(let j=i+1;j<N.length;j++){ const q=N[j];
      let dx=q.x-p.x, dy=q.y-p.y, d2=dx*dx+dy*dy;
      if(d2<1){ dx=Math.random()-.5; dy=Math.random()-.5; d2=1; }
      if(d2>360000) continue;
      const d=Math.sqrt(d2), f=Math.min(30,(p.kind==='topic'&&q.kind==='topic'?320:p.kind==='topic'||q.kind==='topic'?150:110)*a/d);
      const fx=dx/d*f, fy=dy/d*f;
      p.vx-=fx; p.vy-=fy; q.vx+=fx; q.vy+=fy;
    } }
  VG.edges.forEach(ed=>{ const p=ed.s, q=ed.d;
    const dx=q.x-p.x, dy=q.y-p.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-ed.len)*0.08*a*(ed.w?Math.min(2,ed.w):1), fx=dx/d*f, fy=dy/d*f;
    const wp=p.kind==='topic'?0.35:1, wq=q.kind==='topic'?0.35:1;
    p.vx+=fx*wp; p.vy+=fy*wp; q.vx-=fx*wq; q.vy-=fy*wq; });
  N.forEach(n=>{
    const deg=VG.nb.get(n.id).size;
    const pull=deg?0.008:0.02;       // loose entries sit in a ring just outside the clusters
    n.vx-=n.x*pull*a; n.vy-=n.y*pull*a;
    if(VG.drag&&VG.drag.node===n){ n.vx=0; n.vy=0; return; }
    n.vx*=0.62; n.vy*=0.62; n.x+=n.vx; n.y+=n.vy;
    VG_POS.set(n.id,{x:n.x,y:n.y});
